[package]
name = "msconnector-ext-proc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "msconnector-ext-proc"
path = "src/main.rs"

[dependencies]
msconnector-core = { path = "../msconnector-core" }
msconnector-ffi = { path = "../msconnector-ffi" }
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tokio-stream = "0.1"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"

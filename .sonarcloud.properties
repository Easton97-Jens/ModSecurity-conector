# Automatic analysis uses the repository's supported Python minor version.
sonar.python.version=3.15
sonar.sources=.
sonar.tests=.
# Test inclusions also remove these files from the source scope automatically.
# Go reserves *_test.go for test builds; keep those files analyzed as tests.
sonar.test.inclusions=tests/**/*.py,**/test_*.py,**/*_test.py,**/*_test.go

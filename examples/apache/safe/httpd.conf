# Bounded Phase 4 / RESPONSE_BODY example for Apache httpd.
# Apache appends each normalized response bucket once and forwards
# non-terminal output without waiting for EOS. Phase 4 completes once at EOS.

LoadModule security3_module /usr/lib/apache2/modules/mod_security3.so

<IfModule security3_module>
    # Host integration is separate from SecRuleEngine in the rules file.
    modsecurity on
    modsecurity_rules_file /etc/modsecurity/modsecurity-phase4.conf
    modsecurity_use_error_log on
    # Safe records a disruptive P4 decision after response commitment as
    # log_only; bytes already forwarded are never rewritten.
    modsecurity_phase4_mode safe
    # Do not set the deprecated modsecurity_phase4_content_types_file here:
    # it cannot narrow the universal P4 inspection path.
    # SecResponseBodyMimeType in the rules file selects libModSecurity inspection.
    # Protect and rotate metadata-only connector events.
    modsecurity_phase4_log /var/log/modsecurity/apache-phase4.jsonl
    # The configurable 1 MiB byte cap and a fixed, non-configurable
    # 4,096-normalized-bucket cap fail closed before the offending bucket forwards.
    modsecurity_phase4_body_limit 1048576
    # Optional per-request correlation; mutually exclusive with the static ID.
    # modsecurity_transaction_id_expr "%{REQUEST_URI}"
    # Optional static correlation, unsuitable for concurrent production traffic.
    # modsecurity_transaction_id example-apache-transaction
    # Remote rules require an operator-managed key and URL; intentionally not
    # active in a checked-in example.
    # modsecurity_rules_remote key https://rules.example.invalid/managed.conf
    # Deprecated compatibility parser; intentionally inactive because it does
    # not narrow Apache's universal P4 inspection path.
    # modsecurity_phase4_content_types_file /etc/modsecurity/phase4-content-types.conf
</IfModule>

CustomLog /var/log/apache2/access.log combined
ErrorLog /var/log/apache2/error.log

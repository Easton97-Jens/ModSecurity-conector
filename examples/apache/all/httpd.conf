# Comprehensive source-backed Apache httpd profile.
# "all" is a complete visible configuration, not a phase4_mode value.
# Strict remains the parser-supported late-intervention policy.

LoadModule security3_module /usr/lib/apache2/modules/mod_security3.so

<IfModule security3_module>
    modsecurity on
    modsecurity_rules_file /etc/modsecurity/modsecurity-phase4.conf
    modsecurity_use_error_log on
    modsecurity_phase4_mode strict
    modsecurity_phase4_log /var/log/modsecurity/apache-phase4.jsonl
    modsecurity_phase4_body_limit 1048576

    # Deprecated compatibility input; it cannot change Apache's progressive
    # output order. Use SecResponseBodyMimeType in the rule file for MIME selection.
    # modsecurity_phase4_content_types_file /etc/modsecurity/phase4-content-types.conf

    # Leave host-correlation overrides inactive unless the installed host can
    # supply a validated, unique value. Common always generates the canonical
    # transaction ID independently; URI-derived and static values are unsafe.
    # modsecurity_transaction_id_expr "<operator-validated unique host expression>"
    # modsecurity_transaction_id example-apache-transaction

    # Remote rules require operator-managed credentials and a verified URL;
    # this loadable example intentionally keeps that network input inactive.
    # modsecurity_rules_remote key https://rules.example.invalid/managed.conf
</IfModule>

CustomLog /var/log/apache2/access.log combined
ErrorLog /var/log/apache2/error.log

# Comprehensive source-backed NGINX profile.
# "all" is a complete visible configuration, not a phase4_mode value.
# Strict remains the parser-supported late-intervention policy.

load_module modules/ngx_http_modsecurity_module.so;

http {
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity-phase4.conf;
    modsecurity_phase4_mode strict;
    modsecurity_phase4_content_types_file /etc/modsecurity/phase4-content-types.conf;
    modsecurity_phase4_log /var/log/modsecurity/nginx-phase4.jsonl;
    modsecurity_phase4_body_limit 1048576;
    modsecurity_use_error_log on;

    # Leave the override inactive unless the installed host supplies a
    # validated, server-generated request ID. Common's canonical ID remains
    # authoritative, so URI-derived values must not be used for correlation.
    # modsecurity_transaction_id $request_id;

    # Remote rules require operator-managed credentials and a verified URL;
    # this loadable example intentionally keeps that network input inactive.
    # modsecurity_rules_remote key https://rules.example.invalid/managed.conf;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 127.0.0.1:8080;
        server_name example.test;
        gzip off;

        location / {
            proxy_pass http://app_backend;
        }
    }
}

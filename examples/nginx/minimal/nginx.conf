# Minimal bounded P1--P4 ModSecurity profile for NGINX.
# Copy the relevant directives into /etc/nginx/nginx.conf or a site file.

# The dynamic module must match the installed NGINX ABI.
load_module modules/ngx_http_modsecurity_module.so;

http {
    # Enables NGINX integration; SecRuleEngine remains a rule-file setting.
    modsecurity on;
    # The NGINX worker must be able to read this reviewed rule file.
    modsecurity_rules_file /etc/modsecurity/modsecurity-phase4.conf;
    modsecurity_phase4_mode minimal;
    modsecurity_phase4_body_limit 1048576;
    modsecurity_use_error_log on;
    modsecurity_phase4_log /var/log/modsecurity/nginx-phase4.jsonl;
    # The MIME file is optional and must exist when enabled; keep it inactive
    # here because the checked-in rule file already selects MIME types.
    # modsecurity_phase4_content_types_file /etc/modsecurity/phase4-content-types.conf;
    # Optional NGINX request-id correlation; enable only when the host provides
    # the request_id variable.
    # modsecurity_transaction_id $request_id;
    # Remote rules require operator-managed credentials and a verified URL.
    # modsecurity_rules_remote key https://rules.example.invalid/managed.conf;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name example.test;

        location / {
            proxy_pass http://app_backend;
        }
    }
}

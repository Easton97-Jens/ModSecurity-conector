# Bounded Phase 4 / RESPONSE_BODY strict-abort example for NGINX.
# This mode can abort an already-started transfer; it is not full buffering parity.

load_module modules/ngx_http_modsecurity_module.so;

http {
    # Enables host integration; the engine switch remains in the rules file.
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity/modsecurity-phase4.conf;
    # Strict is a parser-supported policy shape, not a guaranteed later 403.
    modsecurity_phase4_mode strict;
    modsecurity_phase4_content_types_file /etc/modsecurity/phase4-content-types.conf;
    modsecurity_phase4_log /var/log/modsecurity/nginx-phase4.jsonl;
    modsecurity_phase4_body_limit 1048576;
    modsecurity_use_error_log on;
    # Optional NGINX request-id correlation; enable only when the host provides
    # the request_id variable.
    # modsecurity_transaction_id $request_id;
    # Remote rules are intentionally inactive: they require operator-managed
    # credentials and a verified endpoint.
    # modsecurity_rules_remote key https://rules.example.invalid/managed.conf;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    upstream app_backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 80;
        server_name example.test;

        # Keep compression after ModSecurity until you have verified whether
        # this connector sees compressed or uncompressed bytes in your build.
        gzip off;

        location / {
            proxy_pass http://app_backend;
        }
    }
}

# Envoy ext_authz all: ext_authz P1/P2 plus private-UDS observer P3/P4.
enabled=on
rules_file=/etc/modsecurity/no-crs-baseline.conf
# Mutually exclusive rule sources; enable exactly one only after review:
# rules_inline=SecRuleEngine On
# rules_remote_url=https://rules.invalid/reviewed/no-crs.conf
# rules_remote_key=reviewed-no-crs
transaction_id_header=x-request-id
# Static transaction IDs are unsafe and intentionally inactive:
# transaction_id=operator-supplied-id
# phase4_content_types_file=/etc/modsecurity/phase4-content-types.conf
request_body_mode=buffered
response_body_mode=streaming
request_body_limit=4096
response_body_limit=4096
body_limit_action=reject
phase4_mode=strict
late_intervention_timeout=5000
default_block_status=403
default_error_status=500
use_error_log=on
max_header_count=128
max_header_name_size=256
max_header_value_size=8192
max_total_header_bytes=32768
max_event_json_bytes=16384
event_path=/var/log/modsecurity/envoy-ext-authz-all-events.jsonl
# Alias accepted by the parser; keep one event path setting active:
# phase4_event_log=/var/log/modsecurity/envoy-ext-authz-all-events.jsonl

# Comprehensive HAProxy SPOE/SPOP + native HTX response-companion profile.
# "all" is a complete visible configuration, not a phase4-mode value.
# Strict remains the parser-supported late-intervention policy.

global
    log stdout format raw local0
    tune.bufsize 65536

defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s

frontend fe_modsecurity
    bind 127.0.0.1:8080
    unique-id-format %[uuid()]
    option http-buffer-request
    filter spoe engine modsecurity config /etc/haproxy/spoe-spop/all/spoe.cfg
    filter modsecurity-htx response-companion-socket /run/user/1000/msconnector/haproxy-spoe-spop-all.sock response-companion-timeout-ms 2000 response-companion-uid 1000 response-companion-gid 1000 phase4-mode strict
    http-request send-spoe-group modsecurity request-check
    http-request redirect location %[var(txn.modsec.redirect_url)] code 302 if { var(txn.modsec.action) -m str redirect } { var(txn.modsec.redirect_url) -m found }
    http-request silent-drop if { var(txn.modsec.action) -m str drop }
    http-request deny status 401 if { var(txn.modsec.status) -m int 401 }
    http-request deny status 406 if { var(txn.modsec.status) -m int 406 }
    http-request deny status 429 if { var(txn.modsec.status) -m int 429 }
    http-request deny status 503 if { var(txn.modsec.status) -m int 503 }
    http-request deny status 403 if { var(txn.modsec.blocked) -m bool }
    default_backend be_app

backend be_app
    mode http
    server app 127.0.0.1:8081

backend be_spoa_modsecurity
    mode spop
    timeout connect 1s
    timeout server 3s
    server agent 127.0.0.1:12345

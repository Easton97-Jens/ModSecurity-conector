# Comprehensive source-backed SPOA/SPOP runtime configuration.
# Parsed by connectors/haproxy/src/haproxy_spop_diagnostic_runtime.c.
listen=127.0.0.1:12345
host=127.0.0.1
port=12345
rules-file=/etc/modsecurity/no-crs-baseline.conf
# Alternate operator-owned rule sources (use one source in a deployment):
# rules-dir=/etc/modsecurity/rules
# modsecurity-conf=/etc/modsecurity/modsecurity.conf
# crs-root=/etc/owasp-crs
decision-log=/var/log/haproxy-modsecurity/all-decision.jsonl
audit-log=/var/log/haproxy-modsecurity/all-audit.jsonl
log-file=/var/log/haproxy-modsecurity/all-agent.log
ready-file=/run/haproxy-modsecurity/all.ready
pid-file=/run/haproxy-modsecurity/all.pid
port-file=/run/haproxy-modsecurity/all.port
mode=block
fail-mode=closed
runtime-mode=production
variant=all
case=all
debug=off
request-body-limit=65532
response-companion=native-htx
response-companion-socket=/run/user/1000/msconnector/haproxy-spoe-spop-all.sock
response-companion-uid=1000
response-companion-gid=1000
response-body-limit=65532
response-body-timeout=2000
response-phases=true
enable-response-headers=true
expected-status=403
spoe-timeout=2000
worker-count=8
max-transactions=64

# Logical HAProxy SPOE/SPOP + native HTX response companion, safe profile.
# Safe records late P4 decisions after commit; it does not rewrite a status.
global
    log stdout format raw local0
    tune.bufsize 65536

defaults
    mode http
    timeout connect 1s
    timeout client 5s
    timeout server 5s

frontend fe_modsecurity
    bind 127.0.0.1:8080
    unique-id-format %[uuid()]
    option http-buffer-request
    filter spoe engine modsecurity config /etc/haproxy/spoe-spop/safe/spoe.cfg
    filter modsecurity-htx response-companion-socket /run/user/1000/msconnector/haproxy-spoe-spop-safe.sock response-companion-timeout-ms 2000 response-companion-uid 1000 response-companion-gid 1000 phase4-mode safe
    http-request send-spoe-group modsecurity request-check
    http-request deny status 403 if { var(txn.modsec.blocked) -m bool }
    default_backend be_app

backend be_app
    mode http
    server app 127.0.0.1:8081

backend be_spoa_modsecurity
    mode spop
    timeout connect 1s
    timeout server 3s
    server agent 127.0.0.1:12345

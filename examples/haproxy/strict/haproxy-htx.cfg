# Native HTX filter reference with the parser-supported strict P4 policy.
# Strict requests the host's late-intervention policy; the current source does
# not promise a client-visible abort after response bytes were committed.
global
    log stdout format raw local0
    tune.bufsize 65536

defaults
    mode http
    timeout connect 2s
    timeout client 5s
    timeout server 5s

frontend htx_in
    bind 127.0.0.1:8080
    option http-buffer-request
    filter modsecurity-htx rules-file /etc/modsecurity/no-crs-baseline.conf phase4-mode strict
    default_backend htx_upstream

backend htx_upstream
    server upstream 127.0.0.1:8081

# Comprehensive source-backed native HTX profile.
# "all" is a complete visible configuration, not a phase4-mode value.
# Strict remains the parser-supported late-intervention policy.

global
    log stdout format raw local0
    tune.bufsize 65536

defaults
    mode http
    timeout connect 2s
    timeout client 5s
    timeout server 5s

frontend htx_in
    bind 127.0.0.1:8080
    option http-buffer-request
    filter modsecurity-htx rules-file /etc/modsecurity/no-crs-baseline.conf phase4-mode strict
    default_backend htx_upstream

backend htx_upstream
    server upstream 127.0.0.1:8081

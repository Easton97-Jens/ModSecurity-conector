# Private Stock-lighttpd backend behind the traffic-owning sidecar.
# The sidecar, not this backend, owns P1-P4 and the client connection.
server.modules = ( "mod_accesslog" )
server.document-root = "/srv/lighttpd/htdocs"
server.bind = "127.0.0.1"
server.port = 8081
server.errorlog = "/var/log/lighttpd/stock-backend-error.log"
server.pid-file = "/run/lighttpd/stock-backend.pid"
server.upload-dirs = ( "/var/tmp/lighttpd-stock-upload" )

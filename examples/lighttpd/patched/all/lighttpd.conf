# Patched native lighttpd `all`: complete bounded P1-P4, strict phase4 mode.
# Scope is identity HTTP/1.1 entities through the local private upstream.
server.compat-module-load = "disable"
server.modules = ( "mod_proxy", "mod_msconnector" )
server.document-root = "/srv/lighttpd/htdocs"
server.bind = "127.0.0.1"
server.port = 8080
server.errorlog = "/var/log/lighttpd/patched-error.log"
server.pid-file = "/run/lighttpd/patched.pid"
server.upload-dirs = ( "/var/tmp/lighttpd-patched-upload" )
server.stream-response-body = 1
msconnector.enabled = "enable"
msconnector.config-file = "/etc/lighttpd/msconnector-patched-all.conf"
msconnector.expose-host-transaction-id = "enable"
msconnector.request-body-gate = "pre-upstream"
proxy.server = ( "/" => ( ( "host" => "127.0.0.1", "port" => 8081 ) ) )

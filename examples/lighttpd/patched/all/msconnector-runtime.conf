# Patched native lighttpd `all`: complete bounded P1-P4 with strict semantics.
enabled=on
rules_file=/etc/modsecurity/no-crs-baseline.conf
# Mutually exclusive rule sources; enable exactly one only after review:
# rules_inline=SecRuleEngine On
# rules_remote_key=x-rules-release
# rules_remote_url=https://rules.invalid/reviewed/no-crs.conf
transaction_id_header=x-modsec-transaction-id
# Static transaction IDs are unsafe and intentionally inactive:
# transaction_id=operator-static-id
request_body_mode=streaming
response_body_mode=streaming
request_body_limit=1048576
response_body_limit=1048576
body_limit_action=reject
phase4_mode=strict
late_intervention_timeout=10000
default_block_status=403
default_error_status=500
use_error_log=on
max_header_count=256
max_header_name_size=256
max_header_value_size=8192
max_total_header_bytes=65536
max_event_json_bytes=16384
event_path=/var/log/lighttpd/msconnector-patched-all-events.jsonl
# Optional source-backed P4/event settings; enable only with reviewed files:
# phase4_event_log=/var/log/lighttpd/msconnector-patched-all-events.jsonl
# phase4_content_types_file=/etc/lighttpd/phase4-content-types.conf

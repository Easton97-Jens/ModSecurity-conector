# Common runtime example for the stock native lighttpd module.
# Replace both absolute example paths before using this file. The stock harness
# and the separate full-lifecycle patched-host target generate executable copies
# with managed absolute paths; their narrow smokes keep both body modes disabled.
enabled=on
rules_file=/absolute/path/to/common/rules/modsecurity_targeted_smoke.conf
transaction_id_header=x-request-id
request_body_mode=none
# Patched HTTP/1.1 P2 profile only: set request_body_mode=streaming together
# with the module directive below. The gate withholds upstream dispatch until
# request-body EOS and the Common P2 decision are complete.
# request_body_mode=streaming
# In the lighttpd server config: msconnector.request-body-gate = "pre-upstream"
response_body_mode=none
request_body_limit=1048576
response_body_limit=1048576
default_block_status=403
default_error_status=500
max_header_count=256
max_header_name_size=256
max_header_value_size=8192
max_total_header_bytes=65536
max_event_json_bytes=16384
event_path=/absolute/path/to/lighttpd-events.jsonl

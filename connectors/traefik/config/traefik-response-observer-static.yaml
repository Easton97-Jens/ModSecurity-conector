# Register the local response observer plugin. The private UDS is deliberately
# explicit; there is no TCP or native-middleware fallback.
experimental:
  abortOnPluginFailure: true
  localPlugins:
    modsecurityResponseObserver:
      moduleName: github.com/Easton97-Jens/ModSecurity-conector/connectors/traefik/response_observer
      settings:
        useUnsafe: true # Required only for this observer's Linux SO_PEERCRED.

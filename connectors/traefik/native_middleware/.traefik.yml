displayName: ModSecurity Native UDS Streaming Middleware
type: middleware
import: github.com/Easton97-Jens/ModSecurity-conector/connectors/traefik/native_middleware
summary: Repository-owned bounded streaming middleware with a private UDS engine; legacy passthrough is rejected.
testData:
  maxHeaderCount: 128
  maxHeaderBytes: 65536
  maxRequestChunkBytes: 32768
  maxResponseChunkBytes: 32768
  transactionIDHeader: X-Request-Id
  engineMode: uds
  engineSocketPath: /run/traefik-msconnector/engine.sock

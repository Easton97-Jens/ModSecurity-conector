# NGINX smoke-test template.
#
# This file is not used in place. run_nginx_smoke.sh renders it into
# BUILD_ROOT before NGINX is started.

load_module "@@NGINX_MODULE@@";

daemon off;
worker_processes 1;
@@NGINX_WORKER_USER_DIRECTIVE@@
pid "@@RUNTIME_ROOT@@/nginx.pid";
error_log "@@NGINX_SERVER_LOG_ROOT@@/error.log" debug;

events {
    worker_connections 64;
}

http {
    access_log "@@NGINX_SERVER_LOG_ROOT@@/access.log";
    client_body_temp_path "@@NGINX_WORKER_STATE_ROOT@@/client_body_temp";
    proxy_temp_path "@@NGINX_WORKER_STATE_ROOT@@/proxy_temp";
    fastcgi_temp_path "@@NGINX_WORKER_STATE_ROOT@@/fastcgi_temp";
    uwsgi_temp_path "@@NGINX_WORKER_STATE_ROOT@@/uwsgi_temp";
    scgi_temp_path "@@NGINX_WORKER_STATE_ROOT@@/scgi_temp";

    server {
        include "@@NGINX_PROTOCOL_LISTEN_DIRECTIVES@@";
        server_name localhost;
        include "@@NGINX_PROTOCOL_SERVER_DIRECTIVES@@";

        modsecurity on;
        @@NGINX_USE_ERROR_LOG_DIRECTIVE@@
        modsecurity_rules_file "@@RULES_FILE@@";
        @@NGINX_TRANSACTION_ID_DIRECTIVE@@

        location = /__modsec_smoke_ready {
            modsecurity off;
            return 204;
        }

        location / {
            root "@@DOCROOT@@";
            index index.html;
            @@NGINX_PHASE4_MODE_DIRECTIVE@@
            include "@@NGINX_LOCATION_DIRECTIVES@@";
            include "@@NGINX_LOCATION_HANDLER_DIRECTIVES@@";
        }
    }
}

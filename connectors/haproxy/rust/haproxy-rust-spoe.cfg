global
  daemon

defaults
  mode http
  timeout connect 2s
  timeout client 5s
  timeout server 5s

frontend rust_spoe_front
  bind 127.0.0.1:18101
  filter spoe engine rust-waf config /var/tmp/codex/git/haproxy-rust-spoe.conf
  http-request deny deny_status 403 if { var(txn.rust.action) -m str deny }
  http-request deny deny_status 403 if { var(txn.rust.blocked) -m bool }
  default_backend rust_upstream

backend rust_upstream
  server upstream 127.0.0.1:18102

backend rust-spoe-agent
  mode tcp
  server rust_spop 127.0.0.1:18100

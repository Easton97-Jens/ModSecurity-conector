# One complete Parent analysis. Independent submodules have their own projects.
sonar.projectKey=Easton97-Jens_ModSecurity-conector
sonar.organization=easton97-jens
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Scanner autoconfiguration is different from CFamily AutoConfig. Keep explicit
# source/test classification; CFamily AutoConfig remains the default C/C++ mode.
sonar.scanner.autoconfig.enabled=false
sonar.sources=.
sonar.tests=.
# The complete Parent scope must not depend on a checkout's SCM ignore rules.
sonar.scm.exclusions.disabled=true
sonar.python.version=3.15
# Match the targeted evaluator's C++17 build contract for version-gated rules.
# This reporting override does not reconstruct host compiler flags or includes.
sonar.cfamily.reportingCppStandardOverride=c++17
# Generic JSON/YAML analyzers are available in this Cloud organization; dedicated
# GitHub Actions/IaC analysis remains independent of this documented opt-in.
sonar.featureflag.cloud-security-enable-generic-yaml-and-json-analyzer=true

# Inclusions automatically exclude these files from the source scope. Do not use
# tests/**: CFamily does not support sonar.tests and its tests must stay sources.
sonar.test.inclusions=tests/**/*.py,**/test_*.py,**/*_test.py,**/*_test.go

# Exclude only these root directories from both categories. Nested directories
# such as ci/evidence/reports and connectors/*/build remain in scope.
sonar.exclusions=modules/**,reports/**
sonar.test.exclusions=modules/**,reports/**

# Coverage is explicitly outside this project's acceptance criteria. This
# affects coverage calculation only; all scoped code remains analyzed for
# security, reliability, maintainability and duplication.
sonar.coverage.exclusions=**

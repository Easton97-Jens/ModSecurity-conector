# One complete Parent analysis. Independent submodules have their own projects.
sonar.projectKey=Easton97-Jens_ModSecurity-conector
sonar.organization=easton97-jens
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Scanner autoconfiguration is different from CFamily AutoConfig. Keep explicit
# source/test classification; CFamily AutoConfig remains the default C/C++ mode.
sonar.scanner.autoconfig.enabled=false
sonar.sources=.
sonar.tests=.
sonar.python.version=3.15
# Match the targeted evaluator's C++17 build contract for version-gated rules.
# This reporting override does not reconstruct host compiler flags or includes.
sonar.cfamily.reportingCppStandardOverride=c++17
# Generic JSON/YAML analyzers are available in this Cloud organization; dedicated
# GitHub Actions/IaC analysis remains independent of this documented opt-in.
sonar.featureflag.cloud-security-enable-generic-yaml-and-json-analyzer=true

# Inclusions automatically exclude these files from the source scope. Do not use
# tests/**: CFamily does not support sonar.tests and its tests must stay sources.
sonar.test.inclusions=tests/**/*.py,**/test_*.py,**/*_test.py,**/*_test.go,ci/runtime/lifecycle/apache-i12/acceptance/backend.py,ci/runtime/lifecycle/apache-i12/acceptance/batch.py,ci/runtime/lifecycle/apache-i12/acceptance/cancellation.py,ci/runtime/lifecycle/apache-i12/acceptance/cases.py,ci/runtime/lifecycle/apache-i12/acceptance/keepalive.py,ci/runtime/lifecycle/apache-i12/launch.py,ci/runtime/lifecycle/apache-i12/observed_curl.py,ci/runtime/lifecycle/apache-i12/sink_launch.py,ci/runtime/lifecycle/i12/lighttpd/diagnostic_transport.py,ci/runtime/lifecycle/i12/lighttpd/stock_raw_client.py,ci/runtime/lifecycle/i12/lighttpd/stock_spool_client.py,ci/runtime/lifecycle/i12/nginx/run_cases.py,ci/runtime/lifecycle/i12/nginx/scenarios.py,ci/runtime/lifecycle/i12/nginx/wire_client.py,connectors/haproxy/harness/i12_companion_host.py,connectors/haproxy/harness/i12_native_cases.py,connectors/haproxy/harness/i12_spop_cases.py,connectors/haproxy/harness/i12_spop_host.py,connectors/traefik/harness/i12/native/acceptance_backend.py,connectors/traefik/harness/i12/native/acceptance_client.py,connectors/traefik/harness/i12/native/acceptance_driver.py,connectors/traefik/harness/i12/native/acceptance_proxy.py,connectors/traefik/harness/i12/native/fault_proxy.py,connectors/traefik/harness/i12_auth/acceptance_driver.py,connectors/traefik/harness/i12_auth/acceptance_net.py,connectors/traefik/harness/i12_auth/auth_proxy.py,connectors/traefik/harness/i12_auth/backend.py,connectors/traefik/harness/i12_auth/client.py,connectors/traefik/harness/i12_auth/fault_peer.py,connectors/traefik/harness/i12_auth/tls_fixture.py

# Root output paths are deliberately not **/build/**: connectors/*/build contains
# maintained build scripts. Workflow-fixture YAML is input to negative/control
# tests, not executable workflows. Keep their Python/C fixture code in scope.
sonar.exclusions=modules/**,build/**,dist/**,ci-artifacts/**,verified-runs/**,reports/testing/generated/**,ci/fixtures/workflow-permission-contract/*.yml,ci/fixtures/zizmor/*.yml,tests/fixtures/python-version-contract/*.yml,tests/fixtures/python-version-contract/*.yaml

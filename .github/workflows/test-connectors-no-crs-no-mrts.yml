name: connector-tests-no-crs-no-mrts

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/test-connectors-no-crs-no-mrts.yml
      - tests/test_ci_security_workflows.py
      - tests/test_python_version_contract.py
      - ci/checks/common/check-python-version-contract.py
      - ci/runtime/**
      - connectors/apache/**
      - connectors/envoy/**
      - connectors/haproxy/**
      - connectors/lighttpd/**
      - connectors/traefik/**
      - config/**
      - Makefile
      - .python-version
      - modules/ModSecurity-test-Framework
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-tests-no-crs-no-mrts
  cancel-in-progress: false

jobs:
  connector-mode:
    name: no-crs/no-mrts / ${{ matrix.connector }} / ${{ matrix.coverage_kind }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: apache
            coverage_kind: runtime
            crs: no-crs
            mrts: no-mrts
            connector_profile: full-lifecycle-low-latency
            integration_mode: native-httpd-module
            protocol: http1
            phase4_mode: safe
            evidence_scope: source-wiring-and-baseline-only
          - connector: envoy
            coverage_kind: runtime
            crs: no-crs
            mrts: no-mrts
            connector_profile: request-only-compatibility
            integration_mode: http-ext-authz-service
            protocol: http1
            phase4_mode: not_applicable
            evidence_scope: no-response-host-path
          - connector: haproxy
            coverage_kind: runtime
            crs: no-crs
            mrts: no-mrts
            connector_profile: header-compatibility
            integration_mode: spoe-spop-agent
            protocol: http1
            phase4_mode: not_applicable
            evidence_scope: no-response-body-host-path
          - connector: lighttpd
            coverage_kind: runtime
            crs: no-crs
            mrts: no-mrts
            connector_profile: header-compatibility
            integration_mode: native-lighttpd-plugin
            protocol: http1
            phase4_mode: not_applicable
            evidence_scope: no-native-body-host-path
          - connector: traefik
            coverage_kind: runtime
            crs: no-crs
            mrts: no-mrts
            connector_profile: request-only-compatibility
            integration_mode: http-forwardauth-service
            protocol: http1
            phase4_mode: not_applicable
            evidence_scope: no-response-host-path
    env:
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      EXPECTED_FRAMEWORK_SHA: 209389022c942d83113f6be88bf31d25637352f0
      EXPECTED_MRTS_SHA: 615b13bacbd008562c17408246c41ab27dca3104
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      FIVE_CONNECTOR_PROFILE: no-crs
      CI_PROFILE: no-crs
      CI_CONNECTOR_PROFILE: ${{ matrix.connector_profile }}
      CI_INTEGRATION_MODE: ${{ matrix.integration_mode }}
      CI_PROTOCOL: ${{ matrix.protocol }}
      CI_PHASE4_MODE: ${{ matrix.phase4_mode }}
      CI_EVIDENCE_SCOPE: ${{ matrix.evidence_scope }}
      CRS: ${{ matrix.crs }}
      MRTS: ${{ matrix.mrts }}
      COVERAGE_KIND: ${{ matrix.coverage_kind }}
      NO_CRS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout pinned Parent, Framework, and MRTS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Verify recorded Framework and MRTS revisions
        run: |
          set -euo pipefail
          framework_commit=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          mrts_commit=$(git -C modules/ModSecurity-test-Framework/tools/MRTS rev-parse HEAD)
          test "$framework_commit" = "$EXPECTED_FRAMEWORK_SHA"
          test "$mrts_commit" = "$EXPECTED_MRTS_SHA"

      - name: Verify selected static No-CRS cell
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          test "$CRS" = no-crs
          test "$MRTS" = no-mrts
          test "$COVERAGE_KIND" = runtime
          case "$CONNECTOR" in
            apache|envoy|haproxy|lighttpd|traefik) ;;
            *) echo "FAIL: connector is outside the fixed profile: $CONNECTOR" >&2; exit 2 ;;
          esac
          python3 ci/runtime/lifecycle/five-connector-no-crs-profile.py \
            --profile "$FIVE_CONNECTOR_PROFILE" \
            --verify-row \
            --connector "$CONNECTOR" \
            --integration-mode "$CI_INTEGRATION_MODE" \
            --protocol "$CI_PROTOCOL" \
            --phase4-mode "$CI_PHASE4_MODE" \
            --evidence-scope "$CI_EVIDENCE_SCOPE" \
            --connector-profile "$CI_CONNECTOR_PROFILE"

      - name: Declare runtime coverage scope
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          {
            echo "### $CONNECTOR runtime coverage"
            echo
            echo "| Axis | Fixed value |"
            echo "| --- | --- |"
            echo "| coverage kind | $COVERAGE_KIND |"
            echo "| CRS | $CRS |"
            echo "| MRTS | $MRTS |"
            echo "| profile | $CI_PROFILE |"
            echo
            echo "This is the canonical No-CRS/No-MRTS baseline only; it does not claim CRS, full-matrix, NGINX, production, or unobserved protocol behavior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize private canonical roots
        env:
          CONNECTOR: ${{ matrix.connector }}
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          parent_commit=$(git rev-parse HEAD)
          framework_commit=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          mrts_commit=$(git -C modules/ModSecurity-test-Framework/tools/MRTS rev-parse HEAD)
          test "$parent_commit" = "$EXPECTED_PARENT_SHA"
          test "$framework_commit" = "$EXPECTED_FRAMEWORK_SHA"
          test "$mrts_commit" = "$EXPECTED_MRTS_SHA"
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified/$CI_PROFILE/$parent_commit/$framework_commit/$CONNECTOR/$NO_CRS_RUN_ID"
          build_root="$verified_root/build"
          verified_evidence_root="$verified_root/evidence"
          evidence_root="$verified_evidence_root/no-crs-evidence"
          run_root="$verified_root/runs"
          log_root="$verified_root/run-logs"
          cache_root="$verified_root/cache-v2"
          umask 077
          mkdir -p "$evidence_root"
          {
            echo "FIVE_CONNECTOR_PARENT_COMMIT=$parent_commit"
            echo "FIVE_CONNECTOR_FRAMEWORK_COMMIT=$framework_commit"
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "VERIFIED_BUILD_ROOT=$build_root"
            echo "VERIFIED_EVIDENCE_ROOT=$verified_evidence_root"
            echo "RUNTIME_RUN_ROOT=$run_root"
            echo "RUNTIME_LOG_ROOT=$log_root"
            echo "BUILD_ROOT=$build_root"
            echo "TMP_ROOT=$build_root/tmp"
            echo "LOG_ROOT=$build_root/logs"
            echo "CACHE_ROOT=$cache_root"
            echo "VERIFIED_COMPONENT_CACHE=$cache_root/shared"
            echo "CONNECTOR_COMPONENT_CACHE=$cache_root/shared"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "NO_CRS_EVIDENCE_ROOT=$evidence_root"
            echo "RUNTIME_REPORT_OUTPUT_ROOT=$build_root/runtime-component-reports"
            echo "PYTHON=$SETUP_PYTHON_PATH"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked Framework runtime dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r modules/ModSecurity-test-Framework/requirements-ci.lock
          python3 -m pip check

      - name: Provision host component
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in
            apache|haproxy)
              RUNTIME_COMPONENT_TARGET="$CONNECTOR" make prepare-runtime-components
              ;;
            envoy)
              make prepare-envoy-runtime
              ;;
            traefik)
              make prepare-traefik-runtime
              ;;
            lighttpd)
              make prepare-lighttpd-runtime-build
              ;;
            *)
              echo "FAIL: connector is outside the fixed profile: $CONNECTOR" >&2
              exit 2
              ;;
          esac

      - name: Build connector
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          make "build-$CONNECTOR"

      - name: Validate configuration load
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          make "check-config-$CONNECTOR"

      - name: Run request-free start smoke
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          make "start-smoke-$CONNECTOR"

      - name: Run canonical minimal No-CRS runtime smoke
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          RUNTIME_EVIDENCE_ROOT="$EVIDENCE_ROOT" make "runtime-smoke-$CONNECTOR"

      - name: Validate canonical evidence and profile receipt
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          make "evidence-check-$CONNECTOR"
          python3 modules/ModSecurity-test-Framework/ci/checks/catalog/no_crs_baseline.py validate \
            --evidence-root "$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID" \
            --connector "$CONNECTOR" \
            --capabilities "connectors/$CONNECTOR/capabilities.json" \
            --check all
          test -f "$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/logs/five_connector_profile_receipt.log"

      - name: Publish canonical status
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          result="$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/result.json"
          test -f "$result"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$result")
          {
            echo "### $CONNECTOR canonical No-CRS status"
            echo
            echo "$status"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = PASS

      - name: Check process cleanup
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          cleanup_log="$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/logs/process_cleanup.log"
          test -f "$cleanup_log"
          test "$(cat "$cleanup_log")" = none

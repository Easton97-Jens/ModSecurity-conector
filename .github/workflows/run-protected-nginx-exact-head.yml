name: Protected exact-head NGINX validation

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open canonical PR number to validate.
        required: true
        type: string
      expected_head_sha:
        description: Exact lower-case 40-character PR head SHA.
        required: true
        type: string

permissions: {}

jobs:
  framework:
    permissions:
      contents: read
    uses: Easton97-Jens/ModSecurity-test-Framework/.github/workflows/connector-protected-nginx-exact-head.yml@3ff8b75c9f4d2cb3614a4dcb7afd2e5360e074d8
    with:
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.expected_head_sha }}

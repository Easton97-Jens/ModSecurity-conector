name: test-common

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  common-structure:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-common/common-structure@e52d7d44c81e997a296b7ffdfb33f12bf85455b9
        with:
          framework-revision: e52d7d44c81e997a296b7ffdfb33f12bf85455b9

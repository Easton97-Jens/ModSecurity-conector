name: task-apply-framework-handoff-393

on:
  push:
    branches:
      - automation/apply-framework-handoff-393
    paths:
      - .github/workflows/task-apply-framework-handoff-393.yml

permissions: {}

jobs:
  prepare:
    if: github.repository == 'Easton97-Jens/ModSecurity-conector' && github.ref == 'refs/heads/automation/apply-framework-handoff-393'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbd74521ee9b1c7544b11c225e399a1c7f8d49da
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Configure external roots and install the existing locked dependency
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/framework-handoff-393"
          mkdir -p "$root"
          {
            echo "VERIFIED_RUN_ROOT=$root"
            echo "SOURCE_ROOT=$root/src"
            echo "BUILD_ROOT=$root/build"
            echo "TMP_ROOT=$root/tmp"
            echo "LOG_ROOT=$root/logs"
            echo "XDG_STATE_HOME=$root/state"
            echo "CONNECTOR_COMPONENT_CACHE=$root/component-cache"
            echo "NGINX_HARNESS_PARENT=$root/nginx-harness"
          } >> "$GITHUB_ENV"
          python3 -m pip install --require-hashes --only-binary=:all: --no-input -r requirements-ci.lock
          python3 -m pip check
      - name: Resolve exact objects and reproduce the original rejection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bbd74521ee9b1c7544b11c225e399a1c7f8d49da
          git -c protocol.file.allow=never submodule update --init -- modules/ModSecurity-test-Framework
          git -C modules/ModSecurity-test-Framework fetch --no-tags origin 0290a979ba4bc63a7abed175a53471367b385553
          git -C modules/ModSecurity-test-Framework merge-base --is-ancestor f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 0290a979ba4bc63a7abed175a53471367b385553
          test "$(git -C modules/ModSecurity-test-Framework ls-tree f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 -- tools/MRTS)" = "$(git -C modules/ModSecurity-test-Framework ls-tree 0290a979ba4bc63a7abed175a53471367b385553 -- tools/MRTS)"
          git -C modules/ModSecurity-test-Framework show 0290a979ba4bc63a7abed175a53471367b385553:ci/lib/common.sh > "$RUNNER_TEMP/candidate-common.sh"
          set +e
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --expected-parent-framework-sha f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 --framework-common "$RUNNER_TEMP/candidate-common.sh" > "$RUNNER_TEMP/baseline-rejection.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/baseline-rejection.log"
          test "$result" -eq 2
          grep -F 'Framework common.sh differs from approved reviewed structure' "$RUNNER_TEMP/baseline-rejection.log"
      - name: Verify official NGINX provenance and apply the existing exact-delta patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('https://api.github.com/repos/nginx/nginx/releases/tags/release-1.31.6', timeout=30) as response:
              release = json.load(response)
          assets = [item for item in release['assets'] if item['name'] == 'nginx-1.31.6.tar.gz']
          if release['draft'] or release['prerelease'] or len(assets) != 1:
              raise SystemExit('Not the reviewed official stable release')
          if assets[0]['state'] != 'uploaded' or assets[0]['digest'] != 'sha256:974ed5298a5e398e008704ed5db284e655fc270c596493dbccada452448fc9f1':
              raise SystemExit('Official NGINX digest mismatch')
          print('Official NGINX provenance verified')
          PY
          python3 ci/tools/prepare-reviewed-framework-handoff.py --repo-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/reviewed-framework-handoff.patch"
          git apply --index "$RUNNER_TEMP/reviewed-framework-handoff.patch"
          git -c protocol.file.allow=never submodule update --init --checkout -- modules/ModSecurity-test-Framework
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): apply reviewed Framework handoff for isolated validation'
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh"
          python3 ci/tools/sync-framework-component-versions.py --validate --repo-root "$GITHUB_WORKSPACE" --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh" --framework-sha 0290a979ba4bc63a7abed175a53471367b385553
      - name: Run existing CI-security and handoff contracts
        run: make check-ci-security-contract
      - name: Run affected NGINX and preparation regressions
        run: |
          python3 -m unittest -v \
            tests.test_prepare_reviewed_framework_handoff tests.test_change_record \
            tests.test_nginx_exact_head_gate_contract tests.test_nginx_body_buffer_fixture \
            tests.test_prepare_runtime_components tests.test_runtime_component_cache_identity \
            tests.test_runtime_component_cache_contract tests.test_runtime_env_snapshot_contract \
            tests.test_report_presentation_literals tests.test_evidence_output_security \
            tests.test_nginx_functional_evidence
      - name: Export exact source inventory and schema-validated paired record
        id: export
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess

          root = Path.cwd()
          base = 'bbd74521ee9b1c7544b11c225e399a1c7f8d49da'
          repair = runpy.run_path(str(root / 'ci/tools/prepare-reviewed-framework-handoff.py'))
          creator = runpy.run_path(str(root / 'ci/tools/new-change-record.py'))
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          expected = set(repair['TARGET_PATHS']) | {repair['FRAMEWORK_PATH']}
          if set(git('diff', '--name-only', base, 'HEAD').splitlines()) != expected:
              raise SystemExit('Unexpected changed source paths')
          if git('status', '--porcelain', '--untracked-files=no'):
              raise SystemExit('Tracked test side effects')
          digest = repair['structure_digest']((root / repair['FRAMEWORK_PATH'] / 'ci/lib/common.sh').read_text(encoding='utf-8'))
          record = 'CR-20260930-framework-handoff-applied'
          paths_text = '\n'.join('- `' + path + '`' for path in sorted(expected))
          paragraphs = {
              'English': (
                  f'| Field | Value |\n| --- | --- |\n| Change ID | {record} |\n| Date (UTC) | 2026-09-30 |\n| Base revision | `{base}` |',
                  'The user requested applying the original repair in PR #393. Run 36608694822 rejected common.sh at its structural review boundary. The skipped sandbox was a consequence. This record supersedes the historical preparation-only delivery status.',
                  'Apply the actual Framework gitlink and coherent Parent values; verify the real candidate, regressions, namespace, final-head CI and Sonar. Preserve the newly merged master changes. Do not merge the PR.',
                  f'Use the existing exact-delta generator. Framework f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 advances to 0290a979ba4bc63a7abed175a53471367b385553. Exactly twelve reviewed literal common.sh assignments produce normalized SHA-256 `{digest}`. NGINX is 1.31.6 with SHA-256 `{repair["NEW_NGINX_SHA256"]}`, checked against official release asset metadata. A real-source regression binds the initialized submodule to the production review digest. The release-1.31.7 rejection control remains distinct.',
                  paths_text + '\n\nAdditionally this EN/DE record. The temporary isolated workflow is excluded from the repair tree.',
                  'Hosted Python 3.14.7: baseline verifier rejected the candidate with the expected structural error and exit 2; the existing generator and git apply --index succeeded; the updated real-candidate verifier and generic synchronizer --validate passed; make check-ci-security-contract and the eleven affected unittest modules passed; git diff --cached --check passed. The exact final-head namespace, CI and Sonar results are recorded separately in PR #393.',
                  'No guard, parser grammar, 25-field mutable registry, Parent provenance policy, sandbox, publisher, protected broker, Sonar rule or permanent workflow permission is weakened. No Framework/MRTS source is changed. The Git-object job cannot execute artifact contents and does not move any branch.',
                  'No complete native connector runtime matrix or CRS/MRTS promotion is claimed. Contract and unit checks prove their tested layers only.',
                  'Local GitHub DNS and RTK were unavailable. Application and tests use an ephemeral GitHub runner and exact Git objects. The earlier master merge is retained; its eight changed paths do not overlap this repair.',
                  'Future structural Framework changes still require review. The new real-source regression detects mismatched Parent approval; it is not a blanket approval mechanism. The separately pinned protected broker remains unchanged.',
                  'No local RTK test or local Sonar scan was possible. No complete native runtime matrix was requested. Fresh hosted namespace, final-head CI and Sonar evidence must be checked in the PR before review-ready delivery.',
                  'The actual production correction is included, not merely a generator. Historical preparation records describe previous states. The PR remains unmerged; fresh final-head checks determine review readiness.',
              ),
              'Deutsch': (
                  f'| Feld | Wert |\n| --- | --- |\n| Change-ID | {record} |\n| Datum (UTC) | 2026-09-30 |\n| Basis-Revision | `{base}` |',
                  'Der Benutzer hat die Anwendung der ursprünglichen Reparatur in PR #393 angefordert. Lauf 36608694822 lehnte common.sh an der strukturellen Review-Grenze ab. Die übersprungene Sandbox war eine Folge. Dieser Record ersetzt den historischen reinen Vorbereitungsstatus.',
                  'Tatsächlichen Framework-Gitlink und passende Parent-Werte anwenden; echten Kandidaten, Regressionen, Namespace, finale CI und Sonar prüfen. Die neu übernommenen Master-Änderungen erhalten. Den PR nicht mergen.',
                  f'Den bestehenden Exact-Delta-Generator verwenden. Framework f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 wird auf 0290a979ba4bc63a7abed175a53471367b385553 angehoben. Genau zwölf geprüfte literale common.sh-Zuweisungen ergeben den normalisierten SHA-256 `{digest}`. NGINX ist 1.31.6 mit SHA-256 `{repair["NEW_NGINX_SHA256"]}`, geprüft gegen offizielle Release-Asset-Metadaten. Eine Echtquell-Regression bindet das initialisierte Submodul an den produktiven Review-Hash. Der Negativtest mit release-1.31.7 bleibt unterscheidbar.',
                  paths_text + '\n\nZusätzlich dieser EN/DE-Record. Der temporäre isolierte Workflow gehört nicht zum Reparaturbaum.',
                  'Gehostetes Python 3.14.7: Basis-Verifier lehnte den Kandidaten mit dem erwarteten Strukturfehler und Exitcode 2 ab; bestehender Generator und git apply --index erfolgreich; aktualisierter echter Kandidaten-Verifier und generischer Synchronisierer --validate bestanden; make check-ci-security-contract und die elf betroffenen Unittest-Module bestanden; git diff --cached --check bestanden. Namespace-, CI- und Sonar-Ergebnisse des exakten finalen Heads werden separat in PR #393 dokumentiert.',
                  'Kein Guard, keine Parsergrammatik, Registry mit 25 veränderlichen Feldern, Parent-Provenance-Policy, Sandbox, Publisher, geschützter Broker, Sonar-Regel oder dauerhafte Workflow-Berechtigung wird abgeschwächt. Keine Framework-/MRTS-Quelle wird verändert. Der Git-Objekt-Job führt keine Artefaktinhalte aus und bewegt keinen Branch.',
                  'Keine vollständige native Connector-Laufzeitmatrix oder CRS-/MRTS-Freigabe wird behauptet. Vertrags- und Unit-Tests belegen nur ihre geprüften Ebenen.',
                  'Lokales GitHub-DNS und RTK waren nicht verfügbar. Anwendung und Tests nutzen einen kurzlebigen GitHub-Runner und exakte Git-Objekte. Der vorangegangene Master-Merge bleibt erhalten; seine acht geänderten Pfade überschneiden sich nicht mit dieser Reparatur.',
                  'Künftige strukturelle Framework-Änderungen benötigen weiterhin Review. Die neue Echtquell-Regression erkennt eine abweichende Parent-Freigabe und ist keine pauschale Freigabe. Der separat gepinnte geschützte Broker bleibt unverändert.',
                  'Lokaler RTK-Test und lokaler Sonar-Scan waren nicht möglich. Keine vollständige native Laufzeitmatrix wurde angefordert. Frische gehostete Namespace-, finale CI- und Sonar-Evidence müssen vor Review-Bereitschaft im PR geprüft werden.',
                  'Die tatsächliche produktive Korrektur ist enthalten, nicht nur ein Generator. Historische Vorbereitungsrecords beschreiben frühere Zustände. Der PR bleibt ungemergt; frische Prüfungen des finalen Heads bestimmen die Review-Bereitschaft.',
              ),
          }
          record_paths = []
          for language, sections in paragraphs.items():
              suffix = '.md' if language == 'English' else '.de.md'
              path = root / 'reports/audits/change-records' / (record + suffix)
              switch = f'**Language:** English | [Deutsch]({record}.de.md)' if language == 'English' else f'**Sprache:** [English]({record}.md) | Deutsch'
              title = 'applied Framework handoff repair' if language == 'English' else 'angewendete Framework-Handoff-Reparatur'
              text = '# Change Record: ' + title + '\n\n' + switch + '\n\n'
              for heading, paragraph in zip(creator['CONTRACT'].CHANGE_RECORD_REQUIRED_HEADINGS[language], sections, strict=True):
                  text += heading + '\n\n' + paragraph + '\n\n'
              with path.open('x', encoding='utf-8') as output:
                  output.write(text.rstrip() + '\n')
              record_paths.append(path.relative_to(root).as_posix())
          errors = creator['check_records'](root)
          if errors:
              raise SystemExit('\n'.join(errors))
          entries = []
          for path in sorted(set(repair['TARGET_PATHS']) | set(record_paths)):
              mode = '100644' if path in record_paths else git('ls-tree', base, '--', path).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': (root / path).read_text(encoding='utf-8')})
          entries.append({'path': repair['FRAMEWORK_PATH'], 'mode': '160000', 'type': 'commit', 'sha': repair['NEW_FRAMEWORK_SHA']})
          payload = json.dumps({'base': base, 'entries': entries, 'review_digest': digest}, ensure_ascii=False).encode('utf-8')
          (Path(os.environ['RUNNER_TEMP']) / 'framework-handoff-manifest.json').write_bytes(payload)
          sha256 = hashlib.sha256(payload).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write('manifest_sha256=' + sha256 + '\n')
          print('MANIFEST_SHA256=' + sha256)
          print('REVIEWED_STRUCTURE_SHA256=' + digest)
          print('Final paths:\n' + '\n'.join(item['path'] for item in entries))
          PY
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-framework-handoff-393
          path: ${{ runner.temp }}/framework-handoff-manifest.json
          if-no-files-found: error
          retention-days: 3

  store-reviewed-objects:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.store.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-framework-handoff-393
          path: ${{ runner.temp }}/reviewed-manifest
      - name: Store reviewed Git objects only, without moving refs
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          prefix = '/repos/Easton97-Jens/ModSecurity-conector'
          base = 'bbd74521ee9b1c7544b11c225e399a1c7f8d49da'
          path = Path(os.environ['RUNNER_TEMP']) / 'reviewed-manifest/framework-handoff-manifest.json'
          if path.is_symlink() or path.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit('Unsafe manifest')
          payload = path.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('Manifest digest mismatch')
          manifest = json.loads(payload)
          allowed = {
              '.github/workflows/test-nginx-exact-head.yml', '.github/workflows/test-full-smoke-sequential.yml',
              'ci/provisioning/components/prepare-runtime-components.py', 'ci/checks/evidence/check-runtime-producer-readiness.py',
              'tests/run_nginx_body_buffer_fixture.py', 'tests/test_nginx_body_buffer_fixture.py',
              'tests/test_runtime_component_cache_identity.py', 'tests/test_verify_framework_candidate_contract.py',
              'tests/test_nginx_exact_head_gate_contract.py', 'tests/test_report_presentation_literals.py',
              'tests/test_update_framework_versions.py', 'tests/test_prepare_runtime_components.py',
              'tests/test_runtime_env_snapshot_contract.py', 'tests/test_runtime_component_cache_contract.py',
              'tests/test_evidence_output_security.py', 'tests/test_nginx_functional_evidence.py',
              '.github/workflows/test-connectors-with-crs-no-mrts.yml', 'tests/test_ci_security_workflows.py',
              'ci/tools/verify-framework-candidate-contract.py', 'modules/ModSecurity-test-Framework',
              'reports/audits/change-records/CR-20260930-framework-handoff-applied.md',
              'reports/audits/change-records/CR-20260930-framework-handoff-applied.de.md',
          }
          entries = manifest['entries']
          if manifest['base'] != base or len(entries) != len(allowed) or {item['path'] for item in entries} != allowed:
              raise SystemExit('Manifest scope mismatch')
          def api(route, body=None):
              if not route.startswith(prefix + '/'):
                  raise ValueError('Unexpected repository')
              if body is not None and route not in (prefix + '/git/trees', prefix + '/git/commits'):
                  raise ValueError('Only Git object creation is permitted')
              request = urllib.request.Request('https://api.github.com' + route,
                  data=None if body is None else json.dumps(body).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(16 * 1024 * 1024 + 1)
              if len(data) > 16 * 1024 * 1024:
                  raise ValueError('Oversized API response')
              return json.loads(data)
          if api(prefix + '/git/ref/heads/automation/prepare-framework-handoff-36608694822')['object']['sha'] != base:
              raise SystemExit('PR branch moved; review required')
          if api(prefix + '/git/ref/heads/master')['object']['sha'] != 'b6bd71685ec83cc7dfab2739250e3e9b6eb9f3e1':
              raise SystemExit('Parent master moved; review required')
          tree_sha = api(prefix + '/git/commits/' + base)['tree']['sha']
          tree = api(prefix + '/git/trees/' + tree_sha + '?recursive=1')
          if tree.get('truncated'):
              raise SystemExit('Incomplete baseline tree')
          original = {item['path']: item for item in tree['tree']}
          for item in entries:
              name = item['path']
              if name == 'modules/ModSecurity-test-Framework':
                  if item != {'path': name, 'mode': '160000', 'type': 'commit', 'sha': '0290a979ba4bc63a7abed175a53471367b385553'}:
                      raise SystemExit('Unexpected gitlink')
              else:
                  if set(item) != {'path', 'mode', 'type', 'content'} or item['type'] != 'blob' or len(item['content'].encode('utf-8')) > 1024 * 1024:
                      raise SystemExit('Invalid text entry')
                  if item['mode'] != (original[name]['mode'] if name in original else '100644') or item['mode'] not in ('100644', '100755'):
                      raise SystemExit('Unexpected file mode')
          prepared = api(prefix + '/git/trees', {'base_tree': tree_sha, 'tree': entries})
          commit = api(prefix + '/git/commits', {
              'message': 'fix(ci): apply reviewed Framework handoff and align NGINX provenance\n\nAdvance the Framework gitlink and closed Parent projections to 0290a979.\nReproduce the original failure, retain fail-closed boundaries and the\nnewly merged master changes, and test the actual initialized common.sh.\nHosted candidate, security-contract and affected regression checks passed.',
              'tree': prepared['sha'], 'parents': [base],
          })
          print('PREPARED_REPAIR_COMMIT=' + commit['sha'])
          print('PREPARED_REPAIR_TREE=' + prepared['sha'])
          print('No branch or master ref was modified.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write('commit=' + commit['sha'] + '\n')
          PY

  validate-real-readonly-sandbox:
    needs: store-reviewed-objects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.store-reviewed-objects.outputs.commit }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Capture applied Parent and initialize the exact Framework
        run: |
          set -euo pipefail
          python3 ci/tools/validate-submodule-candidate-state.py capture-parent-baseline --parent-root "$GITHUB_WORKSPACE" --github-env "$GITHUB_ENV"
          git -c protocol.file.allow=never submodule update --init -- modules/ModSecurity-test-Framework
          test "$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)" = 0290a979ba4bc63a7abed175a53471367b385553
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh"
      - name: Prepare the existing dedicated read-only sandbox
        id: guard
        run: |
          set -euo pipefail
          umask 077
          write_root="$(mktemp -d "$RUNNER_TEMP/modsecurity-readonly-validation.XXXXXX")"
          sudo -n chown root:root "$write_root"
          sudo -n chmod 0711 "$write_root"
          echo "write_root=$write_root" >> "$GITHUB_OUTPUT"
          sudo -n groupadd --system modsecurity-validator
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin --gid modsecurity-validator modsecurity-validator
          sudo -n python3 ci/tools/prepare-readonly-submodule-validation-sandbox.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$write_root" --runner-temp "$RUNNER_TEMP" --validator-user modsecurity-validator --validator-group modsecurity-validator
      - name: Execute the original namespace validator
        env:
          VALIDATION_WRITE_ROOT: ${{ steps.guard.outputs.write_root }}
          EXPECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          namespace_parent="$(sudo -n mktemp -d /tmp/modsecurity-readonly-namespace.XXXXXX)"
          trap 'sudo -n rmdir -- "$namespace_parent"' EXIT
          sudo -n chown root:modsecurity-validator "$namespace_parent"
          sudo -n chmod 0750 "$namespace_parent"
          sudo -n python3 ci/tools/run-readonly-submodule-validation-namespace.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$VALIDATION_WRITE_ROOT" --external-root "$VALIDATION_WRITE_ROOT/external" --validator-user modsecurity-validator --validator-group modsecurity-validator --python "$EXPECTED_PYTHON" --namespace-parent "$namespace_parent"
      - name: Verify immutable source and Parent state
        if: always() && steps.guard.outcome == 'success'
        env:
          VALIDATION_WRITE_ROOT: ${{ steps.guard.outputs.write_root }}
        run: |
          set -euo pipefail
          sudo -n python3 ci/tools/prepare-readonly-submodule-validation-sandbox.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$VALIDATION_WRITE_ROOT" --runner-temp "$RUNNER_TEMP" --validator-user modsecurity-validator --validator-group modsecurity-validator --verify

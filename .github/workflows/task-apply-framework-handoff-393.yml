name: task-apply-framework-handoff-393

on:
  push:
    branches:
      - automation/apply-framework-handoff-393
    paths:
      - .github/workflows/task-apply-framework-handoff-393.yml

permissions: {}

jobs:
  prepare:
    if: github.repository == 'Easton97-Jens/ModSecurity-conector' && github.ref == 'refs/heads/automation/apply-framework-handoff-393'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d3daa2087c2f911961779338d3dc68599aad6d63
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Configure external evidence roots and existing locked dependency
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/framework-handoff-393"
          mkdir -p "$root"
          {
            echo "VERIFIED_RUN_ROOT=$root"
            echo "SOURCE_ROOT=$root/src"
            echo "BUILD_ROOT=$root/build"
            echo "TMP_ROOT=$root/tmp"
            echo "LOG_ROOT=$root/logs"
            echo "XDG_STATE_HOME=$root/state"
            echo "CONNECTOR_COMPONENT_CACHE=$root/component-cache"
            echo "NGINX_HARNESS_PARENT=$root/nginx-harness"
          } >> "$GITHUB_ENV"
          python3 -m pip install --require-hashes --only-binary=:all: --no-input -r requirements-ci.lock
          python3 -m pip check
      - name: Resolve reviewed objects and reproduce the original rejection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d3daa2087c2f911961779338d3dc68599aad6d63
          git -c protocol.file.allow=never submodule update --init -- modules/ModSecurity-test-Framework
          git -C modules/ModSecurity-test-Framework fetch --no-tags origin 0290a979ba4bc63a7abed175a53471367b385553
          git -C modules/ModSecurity-test-Framework merge-base --is-ancestor f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 0290a979ba4bc63a7abed175a53471367b385553
          test "$(git -C modules/ModSecurity-test-Framework ls-tree f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 -- tools/MRTS)" = "$(git -C modules/ModSecurity-test-Framework ls-tree 0290a979ba4bc63a7abed175a53471367b385553 -- tools/MRTS)"
          git -C modules/ModSecurity-test-Framework show 0290a979ba4bc63a7abed175a53471367b385553:ci/lib/common.sh > "$RUNNER_TEMP/candidate-common.sh"
          set +e
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --expected-parent-framework-sha f9e48b0774b5bdf7aaa8e38ce98eb6c50bf293c8 --framework-common "$RUNNER_TEMP/candidate-common.sh" > "$RUNNER_TEMP/baseline-rejection.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/baseline-rejection.log"
          test "$result" -eq 2
          grep -F 'Framework common.sh differs from approved reviewed structure' "$RUNNER_TEMP/baseline-rejection.log"
      - name: Verify official NGINX provenance and apply the existing bounded patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          url = 'https://api.github.com/repos/nginx/nginx/releases/tags/release-1.31.6'
          with urllib.request.urlopen(url, timeout=30) as response:
              release = json.load(response)
          assets = [item for item in release['assets'] if item['name'] == 'nginx-1.31.6.tar.gz']
          if release['draft'] or release['prerelease'] or len(assets) != 1:
              raise SystemExit('Official NGINX release is not the reviewed stable asset')
          if assets[0]['state'] != 'uploaded' or assets[0]['digest'] != 'sha256:974ed5298a5e398e008704ed5db284e655fc270c596493dbccada452448fc9f1':
              raise SystemExit('Official NGINX digest mismatch')
          print('Official NGINX release asset metadata: verified')
          PY
          python3 ci/tools/prepare-reviewed-framework-handoff.py --repo-root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/reviewed-framework-handoff.patch"
          git apply --index "$RUNNER_TEMP/reviewed-framework-handoff.patch"
          git -c protocol.file.allow=never submodule update --init --checkout -- modules/ModSecurity-test-Framework
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ci): apply reviewed Framework handoff for isolated validation'
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh"
          python3 ci/tools/sync-framework-component-versions.py --validate --repo-root "$GITHUB_WORKSPACE" --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh" --framework-sha 0290a979ba4bc63a7abed175a53471367b385553
      - name: Run existing CI-security and handoff contracts
        run: make check-ci-security-contract
      - name: Run affected NGINX and preparation regressions
        run: |
          python3 -m unittest -v \
            tests.test_prepare_reviewed_framework_handoff \
            tests.test_change_record \
            tests.test_nginx_exact_head_gate_contract \
            tests.test_nginx_body_buffer_fixture \
            tests.test_prepare_runtime_components \
            tests.test_runtime_component_cache_identity \
            tests.test_runtime_component_cache_contract \
            tests.test_runtime_env_snapshot_contract \
            tests.test_report_presentation_literals \
            tests.test_evidence_output_security \
            tests.test_nginx_functional_evidence
      - name: Produce reviewed source manifest and paired applied-change records
        id: export
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import runpy
          import subprocess

          root = Path.cwd()
          base = 'd3daa2087c2f911961779338d3dc68599aad6d63'
          repair = runpy.run_path(str(root / 'ci/tools/prepare-reviewed-framework-handoff.py'))
          git = lambda *args: subprocess.check_output(['git', *args], text=True).strip()
          actual = set(git('diff', '--name-only', base, 'HEAD').splitlines())
          expected = set(repair['TARGET_PATHS']) | {repair['FRAMEWORK_PATH']}
          if actual != expected or git('status', '--porcelain', '--untracked-files=no'):
              raise SystemExit('Unexpected source inventory or test side effects')
          creator = runpy.run_path(str(root / 'ci/tools/new-change-record.py'))
          contract = creator['CONTRACT']
          record = 'CR-20260930-framework-handoff-applied'
          common = root / repair['FRAMEWORK_PATH'] / 'ci/lib/common.sh'
          digest = repair['structure_digest'](common.read_text(encoding='utf-8'))
          commands = 'Baseline verifier: expected exit 2 reproduced. Existing repair generator and git apply --index: succeeded. Real candidate verifier: verified. Generic synchronizer --validate: succeeded. make check-ci-security-contract: succeeded. The eleven affected unittest modules: succeeded. git diff --cached --check: succeeded. These are hosted Python 3.14.7 checks, not local RTK runs. Final PR-head CI, Sonar and the real read-only namespace are verified separately in the PR.'
          commands_de = 'Basis-Verifier: erwarteter Exitcode 2 reproduziert. Bestehender Reparaturgenerator und git apply --index: erfolgreich. Echter Kandidaten-Verifier: verified. Generischer Synchronisierer --validate: erfolgreich. make check-ci-security-contract: erfolgreich. Die elf betroffenen Unittest-Module: erfolgreich. git diff --cached --check: erfolgreich. Dies sind gehostete Python-3.14.7-Prüfungen, keine lokalen RTK-Läufe. Finale PR-Head-CI, Sonar und der echte Read-only-Namespace werden separat im PR verifiziert.'
          paragraphs = {
              'English': (
                  f'| Field | Value |\n| --- | --- |\n| Change ID | {record} |\n| Date (UTC) | 2026-09-30 |\n| Base revision | `{base}` |',
                  'The user explicitly requested applying the original repair in PR #393. Run 36608694822 rejected the new Framework common.sh at the structural review guard; the skipped sandbox was a consequence. Earlier records describe historical preparation, not the current delivery state.',
                  'Apply the actual Framework gitlink and coherent Parent projections, verify the real candidate and regressions, and require fresh applicable CI and Sonar before review-ready delivery. No merge is authorized.',
                  f'Apply the existing exact-delta generator after reproducing the old failure and verifying official NGINX asset metadata. Framework {repair["OLD_FRAMEWORK_SHA"]} advances to {repair["NEW_FRAMEWORK_SHA"]}. Its common.sh differs by exactly twelve reviewed literal assignments and now has normalized SHA-256 `{digest}`. NGINX is 1.31.6 with SHA-256 `{repair["NEW_NGINX_SHA256"]}`. The full-source regression binds the production review digest to the initialized submodule. The next-release rejection control remains distinct at release-1.31.7.',
                  '\n'.join('- `' + path + '`' for path in sorted(expected)) + '\n\nThis paired record is the only additional source change. The isolated helper workflow is not in the repair tree.',
                  commands,
                  'The structural guard, 25-field mutable registry, parser grammar, Parent provenance policy, sandbox, publisher and protected NGINX broker remain unchanged. No Framework or MRTS source edit, broad automatic approval, scanner suppression or permanent workflow permission change is introduced.',
                  'No native connector runtime promotion or full CRS/MRTS matrix is claimed. Unit and contract results prove only their tested layers.',
                  'Local GitHub DNS and RTK were unavailable. Source application and tests therefore ran on an ephemeral GitHub-hosted runner. The object-storage job does not execute artifact content or move a branch; the final diff is reviewed before the existing PR ref is advanced.',
                  'Future structural Framework changes still require explicit review; the guard is intentionally not bypassed. A regression now catches drift between the real checked-out Framework and Parent review. Separately pinned protected broker provenance is deliberately not advanced.',
                  'No local RTK execution or local Sonar scan was possible. No full native runtime matrix was requested or claimed. Fresh hosted namespace, PR CI and Sonar results are recorded in PR #393 against the final SHA.',
                  'The actual production correction is included in this tree, superseding the preparation-only delivery status. The PR remains unmerged. Review-ready status depends on fresh final-head verification, not the historical preparation checks.',
              ),
              'Deutsch': (
                  f'| Feld | Wert |\n| --- | --- |\n| Change-ID | {record} |\n| Datum (UTC) | 2026-09-30 |\n| Basis-Revision | `{base}` |',
                  'Der Benutzer hat die Anwendung der ursprünglichen Reparatur in PR #393 ausdrücklich angefordert. Lauf 36608694822 lehnte die neue Framework-common.sh am strukturellen Review-Guard ab; die übersprungene Sandbox war eine Folge. Frühere Records dokumentieren die historische Vorbereitung, nicht den aktuellen Lieferstatus.',
                  'Den tatsächlichen Framework-Gitlink und zusammenpassende Parent-Projektionen anwenden, echten Kandidaten und Regressionen prüfen und vor Review-Bereitschaft frische einschlägige CI und Sonar verlangen. Kein Merge ist autorisiert.',
                  f'Den bestehenden Exact-Delta-Generator nach Reproduktion des alten Fehlers und Prüfung offizieller NGINX-Asset-Metadaten anwenden. Framework {repair["OLD_FRAMEWORK_SHA"]} wird auf {repair["NEW_FRAMEWORK_SHA"]} angehoben. Seine common.sh unterscheidet sich durch genau zwölf geprüfte literale Zuweisungen und hat jetzt den normalisierten SHA-256 `{digest}`. NGINX ist 1.31.6 mit SHA-256 `{repair["NEW_NGINX_SHA256"]}`. Die Vollquell-Regression bindet den produktiven Review-Hash an das initialisierte Submodul. Der Negativtest für das nächste Release bleibt mit release-1.31.7 unterscheidbar.',
                  '\n'.join('- `' + path + '`' for path in sorted(expected)) + '\n\nDieser zweisprachige Record ist die einzige zusätzliche Quelländerung. Der isolierte Hilfsworkflow gehört nicht zum Reparaturbaum.',
                  commands_de,
                  'Struktur-Guard, Registry mit 25 veränderlichen Feldern, Parsergrammatik, Parent-Provenance-Policy, Sandbox, Publisher und geschützter NGINX-Broker bleiben unverändert. Keine Framework-/MRTS-Quelländerung, pauschale automatische Freigabe, Scanner-Unterdrückung oder dauerhafte Workflow-Berechtigungsänderung wird eingeführt.',
                  'Weder native Connector-Laufzeitfreigabe noch vollständige CRS-/MRTS-Matrix werden behauptet. Unit- und Vertragsergebnisse belegen nur ihre geprüften Ebenen.',
                  'Lokales GitHub-DNS und RTK waren nicht verfügbar. Quellanwendung und Tests liefen deshalb auf einem kurzlebigen GitHub-Runner. Der Git-Objekt-Job führt keine Artefaktinhalte aus und bewegt keinen Branch; der finale Diff wird vor Aktualisierung des bestehenden PR-Refs geprüft.',
                  'Künftige strukturelle Framework-Änderungen benötigen weiterhin ausdrückliches Review; der Guard wird bewusst nicht umgangen. Eine Regression erkennt jetzt Abweichungen zwischen echtem Framework-Checkout und Parent-Freigabe. Die separat gepinnte geschützte Broker-Provenance wird bewusst nicht angehoben.',
                  'Lokale RTK-Ausführung und lokaler Sonar-Scan waren nicht möglich. Eine vollständige native Laufzeitmatrix wurde weder angefordert noch behauptet. Frische gehostete Namespace-, PR-CI- und Sonar-Ergebnisse werden in PR #393 für die finale SHA dokumentiert.',
                  'Die tatsächliche produktive Korrektur ist in diesem Baum enthalten und ersetzt den reinen Vorbereitungsstatus. Der PR bleibt ungemergt. Review-Bereitschaft hängt von frischer Verifikation des finalen Heads ab, nicht von historischen Vorbereitungsprüfungen.',
              ),
          }
          record_paths = []
          for language, sections in paragraphs.items():
              suffix = '.md' if language == 'English' else '.de.md'
              path = root / 'reports/audits/change-records' / (record + suffix)
              switch = f'**Language:** English | [Deutsch]({record}.de.md)' if language == 'English' else f'**Sprache:** [English]({record}.md) | Deutsch'
              text = '# Change Record: ' + ('applied Framework handoff repair' if language == 'English' else 'angewendete Framework-Handoff-Reparatur') + '\n\n' + switch + '\n\n'
              for heading, paragraph in zip(contract.CHANGE_RECORD_REQUIRED_HEADINGS[language], sections, strict=True):
                  text += heading + '\n\n' + paragraph + '\n\n'
              with path.open('x', encoding='utf-8') as output:
                  output.write(text.rstrip() + '\n')
              record_paths.append(path.relative_to(root).as_posix())
          errors = creator['check_records'](root)
          if errors:
              raise SystemExit('\n'.join(errors))
          entries = []
          for path in sorted(set(repair['TARGET_PATHS']) | set(record_paths)):
              mode = '100644' if path in record_paths else git('ls-tree', base, '--', path).split()[0]
              entries.append({'path': path, 'mode': mode, 'type': 'blob', 'content': (root / path).read_text(encoding='utf-8')})
          entries.append({'path': repair['FRAMEWORK_PATH'], 'mode': '160000', 'type': 'commit', 'sha': repair['NEW_FRAMEWORK_SHA']})
          manifest = {'base': base, 'entries': entries, 'review_digest': digest}
          output = Path(os.environ['RUNNER_TEMP']) / 'framework-handoff-manifest.json'
          payload = json.dumps(manifest, ensure_ascii=False).encode('utf-8')
          output.write_bytes(payload)
          sha256 = hashlib.sha256(payload).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write('manifest_sha256=' + sha256 + '\n')
          print('MANIFEST_SHA256=' + sha256)
          print('REVIEWED_STRUCTURE_SHA256=' + digest)
          print('Final paths:\n' + '\n'.join(item['path'] for item in entries))
          PY
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reviewed-framework-handoff-393
          path: ${{ runner.temp }}/framework-handoff-manifest.json
          if-no-files-found: error
          retention-days: 3

  store-reviewed-objects:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.store.outputs.commit }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: reviewed-framework-handoff-393
          path: ${{ runner.temp }}/reviewed-manifest
      - name: Store only reviewed Git objects without moving any ref
        id: store
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          prefix = '/repos/Easton97-Jens/ModSecurity-conector'
          base = 'd3daa2087c2f911961779338d3dc68599aad6d63'
          path = Path(os.environ['RUNNER_TEMP']) / 'reviewed-manifest/framework-handoff-manifest.json'
          if path.is_symlink() or path.stat().st_size > 16 * 1024 * 1024:
              raise SystemExit('Unsafe manifest')
          payload = path.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['EXPECTED_MANIFEST_SHA256']:
              raise SystemExit('Manifest digest mismatch')
          manifest = json.loads(payload)
          allowed = {
              '.github/workflows/test-nginx-exact-head.yml', '.github/workflows/test-full-smoke-sequential.yml',
              'ci/provisioning/components/prepare-runtime-components.py', 'ci/checks/evidence/check-runtime-producer-readiness.py',
              'tests/run_nginx_body_buffer_fixture.py', 'tests/test_nginx_body_buffer_fixture.py',
              'tests/test_runtime_component_cache_identity.py', 'tests/test_verify_framework_candidate_contract.py',
              'tests/test_nginx_exact_head_gate_contract.py', 'tests/test_report_presentation_literals.py',
              'tests/test_update_framework_versions.py', 'tests/test_prepare_runtime_components.py',
              'tests/test_runtime_env_snapshot_contract.py', 'tests/test_runtime_component_cache_contract.py',
              'tests/test_evidence_output_security.py', 'tests/test_nginx_functional_evidence.py',
              '.github/workflows/test-connectors-with-crs-no-mrts.yml', 'tests/test_ci_security_workflows.py',
              'ci/tools/verify-framework-candidate-contract.py', 'modules/ModSecurity-test-Framework',
              'reports/audits/change-records/CR-20260930-framework-handoff-applied.md',
              'reports/audits/change-records/CR-20260930-framework-handoff-applied.de.md',
          }
          entries = manifest['entries']
          if manifest['base'] != base or len(entries) != len(allowed) or {item['path'] for item in entries} != allowed:
              raise SystemExit('Manifest scope mismatch')

          def api(route, body=None):
              if not route.startswith(prefix + '/'):
                  raise ValueError('Unexpected repository')
              if body is not None and route not in (prefix + '/git/trees', prefix + '/git/commits'):
                  raise ValueError('Only Git object creation is permitted')
              request = urllib.request.Request('https://api.github.com' + route,
                  data=None if body is None else json.dumps(body).encode('utf-8'),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(16 * 1024 * 1024 + 1)
              if len(data) > 16 * 1024 * 1024:
                  raise ValueError('Oversized API response')
              return json.loads(data)

          if api(prefix + '/git/ref/heads/automation/prepare-framework-handoff-36608694822')['object']['sha'] != base:
              raise SystemExit('PR branch moved; review required')
          if api(prefix + '/git/ref/heads/master')['object']['sha'] != 'd56af0856507eb048987974d3960e301e7c24371':
              raise SystemExit('Parent master moved; review required')
          tree_sha = api(prefix + '/git/commits/' + base)['tree']['sha']
          tree = api(prefix + '/git/trees/' + tree_sha + '?recursive=1')
          if tree.get('truncated'):
              raise SystemExit('Incomplete baseline tree')
          original = {item['path']: item for item in tree['tree']}
          for item in entries:
              name = item['path']
              if name == 'modules/ModSecurity-test-Framework':
                  if item != {'path': name, 'mode': '160000', 'type': 'commit', 'sha': '0290a979ba4bc63a7abed175a53471367b385553'}:
                      raise SystemExit('Unexpected gitlink')
              else:
                  if set(item) != {'path', 'mode', 'type', 'content'} or item['type'] != 'blob' or len(item['content'].encode('utf-8')) > 1024 * 1024:
                      raise SystemExit('Invalid text entry')
                  expected_mode = original[name]['mode'] if name in original else '100644'
                  if item['mode'] != expected_mode or item['mode'] not in ('100644', '100755'):
                      raise SystemExit('Unexpected file mode')
          prepared = api(prefix + '/git/trees', {'base_tree': tree_sha, 'tree': entries})
          commit = api(prefix + '/git/commits', {
              'message': 'fix(ci): apply reviewed Framework handoff and align NGINX provenance\n\nAdvance the Framework gitlink and its closed Parent projections to 0290a979.\nReproduce the original failure, preserve all fail-closed boundaries, and\nadd a regression against the actual initialized Framework common.sh.\nHosted candidate, security-contract and affected regression checks passed.',
              'tree': prepared['sha'], 'parents': [base],
          })
          print('PREPARED_REPAIR_COMMIT=' + commit['sha'])
          print('PREPARED_REPAIR_TREE=' + prepared['sha'])
          print('No branch, master, PR status or merge was changed by this job.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as result:
              result.write('commit=' + commit['sha'] + '\n')
          PY

  validate-real-readonly-sandbox:
    needs: store-reviewed-objects
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.store-reviewed-objects.outputs.commit }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Capture the real applied Parent and initialize its exact Framework
        run: |
          set -euo pipefail
          python3 ci/tools/validate-submodule-candidate-state.py capture-parent-baseline --parent-root "$GITHUB_WORKSPACE" --github-env "$GITHUB_ENV"
          git -c protocol.file.allow=never submodule update --init -- modules/ModSecurity-test-Framework
          test "$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)" = 0290a979ba4bc63a7abed175a53471367b385553
          python3 ci/tools/verify-framework-candidate-contract.py --repo-root "$GITHUB_WORKSPACE" --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --framework-common "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework/ci/lib/common.sh"
      - name: Prepare the existing dedicated read-only sandbox
        id: guard
        run: |
          set -euo pipefail
          umask 077
          write_root="$(mktemp -d "$RUNNER_TEMP/modsecurity-readonly-validation.XXXXXX")"
          sudo -n chown root:root "$write_root"
          sudo -n chmod 0711 "$write_root"
          echo "write_root=$write_root" >> "$GITHUB_OUTPUT"
          sudo -n groupadd --system modsecurity-validator
          sudo -n useradd --system --no-create-home --shell /usr/sbin/nologin --gid modsecurity-validator modsecurity-validator
          sudo -n python3 ci/tools/prepare-readonly-submodule-validation-sandbox.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$write_root" --runner-temp "$RUNNER_TEMP" --validator-user modsecurity-validator --validator-group modsecurity-validator
      - name: Execute the original namespace validator without weakening isolation
        env:
          VALIDATION_WRITE_ROOT: ${{ steps.guard.outputs.write_root }}
          EXPECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          set -euo pipefail
          namespace_parent="$(sudo -n mktemp -d /tmp/modsecurity-readonly-namespace.XXXXXX)"
          trap 'sudo -n rmdir -- "$namespace_parent"' EXIT
          sudo -n chown root:modsecurity-validator "$namespace_parent"
          sudo -n chmod 0750 "$namespace_parent"
          sudo -n python3 ci/tools/run-readonly-submodule-validation-namespace.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$VALIDATION_WRITE_ROOT" --external-root "$VALIDATION_WRITE_ROOT/external" --validator-user modsecurity-validator --validator-group modsecurity-validator --python "$EXPECTED_PYTHON" --namespace-parent "$namespace_parent"
      - name: Verify immutable source and Parent state after execution
        if: always() && steps.guard.outcome == 'success'
        env:
          VALIDATION_WRITE_ROOT: ${{ steps.guard.outputs.write_root }}
        run: |
          set -euo pipefail
          sudo -n python3 ci/tools/prepare-readonly-submodule-validation-sandbox.py --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$VALIDATION_WRITE_ROOT" --runner-temp "$RUNNER_TEMP" --validator-user modsecurity-validator --validator-group modsecurity-validator --verify
          python3 ci/tools/validate-submodule-candidate-state.py validate --parent-root "$GITHUB_WORKSPACE" --submodule-path modules/ModSecurity-test-Framework --current-gitlink-sha 0290a979ba4bc63a7abed175a53471367b385553 --candidate-sha 0290a979ba4bc63a7abed175a53471367b385553 --expected-parent-head "$EXPECTED_PARENT_HEAD" --expected-parent-hooks-sha256 "$EXPECTED_PARENT_HOOKS_SHA256" --allowed-nested-gitlink-path tools/MRTS --allowed-nested-submodule-url https://github.com/Easton97-Jens/MRTS.git
          git diff --check
      - name: Clean task-owned sandbox guard
        if: always() && steps.guard.outputs.write_root != ''
        env:

        run: |
          sudo -n python3 ci/tools/prepare-readonly-submodule-validation-sandbox.py --cleanup --source-root "$GITHUB_WORKSPACE" --framework-root "$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" --write-root "$VALIDATION_WRITE_ROOT" --runner-temp "$RUNNER_TEMP"

name: Legacy Open Connector Diagnostics

on:
  workflow_dispatch:

permissions: {}

jobs:
  open-connectors-smoke:
    permissions:
      contents: read
    name: Legacy Envoy, Traefik, and lighttpd diagnostics
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      TMPDIR: /tmp
      ALLOW_RUNTIME_DOWNLOADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/open-connectors-smoke/open-connectors-smoke@0ea6ce7cd3df072822d5444d511348c3ff6eab87
        with:
          framework-revision: 0ea6ce7cd3df072822d5444d511348c3ff6eab87

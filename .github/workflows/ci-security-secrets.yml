name: Secret scanning

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  pull-request-range:
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned Framework identity
        id: framework-gitlink
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD:modules/ModSecurity-test-Framework)
          printf '%s\n' "$revision" | grep -Eq '^[a-f0-9]{40}$'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Bind explicit pinned Framework test context
        shell: bash
        env:
          EXPECTED_FRAMEWORK_REVISION: ${{ steps.framework-gitlink.outputs.revision }}
        run: |
          set -euo pipefail
          connector_root="${GITHUB_WORKSPACE:?}"
          connector_revision=$(git -C "$connector_root" rev-parse HEAD)
          python3 -I "$connector_root/ci/run-trusted-framework.py" \
            --tool connector-context \
            --connector-root "$connector_root" \
            --connector-revision "$connector_revision" -- \
            --connector-root "$connector_root" \
            --connector-revision "$connector_revision" \
            --framework-revision "$EXPECTED_FRAMEWORK_REVISION"
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Fetch checksum-verified Gitleaks
        run: python3 -P ci/tools/fetch_security_tool.py --tool gitleaks --destination "$RUNNER_TEMP/security-tools"
      - name: Scan exact pull-request commit range with redaction
        run: |
          set -eu
          BASE_COMMIT="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact=100 --log-opts="$BASE_COMMIT..$HEAD_SHA" .

  advisory-full-history:
    permissions:
      contents: read
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - name: Read the pinned Framework identity
        id: framework-gitlink
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD:modules/ModSecurity-test-Framework)
          printf '%s\n' "$revision" | grep -Eq '^[a-f0-9]{40}$'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Bind explicit pinned Framework test context
        shell: bash
        env:
          EXPECTED_FRAMEWORK_REVISION: ${{ steps.framework-gitlink.outputs.revision }}
        run: |
          set -euo pipefail
          connector_root="${GITHUB_WORKSPACE:?}"
          connector_revision=$(git -C "$connector_root" rev-parse HEAD)
          python3 -I "$connector_root/ci/run-trusted-framework.py" \
            --tool connector-context \
            --connector-root "$connector_root" \
            --connector-revision "$connector_revision" -- \
            --connector-root "$connector_root" \
            --connector-revision "$connector_revision" \
            --framework-revision "$EXPECTED_FRAMEWORK_REVISION"
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Fetch checksum-verified Gitleaks
        run: python3 -P ci/tools/fetch_security_tool.py --tool gitleaks --destination "$RUNNER_TEMP/security-tools"
      - name: Scan full history with redaction (advisory)
        continue-on-error: true
        run: |
          "$RUNNER_TEMP/security-tools/gitleaks" git --redact=100 --log-opts='--all' .
      - name: Record advisory limitation
        if: always()
        run: echo 'Full-history Gitleaks is advisory until historical findings are triaged.' >> "$GITHUB_STEP_SUMMARY"

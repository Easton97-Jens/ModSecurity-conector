          expected_gid = int(expected_gid_text)
          maximum_bytes = 1024
          expected_names = ("haproxy-runtime-evidence.json", "manifest.json")
          expected_fields = {"files", "record_type", "schema_version"}
          digest_fields = {"name", "sha256"}
          digest_pattern = re.compile(r"^[0-9a-f]{64}$", re.ASCII)

          def reject_duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError("duplicate key")
                  value[key] = item
              return value

          descriptor = os.open(
              report_path,
              os.O_RDONLY | os.O_NOFOLLOW | getattr(os, "O_CLOEXEC", 0),
          )
          try:
              before = os.fstat(descriptor)
              if (
                  not stat.S_ISREG(before.st_mode)
                  or before.st_nlink != 1
                  or before.st_uid != 0
                  or before.st_gid != expected_gid
                  or stat.S_IMODE(before.st_mode) != 0o640
                  or before.st_size <= 0
                  or before.st_size > maximum_bytes
              ):
                  raise ValueError("unsafe digest report file")
              raw = os.read(descriptor, maximum_bytes + 1)
              after = os.fstat(descriptor)
          finally:
              os.close(descriptor)
          if len(raw) != before.st_size or len(raw) > maximum_bytes or (
              before.st_dev,
              before.st_ino,
              before.st_size,
              before.st_mode,
              before.st_uid,
              before.st_gid,
              before.st_nlink,
          ) != (
              after.st_dev,
              after.st_ino,
              after.st_size,
              after.st_mode,
              after.st_uid,
              after.st_gid,
              after.st_nlink,
          ):
              raise ValueError("raced digest report file")
          if not raw.endswith(b"\n") or b"\0" in raw:
              raise ValueError("unsafe digest report bytes")
          document = json.loads(raw.decode("utf-8"), object_pairs_hook=reject_duplicate_keys)
          canonical = (
              json.dumps(document, allow_nan=False, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
              + "\n"
          ).encode("utf-8")
          if raw != canonical or type(document) is not dict or set(document) != expected_fields:
              raise ValueError("noncanonical digest report")
          if (
              document["record_type"] != "haproxy_runtime_evidence_digests"
              or type(document["schema_version"]) is not int
              or document["schema_version"] != 1
          ):
              raise ValueError("unexpected digest report metadata")
          files = document["files"]
          if type(files) is not list or len(files) != len(expected_names):
              raise ValueError("unexpected digest report files")
          values = {}
          for expected_name, item in zip(expected_names, files):
              if type(item) is not dict or set(item) != digest_fields:
                  raise ValueError("unexpected digest report entry")
              name = item["name"]
              digest = item["sha256"]
              if name != expected_name or type(digest) is not str or digest_pattern.fullmatch(digest) is None:
                  raise ValueError("unsafe digest report entry")
              values[name] = digest
          with open(output_path, "a", encoding="ascii", newline="\n") as output:
              output.write("evidence_sha256=" + values[expected_names[0]] + "\n")
              output.write("manifest_sha256=" + values[expected_names[1]] + "\n")
          print("haproxy_runtime_evidence_sha256=" + values[expected_names[0]])
          print("haproxy_runtime_manifest_sha256=" + values[expected_names[1]])
          PY
          /usr/bin/sudo -n /usr/bin/rm -f -- "$digest_report"
          test ! -e "$digest_report"
          test ! -L "$digest_report"

      - name: Upload non-HAProxy runtime evidence
        id: upload-non-haproxy-runtime-evidence
        if: always() && matrix.connector != 'haproxy'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: with-crs-no-mrts-${{ matrix.connector }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.VERIFIED_RUN_ROOT }}/evidence
            ${{ env.BUILD_ROOT }}/verified-apache-case/with-crs/no-mrts/results
          if-no-files-found: error
          retention-days: 10
          overwrite: false

      - name: Upload real runtime evidence
        id: upload-runtime-evidence
        if: matrix.connector == 'haproxy' && steps.verify-haproxy-runtime-evidence.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: with-crs-no-mrts-${{ matrix.connector }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.project-haproxy-runtime-evidence.outputs.stage_root }}/haproxy-runtime-evidence.json
            ${{ steps.project-haproxy-runtime-evidence.outputs.stage_root }}/manifest.json
          if-no-files-found: error
          retention-days: 10
          overwrite: false

      - name: Cleanup HAProxy runtime evidence stage
        if: always() && matrix.connector == 'haproxy'
        env:
          STAGE_PARENT: ${{ steps.prepare-haproxy-runtime-evidence.outputs.stage_parent }}
          TRUSTED_EVIDENCE_STAGE_ROOT: /tmp
        run: |
          set -euo pipefail
          test "$TRUSTED_EVIDENCE_STAGE_ROOT" = /tmp
          test -d "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test ! -L "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test "$(/usr/bin/realpath -e -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = 0:0:1777
          if test -n "$STAGE_PARENT"; then
            case "$STAGE_PARENT" in "$TRUSTED_EVIDENCE_STAGE_ROOT"/haproxy-runtime-evidence-parent.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;; *) echo "FAIL: unsafe evidence cleanup path" >&2; exit 2 ;; esac
            test ! -L "$STAGE_PARENT"
            test "$(/usr/bin/sudo -n /usr/bin/realpath -e -- "$STAGE_PARENT")" = "$STAGE_PARENT"
            case "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a' -- "$STAGE_PARENT")" in
              0:0:700|0:0:755) ;;
              *) echo "FAIL: unsafe evidence cleanup parent" >&2; exit 2 ;;
            esac
            /usr/bin/sudo -n /usr/bin/rm -rf -- "$STAGE_PARENT"
            test ! -e "$STAGE_PARENT"
            test ! -L "$STAGE_PARENT"
          fi

      - name: Write connector runtime overview
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
          PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_PYTHON_OUTCOME: ${{ steps.setup-python.outcome }}
          VERIFY_PYTHON_OUTCOME: ${{ steps.verify-python.outcome }}
          VERIFY_REVISIONS_OUTCOME: ${{ steps.verify-revisions.outcome }}
          INSTALL_DEPENDENCIES_OUTCOME: ${{ steps.install-framework-ci.outcome }}
          VERIFY_CELL_OUTCOME: ${{ steps.verify-runtime-cell.outcome }}
          INITIALIZE_ROOTS_OUTCOME: ${{ steps.initialize-runtime-roots.outcome }}
          PREPARE_CRS_OUTCOME: ${{ steps.prepare-crs-source.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime.outcome }}
          UPLOAD_EVIDENCE_OUTCOME: ${{ matrix.connector == 'haproxy' && steps.upload-runtime-evidence.outcome || steps.upload-non-haproxy-runtime-evidence.outcome }}
        run: |
          set -euo pipefail
          require_sha() {
            case "$1" in ''|*[!0-9a-f]*) return 1 ;; esac
            test "${#1}" -eq 40
          }
          require_decimal() {
            case "$1" in ''|*[!0-9]*) return 1 ;; esac
            test "$1" -gt 0
          }
          require_sha "$PARENT_SHA"
          summary_uid=$(/usr/bin/id -u)
          summary_gid=$(/usr/bin/id -g)
          require_decimal "$summary_uid"
          require_decimal "$summary_gid"
          summary_blob=$(
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              HOME=/nonexistent \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_OPTIONAL_LOCKS=0 \
              /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" rev-parse "$PARENT_SHA:ci/runtime/lifecycle/summarize-with-crs-no-mrts-workflow.py"
          )
          require_sha "$summary_blob"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 \
            /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" cat-file -e "${summary_blob}^{blob}"
          /usr/bin/sudo -n /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            /usr/bin/unshare \
              --mount \
              --pid \
              --fork \
              --kill-child=SIGKILL \
              --mount-proc=/proc \
              --propagation private \
              /usr/bin/setpriv \
                --reuid="$summary_uid" \
                --regid="$summary_gid" \
                --clear-groups \
                --no-new-privs \
                --inh-caps=-all \
                --ambient-caps=-all \
                --bounding-set=-all \
                -- /usr/bin/env -i \
                  PATH=/usr/bin:/bin \
                  HOME=/nonexistent \
                  GIT_CONFIG_NOSYSTEM=1 \
                  GIT_CONFIG_GLOBAL=/dev/null \
                  GIT_CONFIG_SYSTEM=/dev/null \
                  GIT_OPTIONAL_LOCKS=0 \
                  RUNNER_TEMP="$RUNNER_TEMP" \
                  GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
                  CHECKOUT_OUTCOME="$CHECKOUT_OUTCOME" \
                  SETUP_PYTHON_OUTCOME="$SETUP_PYTHON_OUTCOME" \
                  VERIFY_PYTHON_OUTCOME="$VERIFY_PYTHON_OUTCOME" \
                  VERIFY_REVISIONS_OUTCOME="$VERIFY_REVISIONS_OUTCOME" \
                  INSTALL_DEPENDENCIES_OUTCOME="$INSTALL_DEPENDENCIES_OUTCOME" \
                  VERIFY_CELL_OUTCOME="$VERIFY_CELL_OUTCOME" \
                  INITIALIZE_ROOTS_OUTCOME="$INITIALIZE_ROOTS_OUTCOME" \
                  PREPARE_CRS_OUTCOME="$PREPARE_CRS_OUTCOME" \
                  RUNTIME_OUTCOME="$RUNTIME_OUTCOME" \
                  UPLOAD_EVIDENCE_OUTCOME="$UPLOAD_EVIDENCE_OUTCOME" \
                  /usr/bin/python3 -I -c '
          import hashlib
          import subprocess
          import sys
          blob, workspace, *arguments = sys.argv[1:]
          try:
              source = subprocess.check_output(
                  ["/usr/bin/git", "--no-pager", "-C", workspace, "cat-file", "blob", blob],
                  env={
                      "PATH": "/usr/bin:/bin",
                      "HOME": "/nonexistent",
                      "GIT_CONFIG_NOSYSTEM": "1",
                      "GIT_CONFIG_GLOBAL": "/dev/null",
                      "GIT_CONFIG_SYSTEM": "/dev/null",
                      "GIT_OPTIONAL_LOCKS": "0",
                  },
                  stderr=subprocess.DEVNULL,
              )
          except subprocess.CalledProcessError:
              raise SystemExit(2)
          if not source or len(source) > 131072:
              raise SystemExit(2)
          if hashlib.sha1(b"blob " + str(len(source)).encode("ascii") + b"\0" + source).hexdigest() != blob:
              raise SystemExit(2)
          sys.argv = ["<verified-workflow-summary>", *arguments]
          namespace = {"__name__": "__main__", "__file__": "<verified-git-blob>"}
          exec(compile(source, namespace["__file__"], "exec"), namespace)
          ' "$summary_blob" "$GITHUB_WORKSPACE" --connector "$CONNECTOR"

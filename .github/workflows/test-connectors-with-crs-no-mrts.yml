name: Connector runtime with CRS and no MRTS

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/test-connectors-with-crs-no-mrts.yml
      - tests/test_ci_security_workflows.py
      - tests/test_with_crs_no_mrts_runtime.py
      - ci/checks/common/check-python-interpreter-contract.py
      - ci/provisioning/**
      - ci/lib/**
      - ci/runtime/**
      - connectors/apache/**
      - connectors/envoy/**
      - connectors/haproxy/**
      - connectors/lighttpd/**
      - connectors/traefik/**
      - config/**
      - Makefile
      - .python-version
      - .gitmodules
      - modules/ModSecurity-test-Framework
      - modules/ModSecurity-test-Framework/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-runtime-with-crs-no-mrts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  connector-mode:
    name: Runtime with CRS / no MRTS / ${{ matrix.connector }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: apache
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: apache
          - connector: envoy
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
          - connector: haproxy
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: haproxy
          - connector: lighttpd
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
          - connector: traefik
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
    env:
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      CRS: ${{ matrix.crs }}
      MRTS: ${{ matrix.mrts }}
      RUNTIME_COMPONENT_TARGET: ${{ matrix.runtime_component_target }}
      CRS_RUNTIME_RUN_ID: crs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.connector }}
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_FRAMEWORK_SHA: 86451b45ae7bb7953baf9f81f2c2dad07395a808
      EXPECTED_MRTS_SHA: 615b13bacbd008562c17408246c41ab27dca3104
      EVIDENCE_ROOT: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact Parent head with pinned submodules
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up locked Python toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        id: verify-python
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Verify pinned Parent, Framework, and MRTS revisions
        id: verify-revisions
        run: |
          set -euo pipefail
          parent_commit=$(git rev-parse HEAD)
          framework_commit=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          mrts_commit=$(git -C modules/ModSecurity-test-Framework/tools/MRTS rev-parse HEAD)
          test "$parent_commit" = "$EXPECTED_PARENT_SHA"
          test "$framework_commit" = "$EXPECTED_FRAMEWORK_SHA"
          test "$mrts_commit" = "$EXPECTED_MRTS_SHA"

      - name: Install hash-locked Framework CI dependency
        id: install-framework-ci
        env:
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          "$SETUP_PYTHON_PATH" -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
            --require-hashes -r modules/ModSecurity-test-Framework/requirements-ci.lock
          "$SETUP_PYTHON_PATH" -m pip check

      - name: Verify exact real-runtime cell
        id: verify-runtime-cell
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR:$CRS:$MRTS" in
            apache:with-crs:no-mrts|envoy:with-crs:no-mrts|haproxy:with-crs:no-mrts|lighttpd:with-crs:no-mrts|traefik:with-crs:no-mrts) ;;
            *) echo "FAIL: connector is outside the fixed with-CRS/no-MRTS runtime set: $CONNECTOR" >&2; exit 2 ;;
          esac

      - name: Initialize private runtime roots
        id: initialize-runtime-roots
        env:
          CONNECTOR: ${{ matrix.connector }}
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in apache|envoy|haproxy|lighttpd|traefik) ;; *) exit 2 ;; esac
          case "$CRS_RUNTIME_RUN_ID" in [A-Za-z0-9]*) ;; *) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
          case "$CRS_RUNTIME_RUN_ID" in *[!A-Za-z0-9._-]*) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
          test "${#CRS_RUNTIME_RUN_ID}" -le 48
          case "$SETUP_PYTHON_PATH" in /*) ;; *) echo "FAIL: setup Python is not absolute" >&2; exit 2 ;; esac
          case "$SETUP_PYTHON_PATH" in *[!A-Za-z0-9_./-]*) echo "FAIL: setup Python path is unsafe" >&2; exit 2 ;; esac
          test -x "$SETUP_PYTHON_PATH"
          parent_commit=$(git rev-parse HEAD)
          case "$parent_commit" in *[!0-9a-f]*|"") echo "FAIL: invalid Parent revision" >&2; exit 2 ;; esac
          test "${#parent_commit}" -eq 40
          cell_parent="$RUNNER_TEMP/ModSecurity-conector-with-crs-no-mrts/$parent_commit"
          cell_root="$cell_parent/$CRS_RUNTIME_RUN_ID"
          verified_root="$cell_root/verified"
          case "$cell_root" in "$RUNNER_TEMP"/*) ;; *) echo "FAIL: unsafe runner path" >&2; exit 2 ;; esac
          umask 077
          mkdir -p "$cell_parent"
          test ! -e "$cell_root"
          test ! -L "$cell_root"
          mkdir "$cell_root"
          chmod 700 "$cell_parent" "$cell_root"
          {
            printf '%s\n' "VERIFIED_RUN_ROOT=$verified_root"
            printf '%s\n' "BUILD_ROOT=$verified_root/build"
            printf '%s\n' "SOURCE_ROOT=$verified_root/src"
            printf '%s\n' "TMP_ROOT=$verified_root/tmp"
            printf '%s\n' "LOG_ROOT=$verified_root/logs"
            printf '%s\n' "CACHE_ROOT=$verified_root/cache-v2"
            printf '%s\n' "CONNECTOR_COMPONENT_CACHE=$verified_root/cache-v2/shared"
            printf '%s\n' "FRAMEWORK_ROOT=$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework"
            printf '%s\n' "PYTHON=$SETUP_PYTHON_PATH"
            printf '%s\n' "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Prepare fresh CRS source for Apache and HAProxy
        id: prepare-crs-source
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in
            apache|haproxy)
              (
                . "$FRAMEWORK_ROOT/ci/lib/common.sh"
                . ci/runtime/lifecycle/prepare-fresh-crs-source.sh
                sh "$FRAMEWORK_ROOT/ci/provisioning/fetch-crs.sh"
                # GITHUB_ENV is applied between steps.  Publish only the
                # helper-validated, fresh run-owned CRS roots for the Make
                # target in the following step.
                printf '%s\n' "SOURCE_ROOT=$SOURCE_ROOT" "CRS_SOURCE_DIR=$CRS_SOURCE_DIR" >> "$GITHUB_ENV"
              )
              ;;
            envoy|lighttpd|traefik)
              ;;
            *)
              echo "FAIL: connector is outside the fixed runtime set: $CONNECTOR" >&2
              exit 2
              ;;
          esac

      - name: Prepare HAProxy runtime evidence boundary
        id: prepare-haproxy-runtime-evidence
        if: matrix.connector == 'haproxy'
        env:
          PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FRAMEWORK_SHA: 86451b45ae7bb7953baf9f81f2c2dad07395a808
          MRTS_SHA: 615b13bacbd008562c17408246c41ab27dca3104
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          TRUSTED_RUNNER_TEMP: ${{ runner.temp }}
          TRUSTED_EVIDENCE_STAGE_ROOT: /tmp
          TRUSTED_CRS_RUNTIME_RUN_ID: crs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.connector }}
        run: |
          set -euo pipefail
          require_sha() {
            case "$1" in ''|*[!0-9a-f]*) return 1 ;; esac
            test "${#1}" -eq 40
          }
          require_decimal() {
            case "$1" in ''|*[!0-9]*) return 1 ;; esac
            test "$1" -gt 0
          }
          case "$TRUSTED_RUNNER_TEMP:$TRUSTED_EVIDENCE_STAGE_ROOT:$RUNNER_TEMP:$GITHUB_WORKSPACE:$SETUP_PYTHON_PATH" in /*:/*:/*:/*:/*) ;; *) echo "FAIL: unsafe evidence boundary path" >&2; exit 2 ;; esac
          test "$RUNNER_TEMP" = "$TRUSTED_RUNNER_TEMP"
          test "$CRS_RUNTIME_RUN_ID" = "$TRUSTED_CRS_RUNTIME_RUN_ID"
          case "$TRUSTED_CRS_RUNTIME_RUN_ID" in [A-Za-z0-9]*) ;; *) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
          case "$TRUSTED_CRS_RUNTIME_RUN_ID" in *[!A-Za-z0-9._-]*) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
          test "${#TRUSTED_CRS_RUNTIME_RUN_ID}" -le 48
          test "$CRS" = with-crs
          test "$MRTS" = no-mrts
          require_sha "$PARENT_SHA"
          require_sha "$FRAMEWORK_SHA"
          require_sha "$MRTS_SHA"
          parent_commit=$(git rev-parse HEAD)
          test "$parent_commit" = "$PARENT_SHA"
          runtime_uid=$(/usr/bin/id -u)
          runtime_gid=$(/usr/bin/id -g)
          require_decimal "$runtime_uid"
          require_decimal "$runtime_gid"
          evidence_uid=$(/usr/bin/getent passwd nobody | /usr/bin/cut -d: -f3)
          evidence_gid=$(/usr/bin/getent group nogroup | /usr/bin/cut -d: -f3)
          require_decimal "$evidence_uid"
          require_decimal "$evidence_gid"
          test "$evidence_uid" -ne "$runtime_uid"
          test "$evidence_gid" -ne "$runtime_gid"
          test "$(/usr/bin/id -g nobody)" = "$evidence_gid"
          for system_binary in /usr/bin/chmod /usr/bin/chown /usr/bin/env /usr/bin/git /usr/bin/head /usr/bin/id /usr/bin/install /usr/bin/mkdir /usr/bin/mktemp /usr/bin/python3 /usr/bin/realpath /usr/bin/rm /usr/bin/setpriv /usr/bin/stat /usr/bin/sudo /usr/bin/tee /usr/bin/unshare; do
            test -x "$system_binary"
          done
          projector_blob=$(
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              HOME=/nonexistent \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_OPTIONAL_LOCKS=0 \
              /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" rev-parse "$PARENT_SHA:ci/runtime/lifecycle/project-haproxy-runtime-evidence.py"
          )
          require_sha "$projector_blob"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 \
            /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" cat-file -e "${projector_blob}^{blob}"
          runner_temp_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$TRUSTED_RUNNER_TEMP")
          case "$runner_temp_identity" in [0-9]*:[0-9]*:[0-9]*:[0-9]*:[0-7][0-7][0-7]) ;; *) echo "FAIL: unsafe RUNNER_TEMP identity" >&2; exit 2 ;; esac
          test ! -L "$TRUSTED_RUNNER_TEMP"
          test "$(/usr/bin/realpath -e -- "$TRUSTED_RUNNER_TEMP")" = "$TRUSTED_RUNNER_TEMP"
          test "$TRUSTED_EVIDENCE_STAGE_ROOT" = /tmp
          test -d "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test ! -L "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test "$(/usr/bin/realpath -e -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = "$TRUSTED_EVIDENCE_STAGE_ROOT"
          test "$(/usr/bin/stat -Lc '%u:%g:%a' -- "$TRUSTED_EVIDENCE_STAGE_ROOT")" = 0:0:1777
          stage_parent=''
          cleanup_stage_parent() {
            case "$stage_parent" in
              '') return 0 ;;
              "$TRUSTED_EVIDENCE_STAGE_ROOT"/haproxy-runtime-evidence-parent.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;;
              *) return 2 ;;
            esac
            test ! -L "$stage_parent"
            case "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a' -- "$stage_parent")" in
              0:0:700|0:0:710|0:0:755) ;;
              *) return 2 ;;
            esac
            /usr/bin/sudo -n /usr/bin/rm -rf -- "$stage_parent"
            test ! -e "$stage_parent"
            test ! -L "$stage_parent"
          }
          trap cleanup_stage_parent EXIT
          stage_parent=$(/usr/bin/sudo -n /usr/bin/mktemp -d -- "$TRUSTED_EVIDENCE_STAGE_ROOT/haproxy-runtime-evidence-parent.XXXXXXXX")
          case "$stage_parent" in "$TRUSTED_EVIDENCE_STAGE_ROOT"/haproxy-runtime-evidence-parent.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9]) ;; *) echo "FAIL: unsafe evidence stage parent" >&2; exit 2 ;; esac
          test ! -L "$stage_parent"
          test "$(/usr/bin/sudo -n /usr/bin/realpath -e -- "$stage_parent")" = "$stage_parent"
          test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a' -- "$stage_parent")" = 0:0:700
          projector_source="$stage_parent/verified-projector.py"
          test ! -e "$projector_source"
          test ! -L "$projector_source"
          /usr/bin/sudo -n /usr/bin/chown --no-dereference "0:$runtime_gid" -- "$stage_parent"
          /usr/bin/sudo -n /usr/bin/chmod 0710 -- "$stage_parent"
          /usr/bin/sudo -n /usr/bin/install -m 0600 /dev/null "$projector_source"
          /usr/bin/sudo -n /usr/bin/chown --no-dereference "$runtime_uid:$runtime_gid" -- "$projector_source"
          test ! -L "$projector_source"
          test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a:%h:%s' -- "$projector_source")" = "$runtime_uid:$runtime_gid:600:1:0"
          /usr/bin/env -i \
            PATH=/usr/bin:/bin \
            HOME=/nonexistent \
            GIT_CONFIG_NOSYSTEM=1 \
            GIT_CONFIG_GLOBAL=/dev/null \
            GIT_CONFIG_SYSTEM=/dev/null \
            GIT_OPTIONAL_LOCKS=0 \
            /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" cat-file blob "$projector_blob" > "$projector_source"
          projector_source_size=$(/usr/bin/stat -Lc '%s' -- "$projector_source")
          require_decimal "$projector_source_size"
          test "$projector_source_size" -le 131072
          projector_source_blob=$(
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              HOME=/nonexistent \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_OPTIONAL_LOCKS=0 \
              /usr/bin/git --no-pager -C "$GITHUB_WORKSPACE" hash-object -t blob --stdin < "$projector_source"
          )
          require_sha "$projector_source_blob"
          test "$projector_source_blob" = "$projector_blob"
          /usr/bin/sudo -n /usr/bin/chown --no-dereference 0:0 -- "$projector_source"
          /usr/bin/sudo -n /usr/bin/chmod 0444 -- "$projector_source"
          /usr/bin/sudo -n /usr/bin/chown --no-dereference 0:0 -- "$stage_parent"
          /usr/bin/sudo -n /usr/bin/chmod 0700 -- "$stage_parent"
          test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a' -- "$stage_parent")" = 0:0:700
          test "$(/usr/bin/sudo -n /usr/bin/realpath -e -- "$projector_source")" = "$projector_source"
          test "$(/usr/bin/sudo -n /usr/bin/stat -Lc '%u:%g:%a:%h:%s' -- "$projector_source")" = "0:0:444:1:$projector_source_size"
          expected_runtime_root="$TRUSTED_RUNNER_TEMP/ModSecurity-conector-with-crs-no-mrts"
          expected_cell_parent="$expected_runtime_root/$PARENT_SHA"
          expected_cell_root="$expected_cell_parent/$TRUSTED_CRS_RUNTIME_RUN_ID"
          expected_verified_root="$expected_cell_root/verified"
          expected_build_root="$expected_verified_root/build"
          expected_tmp_root="$expected_verified_root/tmp"
          expected_log_root="$expected_verified_root/logs"
          expected_cache_root="$expected_verified_root/cache-v2"
          expected_component_cache="$expected_cache_root/shared"
          expected_crs_source_root="$expected_verified_root/crs-fresh-source"
          expected_crs_source_dir="$expected_crs_source_root/coreruleset"
          expected_framework_root="$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework"
          expected_pycache_root="$TRUSTED_RUNNER_TEMP/python-pycache"
          for runtime_path in "$TRUSTED_RUNNER_TEMP" "$expected_runtime_root" "$expected_cell_parent" "$expected_cell_root" "$expected_verified_root"; do
            test -d "$runtime_path"
            test ! -L "$runtime_path"
            test "$(/usr/bin/realpath -e -- "$runtime_path")" = "$runtime_path"
          done
          test "$VERIFIED_RUN_ROOT" = "$expected_verified_root"
          test "$BUILD_ROOT" = "$expected_build_root"
          test "$TMP_ROOT" = "$expected_tmp_root"
          test "$LOG_ROOT" = "$expected_log_root"
          test "$CACHE_ROOT" = "$expected_cache_root"
          test "$CONNECTOR_COMPONENT_CACHE" = "$expected_component_cache"
          test "$SOURCE_ROOT" = "$expected_crs_source_root"
          test "$CRS_SOURCE_DIR" = "$expected_crs_source_dir"
          test "$FRAMEWORK_ROOT" = "$expected_framework_root"
          test "$PYTHONPYCACHEPREFIX" = "$expected_pycache_root"
          test -d "$expected_crs_source_root"
          test -d "$expected_crs_source_dir"
          cell_root_identity=$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$expected_cell_root")
          case "$cell_root_identity" in [0-9]*:[0-9]*:[0-9]*:[0-9]*:[0-7][0-7][0-7]) ;; *) echo "FAIL: unsafe runtime cell identity" >&2; exit 2 ;; esac
          probe_uid=$(
            /usr/bin/sudo -n /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              HOME=/nonexistent \
              /usr/bin/unshare \
                --mount \
                --pid \
                --fork \
                --kill-child=SIGKILL \
                --mount-proc=/proc \
                --propagation private \
                /usr/bin/setpriv \
                  --reuid="$runtime_uid" \
                  --regid="$runtime_gid" \
                  --clear-groups \
                  --no-new-privs \
                  --inh-caps=-all \
                  --ambient-caps=-all \
                  --bounding-set=-all \
                  -- /usr/bin/id -u
          )
          test "$probe_uid" = "$runtime_uid"
          source_root="$expected_build_root/verified-haproxy-case/with-crs-no-mrts-haproxy/logs/haproxy-runtime/haproxy-runtime-evidence-source"
          case "$source_root" in "$TRUSTED_RUNNER_TEMP"/*) ;; *) echo "FAIL: unsafe evidence source root" >&2; exit 2 ;; esac
          {
            printf '%s\n' "runtime_uid=$runtime_uid"
            printf '%s\n' "runtime_gid=$runtime_gid"
            printf '%s\n' "evidence_uid=$evidence_uid"
            printf '%s\n' "evidence_gid=$evidence_gid"
            printf '%s\n' "runner_temp=$TRUSTED_RUNNER_TEMP"
            printf '%s\n' "runner_temp_identity=$runner_temp_identity"
            printf '%s\n' "runtime_run_id=$TRUSTED_CRS_RUNTIME_RUN_ID"
            printf '%s\n' "cell_root_identity=$cell_root_identity"
            printf '%s\n' "source_root=$source_root"
            printf '%s\n' "stage_parent=$stage_parent"
            printf '%s\n' "projector_source=$projector_source"
            printf '%s\n' "projector_blob=$projector_blob"
            printf '%s\n' "parent_sha=$PARENT_SHA"
            printf '%s\n' "framework_sha=$FRAMEWORK_SHA"
            printf '%s\n' "mrts_sha=$MRTS_SHA"
          } >> "$GITHUB_OUTPUT"
          trap - EXIT

      - name: Run selected real with-CRS no-MRTS runtime
        id: runtime
        env:
          CONNECTOR: ${{ matrix.connector }}
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
          RUNTIME_UID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_uid }}
          RUNTIME_GID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_gid }}
          RUNTIME_PARENT_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.parent_sha }}
          RUNTIME_FRAMEWORK_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.framework_sha }}
          RUNTIME_MRTS_SHA: ${{ steps.prepare-haproxy-runtime-evidence.outputs.mrts_sha }}
          TRUSTED_RUNNER_TEMP: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runner_temp }}
          TRUSTED_RUNNER_TEMP_IDENTITY: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runner_temp_identity }}
          TRUSTED_CRS_RUNTIME_RUN_ID: ${{ steps.prepare-haproxy-runtime-evidence.outputs.runtime_run_id }}
          RUNTIME_CELL_ROOT_IDENTITY: ${{ steps.prepare-haproxy-runtime-evidence.outputs.cell_root_identity }}
        run: |
          set -euo pipefail
          require_sha() {
            case "$1" in ''|*[!0-9a-f]*) return 1 ;; esac
            test "${#1}" -eq 40
          }
          require_decimal() {
            case "$1" in ''|*[!0-9]*) return 1 ;; esac
            test "$1" -gt 0
          }
          case "$CONNECTOR" in
            apache)
              EVIDENCE_ROOT='' make verified-apache-case CASE=crs_sqli_anomaly_block CRS="$CRS" MRTS="$MRTS"
              ;;
            haproxy)
              require_decimal "$RUNTIME_UID"
              require_decimal "$RUNTIME_GID"
              require_sha "$RUNTIME_PARENT_SHA"
              require_sha "$RUNTIME_FRAMEWORK_SHA"
              require_sha "$RUNTIME_MRTS_SHA"
              case "$TRUSTED_RUNNER_TEMP:$RUNNER_TEMP:$SETUP_PYTHON_PATH" in /*:/*:/*) ;; *) echo "FAIL: unsafe runtime path" >&2; exit 2 ;; esac
              test "$RUNNER_TEMP" = "$TRUSTED_RUNNER_TEMP"
              test "$(/usr/bin/stat -Lc '%d:%i:%u:%g:%a' -- "$TRUSTED_RUNNER_TEMP")" = "$TRUSTED_RUNNER_TEMP_IDENTITY"
              test "$CRS_RUNTIME_RUN_ID" = "$TRUSTED_CRS_RUNTIME_RUN_ID"
              case "$TRUSTED_CRS_RUNTIME_RUN_ID" in [A-Za-z0-9]*) ;; *) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
              case "$TRUSTED_CRS_RUNTIME_RUN_ID" in *[!A-Za-z0-9._-]*) echo "FAIL: invalid runtime run id" >&2; exit 2 ;; esac
              test "${#TRUSTED_CRS_RUNTIME_RUN_ID}" -le 48

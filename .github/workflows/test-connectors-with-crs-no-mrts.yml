name: Connector runtime with CRS and no MRTS

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/test-connectors-with-crs-no-mrts.yml
      - tests/test_ci_security_workflows.py
      - tests/test_with_crs_no_mrts_runtime.py
      - ci/checks/common/check-python-interpreter-contract.py
      - ci/provisioning/**
      - ci/lib/**
      - ci/tooling/project-versions.lock.json
      - ci/tools/read-framework-revisions.py
      - ci/tools/sync-project-versions.py
      - ci/runtime/**
      - connectors/apache/**
      - connectors/envoy/**
      - connectors/haproxy/**
      - connectors/lighttpd/**
      - connectors/traefik/**
      - config/**
      - Makefile
      - .python-version
      - .gitmodules
      - modules/ModSecurity-test-Framework
      - modules/ModSecurity-test-Framework/**
  workflow_dispatch:
    inputs:
      parent_sha:
        description: Exact full candidate head SHA for this manual profile run
        required: true
        type: string
      base_sha:
        description: Exact full checked base SHA for this manual profile run
        required: true
        type: string

permissions: {}

concurrency:
  group: connector-runtime-with-crs-no-mrts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  connector-mode:
    permissions:
      contents: read
    name: Runtime with CRS / no MRTS / ${{ matrix.connector }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - connector: apache
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: apache
          - connector: envoy
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
          - connector: haproxy
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: haproxy
          - connector: lighttpd
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
          - connector: traefik
            crs: with-crs
            mrts: no-mrts
            runtime_component_target: shared
    env:
      GOTOOLCHAIN: local
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      CRS: ${{ matrix.crs }}
      MRTS: ${{ matrix.mrts }}
      RUNTIME_COMPONENT_TARGET: ${{ matrix.runtime_component_target }}
      CRS_RUNTIME_RUN_ID: crs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.connector }}
      PROFILE_RUN_ID: with-crs-no-mrts-${{ github.run_id }}-${{ github.run_attempt }}
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || inputs.parent_sha }}
      EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
      EVIDENCE_ROOT: ""
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout exact Parent head with pinned submodules
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.parent_sha }}
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-connectors-with-crs-no-mrts/connector-mode@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08
          caller-inputs: ${{ toJSON(inputs) }}
          caller-matrix: ${{ toJSON(matrix) }}
          checkout-outcome: ${{ steps.checkout.outcome }}
  aggregate-with-crs-no-mrts:
    permissions:
      contents: read
    name: Aggregate exact five with-CRS / no MRTS cells
    needs: connector-mode
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact Parent head with pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.parent_sha }}
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-connectors-with-crs-no-mrts/aggregate-with-crs-no-mrts@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08
          caller-inputs: ${{ toJSON(inputs) }}

name: Security workflow lint

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  apr-util-provenance:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Install reviewed hash-bound CI dependencies
        run: python3 ci/tools/install-ci-dependencies.py --ci-toolcache
      - name: Verify current Framework-owned APR-util provenance and Parent source policy
        run: |
          sh ci/tools/print-framework-apr-util-env.sh "$PWD/modules/ModSecurity-test-Framework" "$PWD" >/dev/null
          python3 ci/tools/run-active-tests.py --group apr-provenance --group supply-chain
      - name: Validate the four inventoried runtime path policies
        run: python3 ci/tools/run-active-tests.py --group runtime-path-policy

  actionlint:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Install pinned CI test dependencies
        run: |
          python3 ci/tools/install-ci-dependencies.py --ci-toolcache
      - name: Fetch checksum-verified actionlint
        run: python3 ci/tools/fetch_security_tool.py --tool actionlint --destination "$RUNNER_TEMP/security-tools"
      - name: Lint workflows with ShellCheck when present
        run: |
          set -eu
          python3 ci/tools/lint_workflows.py
      - name: Validate CI-security workflow contracts
        run:  python3 ci/tools/run-active-tests.py --group supply-chain

  zizmor:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Fetch checksum-verified zizmor
        run: python3 ci/tools/fetch_security_tool.py --tool zizmor --destination "$RUNNER_TEMP/security-tools"
      - name: Analyze workflows offline
        run: |
          "$RUNNER_TEMP/security-tools/zizmor" --offline .github/workflows
      - name: Execute all four inventoried scanner fixture controls
        run: python3 ci/tools/run-active-tests.py --group workflow-fixtures

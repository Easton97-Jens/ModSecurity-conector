name: PR380 source snapshot

on:
  push:
    branches: [fix/nginx-phase4-default-ci]
    paths: [.github/workflows/pr380-source-snapshot.yml]

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/pr380-source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr380-tracked-source
          path: ${{ runner.temp }}/pr380-source.tar
          retention-days: 1
          if-no-files-found: error

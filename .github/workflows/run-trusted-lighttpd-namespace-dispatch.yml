name: Trusted Lighttpd Namespace Dispatch

on:
  workflow_dispatch:
    inputs:
      target:
        description: Open canonical PR number or its full lowercase 40-character head SHA.
        required: true
        type: string
      on_demand:
        description: Explicitly execute the archived namespace specialist tests outside the automatic active inventory.
        required: true
        type: boolean
        default: false

permissions: {}

jobs:
  framework:
    permissions:
      contents: read
      statuses: write
    uses: Easton97-Jens/ModSecurity-test-Framework/.github/workflows/connector-trusted-lighttpd-namespace.yml@fa444236fa3b00c91ba94de49f69f52101087087
    with:
      target: ${{ inputs.target }}
      on_demand: ${{ inputs.on_demand }}

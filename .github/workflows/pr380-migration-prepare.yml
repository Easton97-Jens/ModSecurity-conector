name: PR380 normal source staging

on:
  push:
    branches: [fix/nginx-phase4-default-ci]
    paths: [.github/workflows/pr380-migration-prepare.yml]

permissions:
  contents: read

jobs:
  stage-source:
    if: github.repository == 'Easton97-Jens/ModSecurity-conector' && github.ref == 'refs/heads/fix/nginx-phase4-default-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr380-prepared-review
          run-id: 35534376125
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr380-reviewed-files
      - name: Store verified ordinary files without updating branches or workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import urllib.error
          import urllib.request

          root = Path(os.environ['RUNNER_TEMP']) / 'pr380-reviewed-files'
          raw = (root / 'changes.json').read_bytes()
          if hashlib.sha256(raw).hexdigest() != '9bc77bdf8c0d44ca36f6fee81e26890a3101fe45f0040c74ac8ae17ee7223cdb':
              raise ValueError('reviewed file manifest checksum mismatch')
          data = json.loads(raw)
          expected = 'b4ec7b5bb4a12864ce9593af174ee16d062958c1'
          if data['base_sha'] != expected:
              raise ValueError('unexpected verified base')
          workflow_paths = {
              '.github/workflows/lint.yml',
              '.github/workflows/quick-framework-check.yml',
              '.github/workflows/test-apache.yml',
              '.github/workflows/test-common.yml',
              '.github/workflows/test-nginx.yml',
              '.github/workflows/pr380-source-snapshot.yml',
              '.github/workflows/pr380-migration-prepare.yml',
          }
          entries = []
          seen = set()
          skipped = set()
          for entry in data['tree']:
              name = entry['path']
              path = PurePosixPath(name)
              if name in seen or path.is_absolute() or '..' in path.parts or '.git' in path.parts or name.startswith('modules/'):
                  raise ValueError('unexpected source path')
              seen.add(name)
              if entry['type'] != 'blob' or entry['mode'] not in ('100644', '100755'):
                  raise ValueError('unexpected file kind')
              if name in workflow_paths:
                  skipped.add(name)
                  continue
              if name.startswith('.github/'):
                  raise ValueError('workflow writes are not permitted in this job')
              if 'content' in entry:
                  if not isinstance(entry['content'], str) or 'sha' in entry:
                      raise ValueError('invalid ordinary file contents')
              elif entry.get('sha', 'missing') is not None:
                  raise ValueError('invalid file deletion')
              entries.append(entry)
          if skipped != workflow_paths or len(entries) != 92 or len(seen) != 99:
              raise ValueError('reviewed file inventory mismatch')
          api = 'https://api.github.com/repos/Easton97-Jens/ModSecurity-conector/'
          def request(path, payload=None):
              encoded = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=encoded, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print('Git object operation failed:', error.code)
                  print(error.read().decode('utf-8', errors='replace')[:2000])
                  raise
          parent = request('git/commits/' + expected)
          tree = request('git/trees', {'base_tree': parent['tree']['sha'], 'tree': entries})
          result = {
              'base_sha': expected,
              'source_tree_sha': tree['sha'],
              'manifest_sha256': hashlib.sha256(raw).hexdigest(),
              'ordinary_entries': len(entries),
              'deferred_workflow_paths': sorted(skipped),
          }
          (root / 'normal-source-tree.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr380-normal-source-tree
          path: ${{ runner.temp }}/pr380-reviewed-files/normal-source-tree.json
          retention-days: 3
          if-no-files-found: error

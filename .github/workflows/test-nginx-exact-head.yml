name: test-nginx-exact-head-hosted

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MODSECURITY_REPO_URL: https://github.com/owasp-modsecurity/ModSecurity.git
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      RUNTIME_COMPONENT_TARGET: nginx
      BUILD_NGINX_FROM_SOURCE: "1"
      NGINX_SOURCE_MODE: github-release
      NGINX_SOURCE_REPO_URL: https://github.com/nginx/nginx
      NGINX_RELEASE_TAG: release-1.31.4
      NGINX_SOURCE_GIT_REF: release-1.31.4
      NGINX_RELEASE_ASSET_NAME: nginx-1.31.4.tar.gz
      NGINX_SHA256: e6f20b644a17a643f059ae6467a1971fe2811587d025e071068753a1f1e3b3c3
      NGINX_REQUIRE_PINNED_PROVENANCE: "1"
      SMOKE_PREPARE_TIMEOUT_SECONDS: "3600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify exact PR head
        run: |
          set -eu
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_PARENT_SHA" || {
            echo "exact-head gate: expected $EXPECTED_PARENT_SHA, observed $actual" >&2
            exit 1
          }
      - name: Initialize isolated exact-head paths
        run: |
          set -eu
          root="$RUNNER_TEMP/ModSecurity-conector-nginx-exact-head"
          {
            echo "VERIFIED_RUN_ROOT=$root"
            echo "BUILD_ROOT=$root/build"
            echo "TMP_ROOT=$root/tmp"
            echo "LOG_ROOT=$root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$root/component-cache"
            echo "RUNTIME_REPORT_OUTPUT_ROOT=$root/runtime-component-reports"
            echo "SOURCE_ROOT=$root/src"
            echo "MODSECURITY_SOURCE_DIR=$root/src/ModSecurity_V3"
            echo "MODSECURITY_V3_SOURCE_DIR=$root/src/ModSecurity_V3"
          } >> "$GITHUB_ENV"
      - name: Provision pinned NGINX and connector runtime
        run: |
          set -eu
          make setup-dev
          env \
            -u MRTS_NATIVE_NGINX_BIN \
            -u MRTS_NATIVE_NGINX_MODULE_DIR \
            -u MRTS_NATIVE_NGINX_MODULE_FILE \
            -u MRTS_NATIVE_NGINX_MODSECURITY_LIB_DIR \
            -u NGINX_MRTS_MODSECURITY_LIB_DIR \
            -u NGINX_BINARY \
            -u NGINX_MODULE \
            -u NGINX_PREFIX \
            -u NGINX_BUILD_DIR \
            make fetch-deps
      - name: Print bounded NGINX provisioning failure diagnostics
        if: failure()
        run: |
          set -eu
          report="$RUNTIME_REPORT_OUTPUT_ROOT/reports/testing/generated/cache/runtime-component-cache.generated.json"
          if [ ! -f "$report" ]; then
            echo "nginx exact-head diagnostics: no runtime-component report was written" >&2
            exit 0
          fi
          python3 - "$VERIFIED_RUN_ROOT" "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          run_root = Path(sys.argv[1]).resolve()
          report_path = Path(sys.argv[2]).resolve()
          nginx = json.loads(report_path.read_text(encoding="utf-8")).get("nginx", {})
          if not isinstance(nginx, dict):
              raise SystemExit("nginx exact-head diagnostics: malformed nginx component record")
          for key in ("status", "blocker_reason", "build_exit_code", "missing_files", "build_log"):
              print(f"nginx exact-head diagnostics: {key}={nginx.get(key)!r}")
          raw_log = nginx.get("build_log")
          if not isinstance(raw_log, str) or not raw_log:
              raise SystemExit(0)
          log_path = Path(raw_log).resolve()
          try:
              log_path.relative_to(run_root)
          except ValueError:
              raise SystemExit("nginx exact-head diagnostics: refusing log outside isolated run root")
          if log_path.is_symlink() or not log_path.is_file():
              raise SystemExit("nginx exact-head diagnostics: bounded build log is unavailable")
          lines = log_path.read_text(encoding="utf-8", errors="replace").splitlines()
          print("nginx exact-head diagnostics: begin bounded nginx-build.log tail")
          print("\n".join(lines[-160:]))
          print("nginx exact-head diagnostics: end bounded nginx-build.log tail")
          PY
      - name: Run isolated modsecurity_use_error_log on/off cells
        run: |
          set -eu
          env \
            -u MRTS_NATIVE_NGINX_BIN \
            -u MRTS_NATIVE_NGINX_MODULE_DIR \
            -u MRTS_NATIVE_NGINX_MODULE_FILE \
            -u MRTS_NATIVE_NGINX_MODSECURITY_LIB_DIR \
            -u NGINX_MRTS_MODSECURITY_LIB_DIR \
            -u NGINX_BINARY \
            -u NGINX_MODULE \
            -u NGINX_PREFIX \
            -u NGINX_BUILD_DIR \
            RUNTIME_COMPONENT_TARGET=nginx \
            FRAMEWORK_ROOT="$GITHUB_WORKSPACE/modules/ModSecurity-test-Framework" \
            CONNECTOR_ROOT="$GITHUB_WORKSPACE" \
            sh ci/provisioning/cache/with-runtime-components.sh \
            sh connectors/nginx/harness/run_exact_head_use_error_log.sh

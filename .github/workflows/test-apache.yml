name: test-apache

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  apache-autotools-bootstrap:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-apache/apache-autotools-bootstrap@0ca218773b11bbd401478808b4e8a11af123df57
        with:
          framework-revision: 0ca218773b11bbd401478808b4e8a11af123df57
  apache-structure:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-apache/apache-structure@0ca218773b11bbd401478808b4e8a11af123df57
        with:
          framework-revision: 0ca218773b11bbd401478808b4e8a11af123df57

name: test-lighttpd

on:
  push:
  pull_request:

permissions: {}

jobs:
  lighttpd-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Check lighttpd Common and host contracts
        run: |
          set -eu
          make check-lighttpd-common-adoption
          make check-remaining-connectors-host-integration
          make check-remaining-connectors-build-wiring
          make check-remaining-connectors-start-wiring
          make check-remaining-connectors-claim-policy
          python3 ci/tools/run-active-tests.py --group lighttpd
      - name: Execute lighttpd technical-error callers and negative controls
        env:
          TMPDIR: ${{ runner.temp }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: make check-i10-lighttpd-callers
      - name: Run private fixture namespace contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          namespace_temp_root="$(/usr/bin/mktemp -d "${RUNNER_TEMP}/lighttpd-namespace-contract.XXXXXX")"
          /usr/bin/chmod 700 -- "$namespace_temp_root"
          export LIGHTTPD_NAMESPACE_TEST_TEMP_PARENT="$namespace_temp_root"
          python3 ci/tools/run-active-tests.py --group lighttpd

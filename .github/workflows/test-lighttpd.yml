name: test-lighttpd

on:
  push:
  pull_request:

permissions: {}

jobs:
  lighttpd-contract:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-lighttpd/lighttpd-contract@8ce35c1108d753986b11cb011d24fc99f262f112
        with:
          framework-revision: 8ce35c1108d753986b11cb011d24fc99f262f112

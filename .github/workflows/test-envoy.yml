name: test-envoy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  envoy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Check Envoy Common and host contracts
        run: |
          set -eu
          make check-envoy-common-adoption
          make check-remaining-connectors-host-integration
          make check-remaining-connectors-build-wiring
          make check-remaining-connectors-start-wiring
          make check-remaining-connectors-claim-policy
      - name: Set up repository-selected Go for the native bridge
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Install native bridge test prerequisites
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential libmodsecurity-dev
      - name: Compile and execute the real Common and CGo bridge tests
        env:
          GOTOOLCHAIN: local
          ENVOY_EXT_PROC_COMMON_TEST: "1"
          MODSECURITY_INCLUDE_DIR: /usr/include
          BUILD_ROOT: ${{ runner.temp }}/pr382-envoy-native-build
          GOCACHE: ${{ runner.temp }}/pr382-envoy-go-cache
          GOTMPDIR: ${{ runner.temp }}/pr382-envoy-go-tmp
        run: |
          set -eu
          mkdir -p "$GOTMPDIR"
          export MODSECURITY_LIB_FILE="/usr/lib/$(cc -print-multiarch)/libmodsecurity.so"
          test -f "$MODSECURITY_LIB_FILE"
          go version
          sh connectors/envoy/build/build_ext_proc.sh
      - name: Collect host runtime preflight evidence
        if: always()
        env:
          CONNECTOR: envoy
          RUNTIME_LOCK: modules/ModSecurity-test-Framework/ci/provisioning/runtime-component-lock.json
        run: |
          set -u
          python3 ci/runtime/common/collect_hostruntime_preflight_evidence.py \
            --connector "$CONNECTOR" \
            --runtime-lock "$RUNTIME_LOCK" \
            --runner-temp "$RUNNER_TEMP" \
            --binary-name envoy \
            --profile envoy-ext-authz \
            --config connectors/envoy/config/envoy-ext-authz.conf \
            --fixture connectors/envoy/config/envoy-ext-proc-service.json \
            --profile envoy-ext-proc \
            --config connectors/envoy/config/envoy-ext-authz.conf \
            --fixture connectors/envoy/config/envoy-ext-proc-service.json
      - name: Upload sanitized host runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-hostruntime-evidence
          path: ${{ runner.temp }}/hostruntime-evidence/envoy
          if-no-files-found: error

name: test-envoy

on:
  push:
  pull_request:

permissions: {}

jobs:
  envoy-contract:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-envoy/envoy-contract@c3f3aa4747315bdbfc7f6443edb47cef54a4e804
        with:
          framework-revision: c3f3aa4747315bdbfc7f6443edb47cef54a4e804

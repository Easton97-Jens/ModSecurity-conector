name: test-envoy

on:
  push:
  pull_request:

permissions: {}

jobs:
  envoy-contract:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Set up Go for response observer tests
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: connectors/envoy/ext_proc/go.mod
          check-latest: false
          cache: false
      - name: Test Envoy response observer
        working-directory: connectors/envoy/ext_proc
        env:
          GOTOOLCHAIN: local
          TMPDIR: /tmp
        run: |
          go test -mod=readonly -count=1 ./internal/responseobserver
          go test -mod=readonly -count=1 -run 'a^' ./cmd/msconnector-envoy-response-observer
      - name: Check Envoy Common and host contracts
        run: |
          set -eu
          make check-envoy-common-adoption
          make check-remaining-connectors-host-integration
          make check-remaining-connectors-build-wiring
          make check-remaining-connectors-start-wiring
          make check-remaining-connectors-claim-policy
      - name: Exercise private socket and transport regressions
        env:
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest -v tests.test_private_runtime_sockets tests.test_envoy_transport_hardening_contract
      - name: Collect host runtime preflight evidence
        if: always()
        env:
          CONNECTOR: envoy
          RUNTIME_LOCK: modules/ModSecurity-test-Framework/ci/provisioning/runtime-component-lock.json
        run: |
          set -u
          python3 ci/runtime/common/collect_hostruntime_preflight_evidence.py \
            --connector "$CONNECTOR" \
            --runtime-lock "$RUNTIME_LOCK" \
            --runner-temp "$RUNNER_TEMP" \
            --binary-name envoy \
            --profile envoy-ext-authz \
            --config connectors/envoy/config/envoy-ext-authz.conf \
            --fixture connectors/envoy/config/envoy-ext-proc-service.json \
            --profile envoy-ext-proc \
            --config connectors/envoy/config/envoy-ext-authz.conf \
            --fixture connectors/envoy/config/envoy-ext-proc-service.json
      - name: Upload sanitized host runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envoy-hostruntime-evidence
          path: ${{ runner.temp }}/hostruntime-evidence/envoy
          if-no-files-found: error

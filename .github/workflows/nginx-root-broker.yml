name: trusted NGINX root broker

on:
  workflow_call:
    inputs:
      caller_manifest_artifact:
        description: Exact artifact name containing caller-manifest.json.
        required: true
        type: string
      parent_head_sha:
        description: Exact unprivileged caller commit recorded as evidence only.
        required: true
        type: string
      framework_sha:
        description: Framework gitlink required by the protected broker build.
        required: true
        type: string
      protected_broker_sha:
        description: Immutable merge SHA that names this reusable workflow.
        required: true
        type: string
      matrix_variant:
        description: Closed smoke variant.
        required: true
        type: string
      run_id:
        description: Fresh opaque broker run identifier.
        required: true
        type: string

permissions:
  contents: read

jobs:
  trusted-root-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') &&
      github.repository == 'Easton97-Jens/ModSecurity-conector' &&
      github.event.repository.fork == false
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BROKER_SHA: ${{ inputs.protected_broker_sha }}
      BROKER_RUN_ID: ${{ inputs.run_id }}
      BROKER_VARIANT: ${{ inputs.matrix_variant }}
      EXPECTED_PARENT_HEAD: ${{ inputs.parent_head_sha }}
      EXPECTED_FRAMEWORK_SHA: ${{ inputs.framework_sha }}
      BUILD_NGINX_FROM_SOURCE: "1"
      NGINX_SOURCE_MODE: github-release
      NGINX_SOURCE_REPO_URL: https://github.com/nginx/nginx
      NGINX_RELEASE_TAG: release-1.31.3
      NGINX_SOURCE_GIT_REF: release-1.31.3
      NGINX_RELEASE_ASSET_NAME: nginx-1.31.3.tar.gz
      NGINX_SHA256: a7657c50811c2d92d9895395e8b873ef60398142c4db21eb647811c38f6dd525
      NGINX_REQUIRE_PINNED_PROVENANCE: "1"
    steps:
      - name: Verify immutable reusable-workflow binding
        env:
          EXPECTED_WORKFLOW_REF: Easton97-Jens/ModSecurity-conector/.github/workflows/nginx-root-broker.yml@${{ inputs.protected_broker_sha }}
          ACTUAL_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          test "$ACTUAL_WORKFLOW_REF" = "$EXPECTED_WORKFLOW_REF"
          if [ "${#BROKER_SHA}" -ne 40 ]; then
            echo "BLOCKED: protected broker SHA must be exactly 40 lowercase hex characters" >&2
            exit 77
          fi
          case "$BROKER_SHA" in *[!0-9a-f]*) echo "BLOCKED: protected broker SHA must be lowercase hex" >&2; exit 77;; esac
          case "$BROKER_RUN_ID" in
            ''|*[!A-Za-z0-9._-]*)
              echo "BLOCKED: broker run identifier is unsafe" >&2
              exit 77
              ;;
          esac
          if [ "${#BROKER_RUN_ID}" -gt 128 ]; then
            echo "BLOCKED: broker run identifier is too long" >&2
            exit 77
          fi
          case "$BROKER_VARIANT" in no-crs|with-crs) ;; *) echo "BLOCKED: unknown matrix variant" >&2; exit 77;; esac

      - name: Check out immutable protected broker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Easton97-Jens/ModSecurity-conector
          ref: ${{ inputs.protected_broker_sha }}
          path: broker-src
          submodules: recursive
          persist-credentials: false
          clean: true

      - name: Verify protected source and dependency identity
        working-directory: broker-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BROKER_SHA"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$BROKER_SHA" FETCH_HEAD
          framework_head=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          test "$framework_head" = "$EXPECTED_FRAMEWORK_SHA"
          test -z "$(git -C modules/ModSecurity-test-Framework status --porcelain)"

      - name: Set up protected broker Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: broker-src/.python-version
          check-latest: false

      - name: Download declarative caller manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.caller_manifest_artifact }}
          path: ${{ runner.temp }}/trusted-nginx-broker-caller-${{ inputs.run_id }}

      - name: Build only trusted protected-source artifacts without root
        working-directory: broker-src
        env:
          VERIFIED_RUN_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/verified
          BUILD_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/build
          SOURCE_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/sources
          TMP_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/tmp
          LOG_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/logs
          CONNECTOR_COMPONENT_CACHE: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/component-cache
          RUNTIME_REPORT_OUTPUT_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/build/runtime-component-reports
          RUNTIME_COMPONENT_TARGET: nginx
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$VERIFIED_RUN_ROOT" "$BUILD_ROOT" "$SOURCE_ROOT" "$TMP_ROOT" "$LOG_ROOT" "$CONNECTOR_COMPONENT_CACHE" "$RUNTIME_REPORT_OUTPUT_ROOT"
          chmod 700 "$VERIFIED_RUN_ROOT" "$BUILD_ROOT" "$SOURCE_ROOT" "$TMP_ROOT" "$LOG_ROOT" "$CONNECTOR_COMPONENT_CACHE" "$RUNTIME_REPORT_OUTPUT_ROOT"
          make setup-dev
          make fetch-deps

      - name: Build a protected immutable OWASP CRS bundle without root
        working-directory: broker-src
        env:
          TRUSTED_BUILD_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}
          VERIFIED_RUN_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/verified
          BUILD_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/build
          SOURCE_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/sources
          TMP_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/tmp
          LOG_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/logs
          CONNECTOR_COMPONENT_CACHE: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}/component-cache
        run: |
          set -euo pipefail
          case "$BROKER_VARIANT" in
            no-crs)
              exit 0
              ;;
            with-crs)
              ;;
            *)
              echo "BLOCKED: unknown protected broker matrix variant" >&2
              exit 77
              ;;
          esac
          umask 077
          export CONNECTOR_ROOT="$PWD" REPO_ROOT="$PWD"
          . modules/ModSecurity-test-Framework/ci/lib/common.sh
          . ci/runtime/lifecycle/prepare-fresh-crs-source.sh
          sh modules/ModSecurity-test-Framework/ci/provisioning/fetch-crs.sh
          .venv/bin/python ci/runtime/broker/nginx_root_broker.py prepare-crs-bundle \
            --trusted-build-root "$TRUSTED_BUILD_ROOT" \
            --framework-root "$PWD/modules/ModSecurity-test-Framework" \
            --framework-sha "$EXPECTED_FRAMEWORK_SHA" \
            --broker-sha "$BROKER_SHA"

      - name: Produce a non-executable trusted candidate manifest
        working-directory: broker-src
        env:
          TRUSTED_BUILD_ROOT: ${{ runner.temp }}/trusted-nginx-broker-build-${{ inputs.run_id }}
          CALLER_ROOT: ${{ runner.temp }}/trusted-nginx-broker-caller-${{ inputs.run_id }}
        run: |
          set -euo pipefail
          test -f "$CALLER_ROOT/caller-manifest.json"
          .venv/bin/python ci/runtime/broker/nginx_root_broker.py prepare-from-snapshot \
            --caller-manifest "$CALLER_ROOT/caller-manifest.json" \
            --trusted-build-root "$TRUSTED_BUILD_ROOT" \
            --broker-sha "$BROKER_SHA" \
            --expected-parent-head "$EXPECTED_PARENT_HEAD" \
            --expected-framework-sha "$EXPECTED_FRAMEWORK_SHA" \
            --expected-run-id "$BROKER_RUN_ID" \
            --expected-matrix-variant "$BROKER_VARIANT" \
            --nginx-version 1.31.3 \
            --worker-user www-data \
            --loopback 127.0.0.1 \
            --port 18443 > "$RUNNER_TEMP/trusted-nginx-broker-candidate-path"

      - name: Admit only verified artifacts into the root-owned broker root
        working-directory: broker-src
        run: |
          set -euo pipefail
          verify_broker_source() {
            expected=$(git rev-parse "$BROKER_SHA:ci/runtime/broker/nginx_root_broker.py")
            actual=$(git hash-object ci/runtime/broker/nginx_root_broker.py)
            test "$actual" = "$expected"
          }
          candidate=$(cat "$RUNNER_TEMP/trusted-nginx-broker-candidate-path")
          verify_broker_source
          manifest=$(sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action \
            --action validate-manifest \
            --broker-sha "$BROKER_SHA" \
            --candidate "$candidate")
          test -n "$manifest"
          printf '%s\n' "$manifest" > "$RUNNER_TEMP/trusted-nginx-broker-manifest-path"
          echo "BROKER_MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "BROKER_PROJECTION=$(dirname "$(dirname "$manifest")")/evidence-published" >> "$GITHUB_ENV"

      - name: Run fixed root-only NGINX actions
        working-directory: broker-src
        run: |
          set -euo pipefail
          verify_broker_source() {
            expected=$(git rev-parse "$BROKER_SHA:ci/runtime/broker/nginx_root_broker.py")
            actual=$(git hash-object ci/runtime/broker/nginx_root_broker.py)
            test "$actual" = "$expected"
          }
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action config-test --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action start --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action verify-runtime-profile --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action verify-master-worker-identity --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action stop --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          verify_broker_source
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action project-evidence --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"

      - name: Stage the fixed root-to-user evidence outside the cleanup root
        if: ${{ always() && env.BROKER_PROJECTION != '' }}
        run: |
          set -euo pipefail
          source="$BROKER_PROJECTION"
          target="$RUNNER_TEMP/trusted-nginx-broker-evidence-$BROKER_RUN_ID"
          test -d "$source"
          test ! -e "$target"
          test ! -L "$target"
          umask 077
          mkdir "$target"
          chmod 700 "$target"
          copy_fixed_evidence() {
            name="$1"
            test -f "$source/$name"
            test ! -L "$source/$name"
            cp -- "$source/$name" "$target/$name"
            chmod 600 "$target/$name"
          }
          copy_fixed_evidence identity.json
          copy_fixed_evidence runtime.json
          copy_fixed_evidence nginx-access.log
          copy_fixed_evidence nginx-error.log
          if [ -f "$source/policy.json" ]; then
            test ! -L "$source/policy.json"
            cp -- "$source/policy.json" "$target/policy.json"
            chmod 600 "$target/policy.json"
          fi
          case "$BROKER_VARIANT" in
            with-crs)
              copy_fixed_evidence nginx-audit.log
              ;;
            no-crs)
              test ! -e "$source/nginx-audit.log"
              ;;
            *)
              echo "BLOCKED: unknown protected broker matrix variant" >&2
              exit 77
              ;;
          esac
          echo "BROKER_ARTIFACT_EVIDENCE=$target" >> "$GITHUB_ENV"

      - name: Stop and verify root cleanup
        if: ${{ always() && env.BROKER_MANIFEST != '' }}
        working-directory: broker-src
        run: |
          set -euo pipefail
          verify_broker_source() {
            expected=$(git rev-parse "$BROKER_SHA:ci/runtime/broker/nginx_root_broker.py")
            actual=$(git hash-object ci/runtime/broker/nginx_root_broker.py)
            test "$actual" = "$expected"
          }
          verify_broker_source
          evidence_root="${BROKER_ARTIFACT_EVIDENCE:-$RUNNER_TEMP/trusted-nginx-broker-evidence-$BROKER_RUN_ID}"
          if [ ! -d "$evidence_root" ]; then
            test ! -e "$evidence_root"
            test ! -L "$evidence_root"
            umask 077
            mkdir "$evidence_root"
            chmod 700 "$evidence_root"
          fi
          set +e
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action stop --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          stop_code=$?
          set -e
          verify_broker_source
          set +e
          sudo -- /usr/bin/python3 -I ci/runtime/broker/nginx_root_broker.py action --action cleanup-status --broker-sha "$BROKER_SHA" --manifest "$BROKER_MANIFEST"
          cleanup_code=$?
          set -e
          case "$stop_code:$cleanup_code" in
            0:0) cleanup_status=PASS ;;
            *) cleanup_status=FAIL ;;
          esac
          printf '{"broker_sha":"%s","cleanup_status":"%s","matrix_variant":"%s","run_id":"%s"}\n' \
            "$BROKER_SHA" "$cleanup_status" "$BROKER_VARIANT" "$BROKER_RUN_ID" > "$evidence_root/cleanup.json"
          chmod 600 "$evidence_root/cleanup.json"
          echo "BROKER_ARTIFACT_EVIDENCE=$evidence_root" >> "$GITHUB_ENV"
          if [ "$stop_code" -ne 0 ]; then
            exit "$stop_code"
          fi
          exit "$cleanup_code"

      - name: Upload bounded root-to-user evidence
        if: ${{ always() && env.BROKER_ARTIFACT_EVIDENCE != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-nginx-root-broker-${{ inputs.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ env.BROKER_ARTIFACT_EVIDENCE }}

name: Selected coverage and Sonar analysis

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
    outputs:
      verified:
        description: Reports passed full source, inventory and SDK/build verification
        value: ${{ jobs.selected-coverage.outputs.verified }}
      head:
        description: Exact verified source revision
        value: ${{ jobs.selected-coverage.outputs.head }}
      artifact_id:
        description: Immutable same-run verified coverage artifact ID
        value: ${{ jobs.selected-coverage.outputs.artifact_id }}
      artifact_name:
        description: Same-run verified coverage artifact name
        value: ${{ jobs.selected-coverage.outputs.artifact_name }}

permissions: {}

jobs:
  selected-coverage:
    if: >-
      github.repository == 'Easton97-Jens/ModSecurity-conector' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      verified: ${{ steps.attest.outputs.verified }}
      head: ${{ steps.attest.outputs.head }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
      artifact_name: parent-selected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      CGO_ENABLED: '0'
      PYTHONNOUSERSITE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact analyzed source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - name: Set up canonical Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Validate the configured analysis credential at the fixed Sonar origin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          class RejectRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError("Sonar credential validation must not redirect")

          token = os.environ.get("SONAR_TOKEN", "")
          if not token:
              raise SystemExit("Configured repository Sonar analysis credential is unavailable")
          request = urllib.request.Request("https://sonarcloud.io/api/authentication/validate",
                                           headers={"Authorization": "Bearer " + token})
          try:
              opener = urllib.request.build_opener(RejectRedirect())
              with opener.open(request, timeout=30) as response:
                  value = json.loads(response.read(4096))
          except (OSError, ValueError, RuntimeError):
              raise SystemExit("Configured Sonar credential could not be validated at its fixed origin")
          if value.get("valid") is not True:
              raise SystemExit("Configured repository analysis credential is not valid for Sonar")
          print("SONAR_ANALYSIS_CREDENTIAL_VALID")
          PY
      - name: Set up canonical Go without cache reuse
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Admit the entire expanded active inventory
        run: |
          python3 ci/tools/run-active-tests.py --check --group coverage
          python3 ci/tools/sync-sonar-test-scope.py --check
          python3 ci/checks/analysis/check-sonar-scope.py
      - name: Check admitted offline timing bounds without coverage overhead
        run: |
          python3 ci/tools/run-active-tests.py --group offline-timing \
            --strict-skips --output-root "$RUNNER_TEMP"
      - name: Install the reviewed hash-bound CI dependency
        run: python3 ci/tools/install-ci-dependencies.py --ci-toolcache
      - name: Install the actual native coverage and ModSecurity development prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential apache2-dev libmodsecurity-dev autoconf automake libtool pkg-config bison flex libpcre2-dev libyajl-dev libxml2-dev libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Build the Framework-approved shared ModSecurity SDK
        env:
          PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          from ci.lib.active_coverage import external_root
          external_root(Path(sys.argv[1]))
          PY
          umask 077
          sdk_root=$(mktemp -d "$RUNNER_TEMP/selected-modsecurity-sdk.XXXXXXXX")
          env \
            VERIFIED_RUN_ROOT="$sdk_root" \
            BUILD_ROOT="$sdk_root/build" \
            SOURCE_ROOT="$sdk_root/src" \
            TMP_ROOT="$sdk_root/tmp" \
            LOG_ROOT="$sdk_root/logs" \
            CACHE_ROOT="$sdk_root/cache-v2" \
            CONNECTOR_COMPONENT_CACHE="$sdk_root/cache-v2/shared" \
            RUNTIME_REPORT_OUTPUT_ROOT="$sdk_root/build/runtime-component-reports" \
            RUNTIME_COMPONENT_TARGET=shared \
            ALLOW_RUNTIME_DOWNLOADS=1 ALLOW_RUNTIME_BUILDS=1 \
            /bin/sh ci/provisioning/cache/with-runtime-components.sh \
            /bin/sh -eu -s <<'SDK_EXPORT'
              test -f "$MODSECURITY_INCLUDE_DIR/modsecurity/modsecurity.h"
              test -f "$MODSECURITY_LIB_DIR/libmodsecurity.so"
              printf "%s\n" \
                "MODSECURITY_INCLUDE_DIR=$MODSECURITY_INCLUDE_DIR" \
                "MODSECURITY_LIB_DIR=$MODSECURITY_LIB_DIR" \
                "MODSECURITY_LIB_FILE=$MODSECURITY_LIB_DIR/libmodsecurity.so" >> "$GITHUB_ENV"
          SDK_EXPORT
      - name: Collect actual coverage during admitted selected tests
        id: coverage
        env:
          TMPDIR: ${{ runner.temp }}
          RUNNER_TEMP: ${{ runner.temp }}
          GOCACHE: ${{ runner.temp }}/go-cache
          GOMODCACHE: ${{ runner.temp }}/go-modules
        run: |
          set -euo pipefail
          command -v cc >/dev/null
          command -v gcov >/dev/null
          umask 077
          mkdir "$RUNNER_TEMP/parent-coverage"
          python3 ci/tools/collect-active-coverage.py run \
            --strict-skips --output-root "$RUNNER_TEMP/parent-coverage"
      - name: Verify report, source, inventory and build identity before import
        run: python3 ci/tools/collect-active-coverage.py verify --output-root "$RUNNER_TEMP/parent-coverage"
      - name: Retain fully verified line observations and revision-bound report manifest
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parent-selected-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 10
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/parent-coverage/coverage.xml
            ${{ runner.temp }}/parent-coverage/collector-python.json
            ${{ runner.temp }}/parent-coverage/manifest.json
            ${{ runner.temp }}/parent-coverage/**/go.out
            ${{ runner.temp }}/parent-coverage/**/python.json
            ${{ runner.temp }}/parent-coverage/**/python-subprocess/*.json
            ${{ runner.temp }}/parent-coverage/**/*.gcov.json.gz
      - name: Attest that this exact artifact passed full producer verification
        id: attest
        env:
          ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "verified=true" >> "$GITHUB_OUTPUT"
          echo "head=$ANALYZED_SHA" >> "$GITHUB_OUTPUT"
      - name: Analyze the current source as required C++17 and import its actual coverage
        id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_USER_HOME: ${{ runner.temp }}/sonar-cache
        with:
          scannerVersion: 8.1.0.6389
          skipSignatureVerification: 'false'
          args: >-
            -Dsonar.projectKey=Easton97-Jens_ModSecurity-conector
            -Dsonar.cfamily.reportingCppStandardOverride=c++17
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.coverageReportPaths=${{ steps.coverage.outputs.generic_report }}
            -Dsonar.go.coverage.reportPaths=${{ steps.coverage.outputs.go_reports }}
            -Dsonar.working.directory=${{ runner.temp }}/sonar-work
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Report required analysis outcome
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "### Full Parent Sonar C++17 (required) / C++17 (verpflichtend)"
            echo "Revision: $ANALYZED_SHA"
            echo "Scanner and gate / Scanner und Gate: $SCAN_OUTCOME"
            if test -f "$RUNNER_TEMP/sonar-work/report-task.txt"; then
              sed -n '/^\(ceTaskId\|dashboardUrl\|projectKey\)=/p' "$RUNNER_TEMP/sonar-work/report-task.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  scaffold-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Initialize runner temp paths
        run: |
          set -eu
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "BUILD_ROOT=$verified_root/build"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
          } >> "$GITHUB_ENV"
      - name: Check common boundary and docs
        run: |
          set -eu
          if grep -RInE 'apache|nginx|haproxy|envoy|lighttpd|traefik' common/include common/src; then
            echo "common/include and common/src must remain connector-neutral"
            exit 1
          fi
          test -f README.md
          test -f docs/architecture.md
          test -f modules/ModSecurity-test-Framework/docs/connector-integration.md
          test -f modules/ModSecurity-test-Framework/docs/testing-and-evidence.md
          test -f docs/operations-and-security.md
          test -f docs/README.md
          test -f docs/connectors/README.md
          test -f docs/testing-and-evidence.md
          test -f reports/testing/test-coverage-overview.md
      - name: Check bilingual documentation
        run: python ci/checks/documentation/check-bilingual-docs.py
      - name: Verify native results and common event protocol
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_native_result_event_protocol tests.test_native_error_classification tests.test_event_transport_observation tests.test_sonar_zero_gate tests.test_sonar_duplication_gate tests.test_pr382_decision_safety tests.test_pr382_profile_errors
      - name: Verify runtime event sink failures
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_runtime_event_sink_failures tests.test_runtime_host_action_validation
      - name: Verify immutable I12 oracles and physical lifecycle ledgers
        if: ${{ !cancelled() }}
        run: |
          python -m unittest -v tests.test_i12_oracle_reconciliation tests.test_i12_lifecycle_ledger tests.test_i12_current_report
          I12_TEST_ROOT="$RUNNER_TEMP" python -m unittest discover -s ci/runtime/lifecycle/i12 -p test_capture_sources.py -v
      - name: Install I09 Apache compiled-test prerequisites
        if: ${{ !cancelled() }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes apache2-dev build-essential libmodsecurity-dev autoconf automake libtool pkg-config libyajl-dev libcurl4-openssl-dev libpcre2-dev libssl-dev liblmdb-dev
      - name: Prepare the approved I12 SDK through the shared component producer
        if: ${{ !cancelled() }}
        env:
          RUNTIME_COMPONENT_TARGET: shared
          ALLOW_RUNTIME_DOWNLOADS: "1"
          ALLOW_RUNTIME_BUILDS: "1"
        run: |
          set -eu
          mkdir -p "$BUILD_ROOT/i12-sdk-reports"
          RUNTIME_COMPONENT_ENV_SNAPSHOT=$(sh ci/runtime/lifecycle/reserve-runtime-env-snapshot.sh "$BUILD_ROOT/i12-sdk-reports")
          export RUNTIME_COMPONENT_ENV_SNAPSHOT
          RUNTIME_REPORT_OUTPUT_ROOT="$BUILD_ROOT/i12-sdk-reports" make prepare-runtime-components
          printf 'I12_SDK_ENV_SNAPSHOT=%s\n' "$RUNTIME_COMPONENT_ENV_SNAPSHOT" >> "$GITHUB_ENV"
      - name: Verify I12 native observer and Apache header measurement controls
        if: ${{ !cancelled() }}
        run: |
          set -eu
          test -f "$I12_SDK_ENV_SNAPSHOT"
          export NATIVE_OBSERVER_TEST_OUT="$BUILD_ROOT/i12-observer-controls"
          RUNTIME_COMPONENT_ENV_SNAPSHOT="$I12_SDK_ENV_SNAPSHOT" \
            RUNTIME_REPORT_OUTPUT_ROOT="$BUILD_ROOT/i12-sdk-reports" \
            RUNTIME_COMPONENT_TARGET=shared SKIP_RUNTIME_COMPONENT_PREPARE=1 \
            sh ci/provisioning/cache/with-runtime-components.sh \
              python -m unittest -v tests.test_native_lifecycle_observer tests.test_apache_header_semantics
      - name: Verify I09 route API and terminal error regressions
        if: ${{ !cancelled() }}
        run: make check-i09-native-routes
      - name: Verify Envoy bridge failure boundaries
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_envoy_bridge_failures
      - name: Verify NGINX connection and URI completion
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_nginx_request_phase_completion
      - name: Verify NGINX request native result regressions
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_nginx_request_native_results tests.test_nginx_request_error_events tests.test_nginx_request_mapper_status tests.test_nginx_context_accounting tests.test_nginx_native_intervention_chain tests.test_nginx_native_logging tests.test_nginx_bounded_event_uri
      - name: Verify NGINX late error and reentry regressions
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_nginx_late_error_results
      - name: Verify Phase-4 migration and NGINX security contracts
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_phase4_migration_contract tests.test_nginx_native_security_contract tests.test_nginx_upstream_security_contract
      - name: Verify NGINX adoption checker mutations
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_nginx_common_adoption
      - name: Verify HAProxy Rule-ID adoption mutations
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_haproxy_adoption_rule_id
      - name: Verify configuration reference generator regressions
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_connector_config_reference tests.test_logical_connector_all_examples
      - name: Verify generated configuration references
        if: ${{ !cancelled() }}
        run: python ci/tools/generate-connector-config-reference.py --check
      - name: Verify configuration reference semantics
        if: ${{ !cancelled() }}
        run: python ci/checks/documentation/check-connector-config-reference.py
      - name: Require zero new Sonar findings for the PR head
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          SONAR_CHECK_GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python ci/checks/common/check-sonar-zero.py
      - name: Require zero Sonar duplication for the PR head
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          SONAR_CHECK_GITHUB_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python ci/checks/common/check-sonar-duplication.py
      - name: Run lightweight lint
        run: |
          make setup-dev
          make lint

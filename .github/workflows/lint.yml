name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  scaffold-lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Initialize runner temp paths
        run: |
          set -eu
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "BUILD_ROOT=$verified_root/build"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
          } >> "$GITHUB_ENV"
      - name: Check common boundary and docs
        run: |
          set -eu
          if grep -RInE 'apache|nginx|haproxy|envoy|lighttpd|traefik' common/include common/src; then
            echo "common/include and common/src must remain connector-neutral"
            exit 1
          fi
          test -f README.md
          test -f docs/architecture.md
          test -f modules/ModSecurity-test-Framework/docs/connector-integration.md
          test -f modules/ModSecurity-test-Framework/docs/testing-and-evidence.md
          test -f docs/operations-and-security.md
          test -f docs/README.md
          test -f docs/connectors/README.md
          test -f docs/testing-and-evidence.md
          test -f reports/testing/test-coverage-overview.md
      - name: Check bilingual documentation
        run: python ci/checks/documentation/check-bilingual-docs.py
      - name: Verify Phase-4 migration and NGINX security contracts
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_phase4_migration_contract tests.test_nginx_native_security_contract tests.test_nginx_upstream_security_contract
      - name: Verify NGINX adoption checker mutations
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_nginx_common_adoption
      - name: Verify configuration reference generator regressions
        if: ${{ !cancelled() }}
        run: python -m unittest -v tests.test_connector_config_reference tests.test_logical_connector_all_examples
      - name: Verify generated configuration references
        if: ${{ !cancelled() }}
        run: python ci/tools/generate-connector-config-reference.py --check
      - name: Verify configuration reference semantics
        if: ${{ !cancelled() }}
        run: python ci/checks/documentation/check-connector-config-reference.py
      - name: Run lightweight lint
        run: |
          make setup-dev
          make lint

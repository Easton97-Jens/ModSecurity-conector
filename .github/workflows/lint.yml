name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  scaffold-lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate the pinned Framework and explicit connector context
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-context@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08
      - name: Setup python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Install hash-locked CI test dependency
        run: |
          python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/install-ci-dependencies.py --ci-toolcache
      - name: Install selected Apache native lifecycle prerequisites
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential apache2-dev libmodsecurity-dev
      - name: Initialize runner temp paths
        run: |
          set -eu
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "BUILD_ROOT=$verified_root/build"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
          } >> "$GITHUB_ENV"
      - name: Check common boundary and docs
        run: |
          set -eu
          if grep -RInE 'apache|nginx|haproxy|envoy|lighttpd|traefik' common/include common/src; then
            echo "common/include and common/src must remain connector-neutral"
            exit 1
          fi
          test -f README.md
          test -f docs/architecture.md
          test -f modules/ModSecurity-test-Framework/docs/connector-integration.md
          test -f modules/ModSecurity-test-Framework/docs/testing-and-evidence.md
          test -f docs/operations-and-security.md
          test -f docs/README.md
          test -f docs/connectors/README.md
          test -f docs/testing-and-evidence.md
          test -f reports/testing/test-coverage-overview.md
      - name: Check bilingual documentation
        run: python -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/documentation/check-bilingual-docs.py
      - name: Validate the global expanded inventory before any selected test
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/run-active-tests.py --check
      - name: Execute selected inventory, coverage, supply-chain and Common controls
        if: ${{ !cancelled() }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/run-active-tests.py --group inventory --group supply-chain --group common --group protocol
      - name: Verify generated configuration references
        if: ${{ !cancelled() }}
        run: python -P ci/tools/generate-connector-config-reference.py --check
      - name: Verify configuration reference semantics
        if: ${{ !cancelled() }}
        run: python -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/documentation/check-connector-config-reference.py
      - name: Run lightweight lint
        run: |
          make setup-dev
          make lint

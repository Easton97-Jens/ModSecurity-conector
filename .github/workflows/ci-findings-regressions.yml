name: Finding regressions (Parent)

on:
  pull_request:
    branches:
      - master
    paths:
      - "connectors/nginx/src/**"
      - "tests/c_source_contract.py"
      - "tests/test_nginx_error_page_intervention.py"
      - "tests/test_security_finding_intake.py"
      - "reports/audits/findings/20260929-intake.json"
      - ".github/workflows/ci-findings-regressions.yml"
  workflow_dispatch:

permissions: {}

jobs:
  nginx-b09-regression:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Read baseline PR391 Sonar annotation for remediation
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 391
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import Request, urlopen
          url = "https://api.github.com/repos/Easton97-Jens/ModSecurity-conector/check-runs/109623225352/annotations?per_page=100"
          request = Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "pr391-remediation"})
          with urlopen(request, timeout=20) as response:
              data = response.read(131073)
          if len(data) > 131072:
              raise SystemExit("Annotation response exceeds diagnostic limit")
          annotations = json.loads(data)
          if not isinstance(annotations, list) or len(annotations) > 100:
              raise SystemExit("Unexpected annotation response")
          fields = ("path", "start_line", "end_line", "title", "message")
          print("PR391_BASELINE_SONAR_ANNOTATIONS=" + json.dumps([
              {key: item.get(key) for key in fields} for item in annotations
          ], ensure_ascii=True))
          PY
      - name: Compile and run the bounded NGINX regression seam
        env:
          TMPDIR: ${{ runner.temp }}/findings-regressions
        run: |
          set -eu
          umask 077
          mkdir -p "$TMPDIR"
          python3 -m unittest tests.test_nginx_error_page_intervention tests.test_security_finding_intake -v

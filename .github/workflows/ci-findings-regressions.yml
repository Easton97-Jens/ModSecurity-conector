name: Finding regressions (Parent)

on:
  pull_request:
    branches:
      - master
    paths:
      - "connectors/nginx/src/**"
      - "modules/ModSecurity-test-Framework"
      - "modules/ModSecurity-test-Framework"
      - "reports/audits/findings/20260929-intake.json"
      - ".github/workflows/ci-findings-regressions.yml"
  workflow_dispatch:

permissions: {}

jobs:
  nginx-b09-regression:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: true
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/ci-findings-regressions/nginx-b09-regression@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08

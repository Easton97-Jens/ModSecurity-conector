name: task-sonar-393-readback

on:
  push:
    branches:
      - automation/prepare-framework-handoff-36608694822
    paths:
      - .github/workflows/task-sonar-393-readback.yml

permissions: {}

jobs:
  read-public-findings:
    if: github.repository == 'Easton97-Jens/ModSecurity-conector' && github.ref == 'refs/heads/automation/prepare-framework-handoff-36608694822'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read bounded public issue metadata without authentication
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.parse
          import urllib.request

          def read_json(url):
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = response.read(2_000_001)
              if len(data) > 2_000_000:
                  raise ValueError("Public response exceeds the diagnostic bound")
              return json.loads(data)

          sources = (
              ("sonar", "https://sonarcloud.io/api/issues/search?componentKeys=Easton97-Jens_ModSecurity-conector&pullRequest=393&resolved=false&ps=100"),
              ("github", "https://api.github.com/repos/Easton97-Jens/ModSecurity-conector/check-runs/109579686292/annotations"),
          )
          successes = 0
          for source, url in sources:
              try:
                  result = read_json(url)
              except Exception as error:
                  print(json.dumps({"source": source, "error_type": type(error).__name__}))
                  continue
              successes += 1
              if source == "github":
                  for item in result[:100]:
                      print(json.dumps({"source": source, **{key: item.get(key) for key in ("path", "start_line", "end_line", "annotation_level", "title", "message")}}))
                  continue
              print(json.dumps({"source": source, "paging": result.get("paging"), "total": result.get("total")}))
              issues = result.get("issues", [])
              for item in issues[:100]:
                  print(json.dumps({"source": source, **{key: item.get(key) for key in ("key", "rule", "severity", "component", "line", "message", "textRange", "flows", "status")}}))
              for rule in sorted({item["rule"] for item in issues})[:10]:
                  if not re.fullmatch(r"[A-Za-z0-9_-]+:[A-Za-z0-9_-]+", rule):
                      raise ValueError("Unexpected rule key")
                  details = read_json("https://sonarcloud.io/api/rules/show?key=" + urllib.parse.quote(rule, safe=""))["rule"]
                  print(json.dumps({"source": "rule", **{key: details.get(key) for key in ("key", "name", "htmlDesc", "descriptionSections")}}))
          if successes == 0:
              raise SystemExit("Public issue readback unavailable")
          PY

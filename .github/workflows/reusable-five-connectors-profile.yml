name: Reusable five-connector No-CRS profile

on:
  workflow_call:
    inputs:
      profile:
        description: Closed baseline profile selected by the trusted caller.
        required: true
        type: string

permissions: {}

jobs:
  resolve-profile:
    permissions:
      contents: read
    name: Resolve closed No-CRS profile
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.framework-ci.outputs.matrix }}
    steps:
      - name: Checkout profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/reusable-five-connectors-profile/resolve-profile@4391a424f34ea9c7b7ed09fd1df72a38a23cb909
        with:
          framework-revision: 4391a424f34ea9c7b7ed09fd1df72a38a23cb909
          caller-inputs: ${{ toJSON(inputs) }}
  no-crs:
    permissions:
      contents: read
    name: No-CRS / ${{ matrix.connector }} / ${{ inputs.profile }} / ${{ matrix.protocol }} / ${{ matrix.phase4_mode }}
    needs:
      - resolve-profile
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-profile.outputs.matrix) }}
    env:
      GOTOOLCHAIN: local
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      FIVE_CONNECTOR_PROFILE: ${{ inputs.profile }}
      CI_PROFILE: ${{ inputs.profile }}
      CI_INTEGRATION_MODE: ${{ matrix.integration_mode }}
      CI_PROTOCOL: ${{ matrix.protocol }}
      CI_PHASE4_MODE: ${{ matrix.phase4_mode }}
      CI_EVIDENCE_SCOPE: ${{ matrix.evidence_scope }}
      CI_CONNECTOR_PROFILE: ${{ matrix.connector_profile }}
      NO_CRS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/reusable-five-connectors-profile/no-crs@4391a424f34ea9c7b7ed09fd1df72a38a23cb909
        with:
          framework-revision: 4391a424f34ea9c7b7ed09fd1df72a38a23cb909
          caller-matrix: ${{ toJSON(matrix) }}
  aggregate:
    permissions:
      contents: read
    name: No-CRS / five-connector result aggregate
    if: always()
    needs:
      - no-crs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      FIVE_CONNECTOR_PROFILE: ${{ inputs.profile }}
      NO_CRS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout aggregate validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/reusable-five-connectors-profile/aggregate@4391a424f34ea9c7b7ed09fd1df72a38a23cb909
        with:
          framework-revision: 4391a424f34ea9c7b7ed09fd1df72a38a23cb909

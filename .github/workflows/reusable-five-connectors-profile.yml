name: Reusable five-connector No-CRS profile

on:
  workflow_call:
    inputs:
      profile:
        description: Closed baseline profile selected by the trusted caller.
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-profile:
    name: Resolve closed No-CRS profile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.profile.outputs.matrix }}
    steps:
      - name: Checkout profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Resolve fixed connector matrix
        id: profile
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          matrix=$(python3 ci/runtime/lifecycle/five-connector-no-crs-profile.py \
            --profile "$PROFILE" --emit-github-matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  no-crs:
    name: No-CRS / ${{ matrix.connector }} / ${{ inputs.profile }} / ${{ matrix.protocol }} / ${{ matrix.phase4_mode }}
    needs:
      - resolve-profile
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-profile.outputs.matrix) }}
    env:
      ALLOW_RUNTIME_BUILDS: "1"
      ALLOW_RUNTIME_DOWNLOADS: "1"
      FIVE_CONNECTOR_PROFILE: ${{ inputs.profile }}
      CI_PROFILE: ${{ inputs.profile }}
      CI_INTEGRATION_MODE: ${{ matrix.integration_mode }}
      CI_PROTOCOL: ${{ matrix.protocol }}
      CI_PHASE4_MODE: ${{ matrix.phase4_mode }}
      CI_EVIDENCE_SCOPE: ${{ matrix.evidence_scope }}
      CI_CONNECTOR_PROFILE: ${{ matrix.connector_profile }}
      NO_CRS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Verify declared fixed profile
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          python3 ci/runtime/lifecycle/five-connector-no-crs-profile.py \
            --profile "$FIVE_CONNECTOR_PROFILE" \
            --verify-row \
            --connector "$CONNECTOR" \
            --integration-mode "$CI_INTEGRATION_MODE" \
            --protocol "$CI_PROTOCOL" \
            --phase4-mode "$CI_PHASE4_MODE" \
            --evidence-scope "$CI_EVIDENCE_SCOPE" \
            --connector-profile "$CI_CONNECTOR_PROFILE" \
            --capabilities "connectors/$CONNECTOR/capabilities.json"

      - name: Declare selected profile and evidence scope
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          {
            echo "### $CONNECTOR CI profile"
            echo
            echo "| Matrix axis | Selected value |"
            echo "| --- | --- |"
            echo "| profile | \`$CI_PROFILE\` |"
            echo "| connector profile | \`$CI_CONNECTOR_PROFILE\` |"
            echo "| integration mode | \`$CI_INTEGRATION_MODE\` |"
            echo "| protocol | \`$CI_PROTOCOL\` |"
            echo "| Phase-4 mode | \`$CI_PHASE4_MODE\` |"
            echo "| evidence scope | \`$CI_EVIDENCE_SCOPE\` |"
            echo
            echo "This job runs only the fixed canonical No-CRS baseline. It does not claim CRS, MRTS, production, full-matrix, HTTP/2, HTTP/3, or unobserved response behavior."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Initialize private canonical roots
        env:
          CONNECTOR: ${{ matrix.connector }}
          SETUP_PYTHON_PATH: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -euo pipefail
          parent_commit=$(git rev-parse HEAD)
          framework_commit=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          test "$parent_commit" = "$GITHUB_SHA"
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified/$CI_PROFILE/$parent_commit/$framework_commit/$CONNECTOR/$NO_CRS_RUN_ID"
          build_root="$verified_root/build"
          verified_evidence_root="$verified_root/evidence"
          evidence_root="$verified_evidence_root/no-crs-evidence"
          run_root="$verified_root/runs"
          log_root="$verified_root/run-logs"
          cache_root="$verified_root/cache-v2"
          umask 077
          mkdir -p "$evidence_root"
          {
            echo "FIVE_CONNECTOR_PARENT_COMMIT=$parent_commit"
            echo "FIVE_CONNECTOR_FRAMEWORK_COMMIT=$framework_commit"
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "VERIFIED_BUILD_ROOT=$build_root"
            echo "VERIFIED_EVIDENCE_ROOT=$verified_evidence_root"
            echo "RUNTIME_RUN_ROOT=$run_root"
            echo "RUNTIME_LOG_ROOT=$log_root"
            echo "BUILD_ROOT=$build_root"
            echo "TMP_ROOT=$build_root/tmp"
            echo "LOG_ROOT=$build_root/logs"
            echo "CACHE_ROOT=$cache_root"
            echo "VERIFIED_COMPONENT_CACHE=$cache_root/shared"
            echo "CONNECTOR_COMPONENT_CACHE=$cache_root/shared"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "EVIDENCE_ROOT=$evidence_root"
            echo "NO_CRS_EVIDENCE_ROOT=$evidence_root"
            echo "RUNTIME_REPORT_OUTPUT_ROOT=$build_root/runtime-component-reports"
            echo "PYTHON=$SETUP_PYTHON_PATH"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Prepare framework dependencies
        run: |
          set -euo pipefail
          make setup-dev

      - name: Provision host component
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          case "$CONNECTOR" in
            apache|haproxy)
              RUNTIME_COMPONENT_TARGET="$CONNECTOR" make prepare-runtime-components
              ;;
            envoy)
              make prepare-envoy-runtime
              ;;
            traefik)
              make prepare-traefik-runtime
              ;;
            lighttpd)
              make prepare-lighttpd-runtime-build
              ;;
            *)
              echo "FAIL: connector is outside the fixed profile: $CONNECTOR" >&2
              exit 2
              ;;
          esac

      - name: Build connector
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          make "build-$CONNECTOR"

      - name: Validate configuration load
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          make "check-config-$CONNECTOR"

      - name: Run request-free start smoke
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          make "start-smoke-$CONNECTOR"

      - name: Run canonical minimal No-CRS runtime smoke
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          RUNTIME_EVIDENCE_ROOT="$EVIDENCE_ROOT" make "runtime-smoke-$CONNECTOR"

      - name: Validate canonical evidence and profile receipt
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          make "evidence-check-$CONNECTOR"
          python3 modules/ModSecurity-test-Framework/ci/checks/catalog/no_crs_baseline.py validate \
            --evidence-root "$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID" \
            --connector "$CONNECTOR" \
            --capabilities "connectors/$CONNECTOR/capabilities.json" \
            --check all
          test -f "$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/logs/five_connector_profile_receipt.log"

      - name: Publish canonical status
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          result="$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/result.json"
          test -f "$result"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$result")
          {
            echo "### $CONNECTOR canonical No-CRS status"
            echo
            echo "\`$status\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$status" = PASS

      - name: Check process cleanup
        if: always()
        env:
          CONNECTOR: ${{ matrix.connector }}
        run: |
          set -euo pipefail
          cleanup_log="$EVIDENCE_ROOT/$CONNECTOR/$NO_CRS_RUN_ID/logs/process_cleanup.log"
          test -f "$cleanup_log"
          test "$(cat "$cleanup_log")" = none

      - name: Upload canonical connector evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: five-no-crs-${{ matrix.connector }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 10
          if-no-files-found: error
          path: ${{ env.EVIDENCE_ROOT }}/${{ matrix.connector }}/${{ env.NO_CRS_RUN_ID }}/

  aggregate:
    name: No-CRS / five-connector result aggregate
    if: always()
    needs:
      - no-crs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIVE_CONNECTOR_PROFILE: ${{ inputs.profile }}
      NO_CRS_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout aggregate validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Initialize aggregate roots
        run: |
          set -euo pipefail
          parent_commit=$(git rev-parse HEAD)
          framework_commit=$(git -C modules/ModSecurity-test-Framework rev-parse HEAD)
          test "$parent_commit" = "$GITHUB_SHA"
          evidence_root="$RUNNER_TEMP/ModSecurity-conector-verified/$FIVE_CONNECTOR_PROFILE/$parent_commit/$framework_commit/aggregate/evidence"
          umask 077
          mkdir -p "$evidence_root"
          {
            echo "FIVE_CONNECTOR_PARENT_COMMIT=$parent_commit"
            echo "FIVE_CONNECTOR_FRAMEWORK_COMMIT=$framework_commit"
            echo "EVIDENCE_ROOT=$evidence_root"
          } >> "$GITHUB_ENV"

      - name: Download five connector evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: five-no-crs-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: downloaded
          merge-multiple: false

      - name: Restore and validate exact profile evidence
        id: validate-profile-evidence
        if: always()
        run: |
          set -euo pipefail
          status=0
          connector_list="$RUNNER_TEMP/five-connector-profile-connectors"
          expected_artifacts="$RUNNER_TEMP/five-connector-profile-artifacts"
          python3 ci/runtime/lifecycle/five-connector-no-crs-profile.py \
            --profile "$FIVE_CONNECTOR_PROFILE" --emit-connectors > "$connector_list"
          : > "$expected_artifacts"
          while IFS= read -r connector; do
            printf 'five-no-crs-%s-%s\n' "$connector" "$NO_CRS_RUN_ID" >> "$expected_artifacts"
          done < "$connector_list"
          artifact_count=0
          if [ ! -d downloaded ]; then
            echo "::error::No five-profile artifacts were downloaded"
            status=1
          else
            for artifact_dir in downloaded/*; do
              if [ ! -d "$artifact_dir" ] || [ -L "$artifact_dir" ]; then
                echo "::error::Downloaded artifact path is not a regular directory: $artifact_dir"
                status=1
                continue
              fi
              artifact_name=${artifact_dir##*/}
              artifact_count=$((artifact_count + 1))
              if ! grep -Fqx "$artifact_name" "$expected_artifacts"; then
                echo "::error::Unexpected five-profile artifact: $artifact_name"
                status=1
              fi
            done
            if [ "$artifact_count" -ne 5 ]; then
              echo "::error::Expected exactly five five-profile artifacts; got $artifact_count"
              status=1
            fi
          fi
          while IFS= read -r connector; do
            artifact_dir="downloaded/five-no-crs-$connector-$NO_CRS_RUN_ID"
            destination="$EVIDENCE_ROOT/$connector/$NO_CRS_RUN_ID"
            mkdir -p "$destination"
            if [ ! -d "$artifact_dir" ]; then
              echo "::error::Missing five-profile artifact for $connector"
              status=1
              continue
            fi
            cp -a "$artifact_dir/." "$destination/"
            if ! python3 modules/ModSecurity-test-Framework/ci/checks/catalog/no_crs_baseline.py validate \
              --evidence-root "$destination" \
              --connector "$connector" \
              --capabilities "connectors/$connector/capabilities.json" \
              --check all; then
              echo "::error::Canonical evidence for $connector is invalid; retained for diagnosis"
              status=1
            fi
          done < "$connector_list"
          exit "$status"

      - name: Build exact five-connector result aggregate
        if: always()
        run: |
          set -euo pipefail
          canonical_validation_status=failed
          if [ "${{ steps.validate-profile-evidence.outcome }}" = "success" ]; then
            canonical_validation_status=passed
          fi
          python3 ci/runtime/lifecycle/aggregate-five-connector-no-crs.py \
            --profile "$FIVE_CONNECTOR_PROFILE" \
            --canonical-validation-status "$canonical_validation_status" \
            --evidence-root "$EVIDENCE_ROOT" \
            --run-id "$NO_CRS_RUN_ID" \
            --connector-commit "$FIVE_CONNECTOR_PARENT_COMMIT" \
            --framework-commit "$FIVE_CONNECTOR_FRAMEWORK_COMMIT" \
            --output-json "$EVIDENCE_ROOT/five-connectors-no-crs-summary.json" \
            --output-md "$EVIDENCE_ROOT/five-connectors-no-crs-summary.md" \
            --output-md-de "$EVIDENCE_ROOT/five-connectors-no-crs-summary.de.md"

      - name: Upload result-only aggregate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: five-connectors-no-crs-summary-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 10
          if-no-files-found: error
          path: |
            ${{ env.EVIDENCE_ROOT }}/five-connectors-no-crs-summary.json
            ${{ env.EVIDENCE_ROOT }}/five-connectors-no-crs-summary.md
            ${{ env.EVIDENCE_ROOT }}/five-connectors-no-crs-summary.de.md

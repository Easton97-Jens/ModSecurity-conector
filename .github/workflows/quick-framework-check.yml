name: quick-framework-check

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  quick-check:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/quick-framework-check/quick-check@cc8af0427c49ef32701220748caf35dad7940246
        with:
          framework-revision: cc8af0427c49ef32701220748caf35dad7940246

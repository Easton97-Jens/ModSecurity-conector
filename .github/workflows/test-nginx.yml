name: test-nginx

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

jobs:
  nginx-structure:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-nginx/nginx-structure@a7633419bb0257c879a5b5a775f4f2e2b81a01ef
        with:
          framework-revision: a7633419bb0257c879a5b5a775f4f2e2b81a01ef

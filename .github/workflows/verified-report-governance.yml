name: verified-report-governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-governance:
    runs-on: ubuntu-latest
    # A strict/full verified run has a 345-minute maximum internal budget.
    # Keep a small outer margin without relying on a shortened or soft run.
    timeout-minutes: 360
    env:
      ALLOW_RUNTIME_DOWNLOADS: "1"
      ALLOW_RUNTIME_BUILDS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # The full evidence producer must reject mutable Expat refs before it
      # prepares a runtime source checkout.
      RUNTIME_COMPONENT_STRICT_VERIFY: "1"
      # Verified signed upstream release R_2_8_2, resolved to its immutable
      # commit before this workflow change. The Parent provisioner rejects a
      # mutable Expat ref for the strict evidence path.
      EXPAT_GIT_REF: c61098da494eea1cbd091118118dcee417faacea
      EXPAT_PROMPT_EXPECTED_LATEST: R_2_8_2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Initialize verified runtime paths
        run: |
          set -eu
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "BUILD_ROOT=$verified_root/build"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked CI dependency
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -eu
          venv="$RUNNER_TEMP/verified-report-python"
          "$PYTHON_BIN" -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --require-hashes -r modules/ModSecurity-test-Framework/requirements-ci.lock
          "$venv/bin/python" -m pip check
          echo "PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Generated report governance
        run: |
          set -eu
          make report-governance

      - name: Produce current verified runtime evidence
        run: |
          set -eu
          make verified-report-run

      - name: Strict verified-report evidence gate
        run: |
          set -eu
          make verified-report-evidence-gate

      - name: Summarize failed runtime preparation
        if: failure()
        run: |
          set -eu
          log_root="$BUILD_ROOT/verified-runs"
          if [ -d "$log_root" ]; then
            find "$log_root" -type f -name '02-make-prepare-runtime-components.log' -exec tail -n 300 -- {} +
          else
            echo "No verified runtime log root was created."
          fi

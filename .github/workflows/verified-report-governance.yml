name: verified-report-governance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-governance:
    runs-on: ubuntu-latest
    # A strict/full verified run has a 345-minute maximum internal budget.
    # Keep a small outer margin without relying on a shortened or soft run.
    timeout-minutes: 360
    env:
      ALLOW_RUNTIME_DOWNLOADS: "1"
      ALLOW_RUNTIME_BUILDS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # The full evidence producer must reject mutable Expat refs before it
      # prepares a runtime source checkout.
      RUNTIME_COMPONENT_STRICT_VERIFY: "1"
      # Verified signed upstream release R_2_8_2, resolved to its immutable
      # commit before this workflow change. The Parent provisioner rejects a
      # mutable Expat ref for the strict evidence path.
      EXPAT_GIT_REF: c61098da494eea1cbd091118118dcee417faacea
      EXPAT_PROMPT_EXPECTED_LATEST: R_2_8_2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Initialize verified runtime paths
        run: |
          set -eu
          verified_root="$RUNNER_TEMP/ModSecurity-conector-verified"
          {
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/state"
            echo "SOURCE_ROOT=$verified_root/src"
            echo "BUILD_ROOT=$verified_root/build"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
            echo "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/python-pycache"
          } >> "$GITHUB_ENV"

      - name: Install hash-locked CI dependency
        env:
          PYTHON_BIN: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -eu
          venv="$RUNNER_TEMP/verified-report-python"
          "$PYTHON_BIN" -m venv "$venv"
          "$venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --require-hashes -r modules/ModSecurity-test-Framework/requirements-ci.lock
          "$venv/bin/python" -m pip check
          echo "PYTHON=$venv/bin/python" >> "$GITHUB_ENV"

      - name: Generated report governance
        run: |
          set -eu
          make report-governance

      - name: Produce current verified runtime evidence
        run: |
          set -eu
          make verified-report-run

      - name: Strict verified-report evidence gate
        run: |
          set -eu
          make verified-report-evidence-gate

      - name: Resolve payload-safe verified runtime evidence paths
        id: verified-evidence-paths
        run: |
          set -eu
          run_id_path="$BUILD_ROOT/verified-runs/current-run-id"
          if [ ! -f "$run_id_path" ] || [ -L "$run_id_path" ]; then
            echo "Verified runtime run identifier is unavailable or unsafe." >&2
            exit 1
          fi
          run_id="$(cat -- "$run_id_path")"
          if [ -z "$run_id" ] || [ "${#run_id}" -gt 128 ] || ! [[ "$run_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Verified runtime run identifier is invalid." >&2
            exit 1
          fi
          verified_run_root="$BUILD_ROOT/verified-runs/$run_id"
          for evidence_path in \
            "reports/testing/generated/manifest/verified-run-manifest.generated.json" \
            "reports/testing/generated/manifest/report-freshness.generated.json" \
            "reports/testing/generated/manifest/report-refresh-manifest.generated.json" \
            "$verified_run_root/verified-commands.json" \
            "$verified_run_root/full-matrix-aggregate-receipt.json" \
            "$BUILD_ROOT/full-matrix/full-runtime-matrix-runs.jsonl"; do
            if [ ! -f "$evidence_path" ] || [ -L "$evidence_path" ]; then
              echo "Required payload-safe evidence path is unavailable or unsafe: $evidence_path" >&2
              exit 1
            fi
          done
          for crs in no-crs with-crs; do
            for mrts in no-mrts with-mrts; do
              for connector in apache nginx haproxy; do
                evidence_path="$BUILD_ROOT/full-matrix/$crs/$mrts/$connector/job.json"
                if [ ! -f "$evidence_path" ] || [ -L "$evidence_path" ]; then
                  echo "Required payload-safe evidence path is unavailable or unsafe: $evidence_path" >&2
                  exit 1
                fi
              done
            done
          done
          printf 'build_root=%s\n' "$BUILD_ROOT" >> "$GITHUB_OUTPUT"
          printf 'verified_run_root=%s\n' "$verified_run_root" >> "$GITHUB_OUTPUT"

      - name: Upload payload-safe verified runtime evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-report-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Keep the revision-bound structured receipt chain without raw runtime payloads.
          retention-days: 10
          if-no-files-found: error
          path: |
            reports/testing/generated/manifest/verified-run-manifest.generated.json
            reports/testing/generated/manifest/report-freshness.generated.json
            reports/testing/generated/manifest/report-refresh-manifest.generated.json
            ${{ steps.verified-evidence-paths.outputs.verified_run_root }}/verified-commands.json
            ${{ steps.verified-evidence-paths.outputs.verified_run_root }}/full-matrix-aggregate-receipt.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/full-runtime-matrix-runs.jsonl
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/no-mrts/apache/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/no-mrts/nginx/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/no-mrts/haproxy/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/with-mrts/apache/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/with-mrts/nginx/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/no-crs/with-mrts/haproxy/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/no-mrts/apache/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/no-mrts/nginx/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/no-mrts/haproxy/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/with-mrts/apache/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/with-mrts/nginx/job.json
            ${{ steps.verified-evidence-paths.outputs.build_root }}/full-matrix/with-crs/with-mrts/haproxy/job.json

      - name: Summarize failed runtime preparation
        if: failure()
        run: |
          set -eu
          tail_regular_log() {
            local log_label="$1"
            local log_path="$2"
            local stop_commands_token

            if [ -f "$log_path" ] && [ ! -L "$log_path" ]; then
              stop_commands_token="$(uuidgen)"
              echo "::stop-commands::$stop_commands_token"
              if ! tail -n 300 -- "$log_path"; then
                echo "The safe $log_label could not be read."
              fi
              echo "::$stop_commands_token::"
            else
              echo "No safe $log_label was created."
            fi
          }

          run_id_path="$BUILD_ROOT/verified-runs/current-run-id"
          if [ -f "$run_id_path" ] && [ ! -L "$run_id_path" ]; then
            run_id="$(cat -- "$run_id_path")"
            if [ -z "$run_id" ] || [ "${#run_id}" -gt 128 ] || ! [[ "$run_id" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "Current verified runtime run identifier is invalid."
            else
              current_run_log="$BUILD_ROOT/verified-runs/$run_id/logs/02-make-prepare-runtime-components.log"
              current_matrix_log="$BUILD_ROOT/verified-runs/$run_id/logs/04-make-runtime-matrix-all-runtime.log"
              tail_regular_log "current runtime preparation log" "$current_run_log"
              tail_regular_log "current runtime matrix log" "$current_matrix_log"
            fi
          else
            echo "No safe verified runtime run identifier was created."
          fi

          apache_build_log="$BUILD_ROOT/logs/runtime-components/apache-build.log"
          tail_regular_log "Apache runtime build log" "$apache_build_log"

          nginx_configure_log="$BUILD_ROOT/logs/nginx/nginx-configure.log"
          tail_regular_log "NGINX configure log" "$nginx_configure_log"

name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: sonarqube-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Sonar C++${{ matrix.cpp }} (${{ matrix.advisory && 'advisory' || 'required' }})
    if: >-
      github.repository == 'Easton97-Jens/ModSecurity-conector' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpp: "17"
            project: Easton97-Jens_ModSecurity-conector
            advisory: false
            branch_args: ""
          - cpp: "20"
            project: Easton97-Jens_ModSecurity-conector_cpp20_advisory
            advisory: true
            branch_args: -Dsonar.branch.name=master
          - cpp: "23"
            project: Easton97-Jens_ModSecurity-conector_cpp23_advisory
            advisory: true
            branch_args: -Dsonar.branch.name=master
    concurrency:
      group: sonar-project-${{ matrix.project }}-${{ matrix.advisory && 'advisory' || github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    env:
      GOTOOLCHAIN: local
      GOWORK: "off"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Keep analysis output outside the checkout
        shell: bash
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/sonar-go/build"
            echo "GOMODCACHE=$RUNNER_TEMP/sonar-go/modules"
            echo "TMPDIR=$RUNNER_TEMP"
            echo "SONAR_USER_HOME=$RUNNER_TEMP/sonar-cache"
          } >> "$GITHUB_ENV"
      - name: Set up canonical Python
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Validate Parent analysis scope with Python coverage
        run: |
          set -eu
          python3 -m venv "$RUNNER_TEMP/sonar-python"
          export PATH="$RUNNER_TEMP/sonar-python/bin:$PATH"
          export PIP_REQUIRE_VIRTUALENV=true
          python3 -m pip install --disable-pip-version-check --no-input \
            --only-binary=:all: --require-hashes -r ci/requirements/sonar-coverage.txt
          mkdir -p "$RUNNER_TEMP/sonar-coverage"
          export COVERAGE_FILE="$RUNNER_TEMP/sonar-coverage/python.data"
          python3 -m coverage run --rcfile=ci/sonar-coverage.ini --parallel-mode \
            ci/checks/analysis/check-sonar-scope.py
          python3 -m coverage run --rcfile=ci/sonar-coverage.ini --parallel-mode \
            -m unittest -v tests.test_sonar_scope
          python3 -m coverage combine --rcfile=ci/sonar-coverage.ini
          python3 -m coverage xml --rcfile=ci/sonar-coverage.ini \
            -o "$RUNNER_TEMP/sonar-coverage/python.xml"
          test -s "$RUNNER_TEMP/sonar-coverage/python.xml"
      - name: Set up canonical Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
          cache: false
      - name: Generate focused Go coverage in each module
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/sonar-coverage"
          mkdir -p "$reports"
          (
            cd connectors/envoy/ext_proc
            go test -mod=readonly -list '^TestClientFramesBoundedOrderedOperations$' ./internal/responseobserver |
              grep -Fx 'TestClientFramesBoundedOrderedOperations'
            go test -mod=readonly -count=1 -run '^TestClientFramesBoundedOrderedOperations$' \
              -coverprofile="$reports/envoy.out" ./internal/responseobserver
            go tool cover -func="$reports/envoy.out" >/dev/null
          )
          (
            cd connectors/traefik/native_middleware
            go test -mod=readonly -list '^TestMiddlewareForwardsRequestAuthorityAsHostHeader$' . |
              grep -Fx 'TestMiddlewareForwardsRequestAuthorityAsHostHeader'
            go test -mod=readonly -count=1 -run '^TestMiddlewareForwardsRequestAuthorityAsHostHeader$' \
              -coverprofile="$reports/traefik-native.out" .
            go tool cover -func="$reports/traefik-native.out" >/dev/null
          )
          (
            cd connectors/traefik/composite_middleware
            go test -mod=readonly -list '^TestStripInternalHeadersRemovesTrailerForms$' . |
              grep -Fx 'TestStripInternalHeadersRemovesTrailerForms'
            go test -mod=readonly -count=1 -run '^TestStripInternalHeadersRemovesTrailerForms$' \
              -coverprofile="$reports/traefik-composite.out" .
            go tool cover -func="$reports/traefik-composite.out" >/dev/null
          )
          (
            cd connectors/traefik/response_observer
            go test -mod=readonly -list '^TestResponseHeaderEncodingUsesLengthThenBytesOrder$' . |
              grep -Fx 'TestResponseHeaderEncodingUsesLengthThenBytesOrder'
            go test -mod=readonly -count=1 -run '^TestResponseHeaderEncodingUsesLengthThenBytesOrder$' \
              -coverprofile="$reports/traefik-observer.out" .
            go tool cover -func="$reports/traefik-observer.out" >/dev/null
          )
          for report in "$reports"/*.out; do
            test -s "$report"
          done
      - name: Analyze exact revision and await Quality Gate
        id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: >-
            -Dsonar.projectKey=${{ matrix.project }}
            -Dsonar.cfamily.reportingCppStandardOverride=c++${{ matrix.cpp }}
            ${{ matrix.branch_args }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.working.directory=${{ runner.temp }}/sonar-work
            -Dsonar.python.coverage.reportPaths=${{ runner.temp }}/sonar-coverage/python.xml
            -Dsonar.go.coverage.reportPaths=${{ runner.temp }}/sonar-coverage/envoy.out,${{ runner.temp }}/sonar-coverage/traefik-native.out,${{ runner.temp }}/sonar-coverage/traefik-composite.out,${{ runner.temp }}/sonar-coverage/traefik-observer.out
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
      - name: Report the actual analysis outcome
        if: always()
        env:
          CPP_STANDARD: ${{ matrix.cpp }}
          SONAR_PROJECT: ${{ matrix.project }}
          ADVISORY: ${{ matrix.advisory }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          ANALYZED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          {
            echo "### Full Parent Sonar scan / Vollständiger Parent-Sonar-Scan: C++$CPP_STANDARD"
            echo "Project / Projekt: $SONAR_PROJECT"
            echo "Revision: $ANALYZED_SHA"
            echo "Advisory / Unverbindlich: $ADVISORY"
            echo "Scanner and gate / Scanner und Gate: $SCAN_OUTCOME"
            if test -f "$RUNNER_TEMP/sonar-work/report-task.txt"; then
              sed -n '/^\(ceTaskId\|dashboardUrl\|projectKey\)=/p' "$RUNNER_TEMP/sonar-work/report-task.txt"
            else
              echo 'No server report published / Kein Serverreport veröffentlicht'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

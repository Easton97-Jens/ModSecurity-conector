name: test-traefik

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  traefik-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Check Traefik Common and host contracts
        run: |
          set -eu
          make check-traefik-common-adoption
          make check-remaining-connectors-host-integration
          make check-remaining-connectors-build-wiring
          make check-remaining-connectors-start-wiring
          make check-remaining-connectors-claim-policy
      - name: Collect host runtime preflight evidence
        if: always()
        env:
          CONNECTOR: traefik
          RUNTIME_LOCK: modules/ModSecurity-test-Framework/ci/provisioning/runtime-component-lock.json
        run: |
          set -u
          evidence_dir="$RUNNER_TEMP/hostruntime-evidence/$CONNECTOR"
          preflight_dir="$evidence_dir/preflight"
          mkdir -p "$preflight_dir"
          binary_path="$(command -v traefik 2>/dev/null || true)"
          if [ -z "$binary_path" ]; then
            binary_path="$RUNNER_TEMP/hostruntime-missing-traefik"
          fi
          preflight_exit_codes=""
          run_preflight() {
            lock_profile="$1"
            result_dir="$preflight_dir/$lock_profile"
            mkdir -p "$result_dir"
            set +e
            python3 ci/runtime/common/hostruntime-preflight.py \
              --connector "$CONNECTOR" \
              --profile "$lock_profile" \
              --runtime-lock "$RUNTIME_LOCK" \
              --lock-profile "$lock_profile" \
              --binary "$binary_path" \
              --expected-os linux \
              --expected-arch amd64 \
              --write-dir "$RUNNER_TEMP" \
              --disk-path "$RUNNER_TEMP" \
              --min-free-bytes 104857600 \
              --config connectors/traefik/config/traefik-forwardauth.conf \
              --fixture connectors/traefik/config/traefik-native-middleware-dynamic.yaml \
              --tool python3 \
              --tool make \
              --output "$result_dir/status.json"
            preflight_rc=$?
            set -e
            preflight_exit_codes="$preflight_exit_codes$lock_profile:$preflight_rc,"
          }
          run_preflight traefik-forwardauth
          run_preflight traefik-native
          python3 - "$preflight_dir" "$evidence_dir" "$CONNECTOR" "$preflight_exit_codes" traefik-forwardauth traefik-native <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          preflight_dir = Path(sys.argv[1])
          evidence_dir = Path(sys.argv[2])
          connector = sys.argv[3]
          expected_profiles = sys.argv[5:]
          exit_codes = {
              item.split(":", 1)[0]: int(item.split(":", 1)[1])
              for item in sys.argv[4].split(",")
              if ":" in item
          }
          allowed = {"PASS", "FAIL", "BLOCKED", "NOT_RUN", "NOT_APPLICABLE"}

          def clean(value: object, limit: int = 160) -> str:
              return re.sub(r"[\x00-\x1f\x7f]", " ", str(value))[:limit]

          records = []
          for profile in expected_profiles:
              status_path = preflight_dir / profile / "status.json"
              status_path.parent.mkdir(parents=True, exist_ok=True)
              try:
                  raw = json.loads(status_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError):
                  raw = {}
              status = raw.get("status")
              reason_code = raw.get("reason_code", "")
              exit_code = exit_codes.get(profile, 2)
              runtime_lock = raw.get("runtime_lock")
              checks = raw.get("checks", [])
              check_reasons = {
                  item.get("reason_code", "")
                  for item in checks
                  if isinstance(item, dict)
              }
              if status not in allowed:
                  status = "BLOCKED"
                  reason_code = "invalid_or_missing_preflight_status"
              elif exit_code != 0 and status == "PASS":
                  status = "BLOCKED"
                  reason_code = "preflight_exit_without_pass_evidence"
              elif not isinstance(runtime_lock, dict) or not raw.get("lock_profile"):
                  status = "BLOCKED"
                  reason_code = "runtime_lock_missing"
              elif any(reason.startswith("binary_") for reason in check_reasons):
                  status = "BLOCKED"
                  reason_code = next(
                      reason for reason in check_reasons if reason.startswith("binary_")
                  )
              safe = {
                  "schema_version": 1,
                  "evidence_kind": "preflight",
                  "connector": connector,
                  "profile": clean(raw.get("profile", profile), 120),
                  "lock_profile": clean(raw.get("lock_profile", profile), 120),
                  "status": status,
                  "runtime_status": "NOT_RUN",
                  "reason_code": clean(reason_code, 100),
                  "exit_code": exit_code,
                  "expected_version": clean(raw.get("expected_version", ""), 80),
                  "actual_version": clean(raw.get("actual_version", ""), 80),
                  "host": {
                      "os": clean(raw.get("host", {}).get("os", ""), 32),
                      "arch": clean(raw.get("host", {}).get("arch", ""), 32),
                  },
                  "runtime_lock": {
                      "name": clean(runtime_lock.get("name", ""), 80) if isinstance(runtime_lock, dict) else "",
                      "asset_id": clean(runtime_lock.get("asset_id", ""), 120) if isinstance(runtime_lock, dict) else "",
                  },
              }
              status_path.write_text(json.dumps(safe, sort_keys=True) + "\n", encoding="utf-8")
              (status_path.parent / "summary.md").write_text(
                  f"# {connector} {safe['lock_profile']} preflight\n\n"
                  f"- status: {safe['status']}\n"
                  f"- reason_code: {safe['reason_code']}\n"
                  f"- runtime_status: NOT_RUN\n",
                  encoding="utf-8",
              )
              records.append(safe)

          preflight_status = "PASS" if records and all(record["status"] == "PASS" for record in records) else "BLOCKED"
          runtime_reason = "runtime_execution_not_configured" if preflight_status == "PASS" else "preflight_blocked"
          runtime_record = {
              "schema_version": 1,
              "evidence_kind": "runtime",
              "connector": connector,
              "status": "NOT_RUN",
              "runtime_status": "NOT_RUN",
              "reason_code": runtime_reason,
              "preflight_status": preflight_status,
              "profiles": [record["lock_profile"] for record in records],
          }
          (evidence_dir / "hostruntime-record.json").write_text(
              json.dumps(runtime_record, sort_keys=True) + "\n", encoding="utf-8"
          )
          (evidence_dir / "summary.md").write_text(
              f"# {connector} host-runtime evidence\n\n"
              f"- preflight_status: {preflight_status}\n"
              f"- runtime_status: NOT_RUN\n"
              f"- reason_code: {runtime_reason}\n",
              encoding="utf-8",
          )
          PY
      - name: Upload sanitized host runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: traefik-hostruntime-evidence
          path: ${{ runner.temp }}/hostruntime-evidence/traefik
          if-no-files-found: error

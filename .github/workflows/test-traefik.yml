name: test-traefik

on:
  push:
  pull_request:

permissions: {}

jobs:
  traefik-contract:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-traefik/traefik-contract@91145b7ba721bdec4e89af754cf40bf496fd2a08
        with:
          framework-revision: 91145b7ba721bdec4e89af754cf40bf496fd2a08

name: manual-heavy-runtime-validation

on:
  workflow_dispatch:
    inputs:
      cleanup_artifacts:
        description: Delete prior full-smoke artifacts before the run
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  cleanup-artifacts:
    if: ${{ inputs.cleanup_artifacts }}
    name: Cleanup old smoke artifacts (${{ matrix.variant }})
    permissions:
      actions: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no-crs
          - with-crs
    steps:
      - name: Cleanup artifacts before upload
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_NAME: full-smoke-sequential-${{ matrix.variant }}-artifacts
        with:
          script: |
            const GLOBAL_KEEP_LIMIT = 20;
            const PRE_UPLOAD_KEEP_LIMIT = Math.max(GLOBAL_KEEP_LIMIT - 1, 0);
            const { owner, repo } = context.repo;
            const targetName = process.env.ARTIFACT_NAME || 'artifact';
            const targetGroup = artifactGroupName(targetName);

            function artifactGroupName(name) {
              return name
                .replace(/-\d{8,}$/u, '')
                .replace(/-\d{6,}-\d+$/u, '')
                .replace(/-run-\d+$/u, '')
                .replace(/-attempt-\d+$/u, '');
            }

            function compareArtifactsNewestFirst(left, right) {
              const createdDiff = Date.parse(right.created_at) - Date.parse(left.created_at);
              if (createdDiff !== 0) {
                return createdDiff;
              }
              return right.id - left.id;
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const groups = new Map();
            for (const artifact of artifacts) {
              const group = artifactGroupName(artifact.name);
              if (!groups.has(group)) {
                groups.set(group, []);
              }
              groups.get(group).push(artifact);
            }

            const deleteById = new Map();
            const retainedByGroup = [];

            for (const [group, groupArtifacts] of groups) {
              groupArtifacts.sort(compareArtifactsNewestFirst);
              const [newest, ...older] = groupArtifacts;
              if (group === targetGroup) {
                for (const artifact of groupArtifacts) {
                  deleteById.set(artifact.id, {
                    artifact,
                    group,
                    reason: `same logical group as upcoming upload: ${targetGroup}`,
                  });
                }
                continue;
              }
              if (newest) {
                retainedByGroup.push(newest);
              }
              for (const artifact of older) {
                deleteById.set(artifact.id, {
                  artifact,
                  group,
                  reason: 'older artifact in logical group',
                });
              }
            }

            retainedByGroup.sort(compareArtifactsNewestFirst);

            for (const artifact of retainedByGroup.slice(PRE_UPLOAD_KEEP_LIMIT)) {
              deleteById.set(artifact.id, {
                artifact,
                group: artifactGroupName(artifact.name),
                reason: `reserve one slot while keeping newest ${GLOBAL_KEEP_LIMIT} artifacts after upload`,
              });
            }

            const deleteCandidates = Array.from(deleteById.values())
              .sort((left, right) => compareArtifactsNewestFirst(left.artifact, right.artifact));

            core.info(`Found ${artifacts.length} artifact(s); deleting ${deleteCandidates.length} before uploading ${targetName}.`);

            for (const entry of deleteCandidates) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: entry.artifact.id,
                });
                core.info(`Deleted artifact ${entry.artifact.name} (${entry.artifact.id}) from group ${entry.group}: ${entry.reason}`);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`Could not delete artifact ${entry.artifact.name} (${entry.artifact.id}) from group ${entry.group}: ${message}`);
              }
            }

  manual-heavy-runtime-validation:
    if: ${{ always() }}
    needs: cleanup-artifacts
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no-crs
          - with-crs
    env:
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NGINX_FUNCTIONAL_WORKER_USER: msconnector-nginx-functional
      NGINX_FUNCTIONAL_WORKER_GROUP: msconnector-nginx-functional
      MODSECURITY_REPO_URL: https://github.com/owasp-modsecurity/ModSecurity.git
      BUILD_HTTPD_FROM_SOURCE: "1"
      BUILD_PCRE2_FROM_SOURCE: "1"
      BUILD_NGINX_FROM_SOURCE: "1"
      NGINX_SOURCE_MODE: github-release
      NGINX_SOURCE_REPO_URL: https://github.com/nginx/nginx
      NGINX_RELEASE_TAG: release-1.31.6
      NGINX_SOURCE_GIT_REF: release-1.31.6
      NGINX_RELEASE_ASSET_NAME: nginx-1.31.6.tar.gz
      NGINX_SHA256: 974ed5298a5e398e008704ed5db284e655fc270c596493dbccada452448fc9f1
      NGINX_REQUIRE_PINNED_PROVENANCE: "1"
      SMOKE_PREPARE_TIMEOUT_SECONDS: "3600"
      SMOKE_LOCK_MODE: wait
      SMOKE_LOCK_TIMEOUT_SECONDS: "1800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Set up toolchain
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false

      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"

      - name: Initialize paths
        id: paths
        run: |
          set -eu
          actual="$(git rev-parse --verify 'HEAD^{commit}')"
          printf '%s\n' "$EXPECTED_PARENT_SHA" | /usr/bin/grep -Eq '^[0-9a-f]{40}$'
          test "$actual" = "$EXPECTED_PARENT_SHA"
          test "$(/usr/bin/id -u)" -ne 0
          /usr/bin/sudo -n /usr/bin/id -u | /usr/bin/grep -qx 0
          /usr/bin/sudo -n /usr/bin/id -g | /usr/bin/grep -qx 0
          /usr/bin/getent group "$NGINX_FUNCTIONAL_WORKER_GROUP" >/dev/null 2>&1 || \
            /usr/bin/sudo -n /usr/sbin/groupadd --system "$NGINX_FUNCTIONAL_WORKER_GROUP"
          /usr/bin/getent passwd "$NGINX_FUNCTIONAL_WORKER_USER" >/dev/null 2>&1 || \
            /usr/bin/sudo -n /usr/sbin/useradd --system --no-create-home --no-user-group \
              --gid "$NGINX_FUNCTIONAL_WORKER_GROUP" --shell /usr/sbin/nologin \
              "$NGINX_FUNCTIONAL_WORKER_USER"
          worker_shell="$(/usr/bin/getent passwd "$NGINX_FUNCTIONAL_WORKER_USER" | /usr/bin/cut -d: -f7)"
          worker_group_gid="$(/usr/bin/getent group "$NGINX_FUNCTIONAL_WORKER_GROUP" | /usr/bin/cut -d: -f3)"
          worker_uid="$(/usr/bin/sudo -n /usr/sbin/runuser -u "$NGINX_FUNCTIONAL_WORKER_USER" -- /usr/bin/id -u)"
          worker_gid="$(/usr/bin/sudo -n /usr/sbin/runuser -u "$NGINX_FUNCTIONAL_WORKER_USER" -- /usr/bin/id -g)"
          test "$worker_shell" = /usr/sbin/nologin
          test "$worker_uid" -ne 0
          test "$worker_gid" -ne 0
          test "$worker_gid" = "$worker_group_gid"
          test -d /tmp
          test ! -L /tmp
          test "$(/usr/bin/stat -c '%u:%a' /tmp)" = 0:1777
          runner_uid="$(/usr/bin/id -u)"
          runner_gid="$(/usr/bin/id -g)"
          functional_job_root="$(/usr/bin/sudo -n /usr/bin/mktemp -d /tmp/ModSecurity-conector-nginx-functional-root.XXXXXX)"
          case "$functional_job_root" in
            /tmp/ModSecurity-conector-nginx-functional-root.*) ;;
            *) exit 1 ;;
          esac
          test -d "$functional_job_root"
          test ! -L "$functional_job_root"
          test "$(/usr/bin/stat -c '%u:%g:%a' "$functional_job_root")" = 0:0:700
          /usr/bin/sudo -n /bin/chmod 711 "$functional_job_root"
          test "$(/usr/bin/stat -c '%u:%g:%a' "$functional_job_root")" = 0:0:711
          verified_root="$functional_job_root/ModSecurity-conector-nginx-exact-head"
          functional_parent="$functional_job_root/ModSecurity-conector-nginx-functional-parent"
          /usr/bin/sudo -n /bin/mkdir "$verified_root"
          /usr/bin/sudo -n /bin/chown "$runner_uid:$runner_gid" "$verified_root"
          /usr/bin/sudo -n /bin/chmod 700 "$verified_root"
          test "$(/usr/bin/stat -c '%u:%g:%a' "$verified_root")" = "$runner_uid:$runner_gid:700"
          test ! -e "$functional_parent"
          test ! -L "$functional_parent"
          /usr/bin/sudo -n /bin/mkdir "$functional_parent"
          /usr/bin/sudo -n /bin/chmod 711 "$functional_parent"
          test "$(/usr/bin/stat -c '%u:%g:%a' "$functional_parent")" = 0:0:711
          /usr/bin/sudo -n /usr/sbin/runuser -u "$NGINX_FUNCTIONAL_WORKER_USER" -- /usr/bin/test -x "$functional_job_root"
          /usr/bin/sudo -n /usr/sbin/runuser -u "$NGINX_FUNCTIONAL_WORKER_USER" -- /usr/bin/test -x "$functional_parent"
          if /usr/bin/sudo -n /usr/sbin/runuser -u "$NGINX_FUNCTIONAL_WORKER_USER" -- /usr/bin/test -x "$verified_root"; then
            echo "full-smoke worker can traverse the private provisioning root" >&2
            exit 1
          fi
          evidence_root="$verified_root/nginx-functional-a-evidence"
          /bin/mkdir -m 700 "$evidence_root"
          test "$(/usr/bin/stat -c '%u:%g:%a' "$evidence_root")" = "$runner_uid:$runner_gid:700"
          build_root="$verified_root/build"
          build_root_apache="$verified_root/apache-build"
          source_root="$verified_root/src"
          {
            echo "RUN_ROOT=$verified_root"
            echo "VERIFIED_RUN_ROOT=$verified_root"
            echo "NGINX_FUNCTIONAL_A_PARENT_ROOT=$functional_parent"
            echo "NGINX_FUNCTIONAL_A_EVIDENCE_ROOT=$evidence_root"
            echo "XDG_STATE_HOME=$verified_root/state"
            echo "SOURCE_ROOT=$source_root"
            echo "BUILD_ROOT=$build_root"
            echo "TMP_ROOT=$verified_root/tmp"
            echo "LOG_ROOT=$verified_root/logs"
            echo "CONNECTOR_COMPONENT_CACHE=$verified_root/component-cache"
            echo "RUNTIME_REPORT_OUTPUT_ROOT=$build_root/runtime-component-reports"
            echo "NGINX_HARNESS_PARENT=$verified_root/nginx-harness"
            echo "MODSECURITY_SOURCE_DIR=$source_root/ModSecurity_V3"
            echo "MODSECURITY_V3_SOURCE_DIR=$source_root/ModSecurity_V3"
            echo "PYTHONPYCACHEPREFIX=$verified_root/python-pycache"
          } >> "$GITHUB_ENV"
          {
            echo "verified_root=$verified_root"
            echo "build_root=$build_root"
            echo "build_root_apache=$build_root_apache"
            echo "source_root=$source_root"
          } >> "$GITHUB_OUTPUT"

      - name: Lint and py-compile
        run: |
          make setup-dev
          make lint
          find modules/ModSecurity-test-Framework/tests/normalizers modules/ModSecurity-test-Framework/tests/runners modules/ModSecurity-test-Framework/ci -type f -name '*.py' -print0 | xargs -0 -r .venv/bin/python -P -m py_compile
          git diff --check

      - name: Sequential full smoke
        run: |
          set -eu
          make PYTHON="$PWD/.venv/bin/python" check-bounded-smoke-runtime-contract
          make fetch-deps
          case "${{ matrix.variant }}" in
            no-crs)
              SMOKE_PREPARE_TIMEOUT_SECONDS=3600 REFRESH=1 make test-smoke-sequential-no-crs
              ;;
            with-crs)
              SMOKE_PREPARE_TIMEOUT_SECONDS=3600 REFRESH=1 make test-smoke-sequential-with-crs
              ;;
            *)
              echo "unknown test variant: ${{ matrix.variant }}" >&2
              exit 1
              ;;
          esac

      - name: Upload smoke artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-smoke-sequential-${{ matrix.variant }}-artifacts
          retention-days: 1
          if-no-files-found: warn
          path: |
            ${{ steps.paths.outputs.build_root_apache }}/logs
            ${{ steps.paths.outputs.build_root_apache }}/results
            ${{ steps.paths.outputs.build_root }}/logs
            ${{ steps.paths.outputs.build_root }}/results
            ${{ steps.paths.outputs.build_root }}/runtime-component-reports
            ${{ steps.paths.outputs.build_root }}/bounded-smoke-*
            ${{ steps.paths.outputs.verified_root }}/nginx-functional-a-evidence

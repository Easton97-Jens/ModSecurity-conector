name: manual-heavy-runtime-validation

on:
  workflow_dispatch:
    inputs:
      on_demand:
        description: Run the archived specialist smoke catalog outside the automatic active inventory
        required: true
        default: false
        type: boolean
      cleanup_artifacts:
        description: Delete prior full-smoke artifacts before the run
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  cleanup-artifacts:
    if: ${{ inputs.on_demand && inputs.cleanup_artifacts }}
    name: Cleanup old smoke artifacts (${{ matrix.variant }})
    permissions:
      actions: write
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no-crs
          - with-crs
    steps:
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-full-smoke-sequential/cleanup-artifacts@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08
          caller-matrix: ${{ toJSON(matrix) }}
  manual-heavy-runtime-validation:
    if: ${{ always() && inputs.on_demand }}
    needs: cleanup-artifacts
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - no-crs
          - with-crs
    env:
      EXPECTED_PARENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NGINX_FUNCTIONAL_WORKER_USER: msconnector-nginx-functional
      NGINX_FUNCTIONAL_WORKER_GROUP: msconnector-nginx-functional
      MODSECURITY_REPO_URL: https://github.com/owasp-modsecurity/ModSecurity.git
      BUILD_HTTPD_FROM_SOURCE: "1"
      BUILD_PCRE2_FROM_SOURCE: "1"
      BUILD_NGINX_FROM_SOURCE: "1"
      NGINX_SOURCE_MODE: github-release
      NGINX_SOURCE_REPO_URL: https://github.com/nginx/nginx
      NGINX_RELEASE_TAG: release-1.31.6
      NGINX_SOURCE_GIT_REF: release-1.31.6
      NGINX_RELEASE_ASSET_NAME: nginx-1.31.6.tar.gz
      NGINX_SHA256: 974ed5298a5e398e008704ed5db284e655fc270c596493dbccada452448fc9f1
      NGINX_REQUIRE_PINNED_PROVENANCE: "1"
      SMOKE_PREPARE_TIMEOUT_SECONDS: "3600"
      SMOKE_LOCK_MODE: wait
      SMOKE_LOCK_TIMEOUT_SECONDS: "1800"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-full-smoke-sequential/manual-heavy-runtime-validation@a209e5e44be60b578a87a30fc85badcf7bdcab08
        with:
          framework-revision: a209e5e44be60b578a87a30fc85badcf7bdcab08
          caller-matrix: ${{ toJSON(matrix) }}

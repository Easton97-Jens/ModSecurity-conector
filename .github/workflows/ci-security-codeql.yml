name: CodeQL security analysis

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-go-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: setup-python
        name: Set up canonical Python for the Go resolver
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - id: version
        name: Resolve latest stable Go version from the trusted base
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          go_report="$(python3 scripts/update-go-version.py --check --json)"
          printf '%s\n' "$go_report"
          GO_REPORT="$go_report" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          data = json.loads(os.environ["GO_REPORT"])
          pattern = re.compile(
              r"^(?P<major>[1-9][0-9]*)\.(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)$"
          )

          def version_tuple(value):
              if not isinstance(value, str):
                  raise SystemExit("trusted Go resolver returned a non-string version")
              match = pattern.fullmatch(value)
              if match is None:
                  raise SystemExit("trusted Go resolver returned an invalid version")
              return tuple(int(match.group(part)) for part in ("major", "minor", "patch"))

          current = data.get("current_version")
          latest = data.get("latest_version")
          update_available = data.get("update_available")
          status = data.get("status")
          if version_tuple(latest) < version_tuple(current):
              raise SystemExit("trusted Go resolver returned a downgrade")
          if not isinstance(update_available, bool) or update_available != (latest != current):
              raise SystemExit("trusted Go resolver returned inconsistent update availability")
          if status != ("update_available" if update_available else "current"):
              raise SystemExit("trusted Go resolver returned inconsistent status")
          print(f"version={latest}")
          PY

  actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  envoy-go:
    needs: trusted-go-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.trusted-go-version.outputs.version }}
          check-latest: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          build-mode: manual
      - name: Build Envoy Go module
        working-directory: connectors/envoy/ext_proc
        run: go build ./...
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  traefik-go:
    needs: trusted-go-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.trusted-go-version.outputs.version }}
          check-latest: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          build-mode: manual
      - name: Build Traefik Go module
        working-directory: connectors/traefik/native_middleware
        run: go build ./...
      - name: Fuzz Traefik UDS frame parser
        working-directory: connectors/traefik/native_middleware
        run: GOTOOLCHAIN=local go test -mod=readonly -run='^$' -fuzz='^FuzzUDSFrameAndResult$' -fuzztime=15s -parallel=1 .
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

  bounded-c-cpp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build bounded C17 common helper scope
        run: make check-common-helpers-c17
      - name: Fuzz Common HTTP header parser
        run: make check-common-http-header-fuzz
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

name: CodeQL security analysis

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: '23 4 * * 3'
  workflow_dispatch:

permissions: {}

jobs:
  trusted-go-version:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Read the trusted-base pinned Framework identity
        id: framework-gitlink
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD:modules/ModSecurity-test-Framework)
          printf '%s\n' "$revision" | grep -Eq '^[a-f0-9]{40}$'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      # This compatibility branch reads only the checked-out trusted Parent base.
      # Its exact gitlink selects both legacy and migrated Framework layouts.
      - name: Bind migrated trusted-base Framework context when available
        if: ${{ hashFiles('modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py') != '' }}
        uses: ./modules/ModSecurity-test-Framework/.github/actions/connector-context
        with:
          framework-revision: ${{ steps.framework-gitlink.outputs.revision }}
      - id: setup-python
        name: Set up canonical Python for the Go resolver
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: |
          set -eu
          migrated=modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py
          legacy=ci/checks/common/check-python-interpreter-contract.py
          if [ -f "$migrated" ] && [ ! -L "$migrated" ]; then
            python3 -P "$migrated" --version-file .python-version --expected-python "$EXPECTED_PYTHON"
          elif [ -f "$legacy" ] && [ ! -L "$legacy" ]; then
            # Before migration, this fixed stdlib checker belongs to the trusted base.
            python3 -I "$legacy" --version-file .python-version --expected-python "$EXPECTED_PYTHON"
          else
            echo 'Trusted base has no supported Python interpreter contract' >&2
            exit 1
          fi
      - id: version
        name: Resolve latest stable Go version from the trusted base
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          go_report="$(python3 scripts/update-go-version.py --check --json)"
          printf '%s\n' "$go_report"
          GO_REPORT="$go_report" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re

          data = json.loads(os.environ["GO_REPORT"])
          pattern = re.compile(
              r"^(?P<major>[1-9][0-9]*)\.(?P<minor>0|[1-9][0-9]*)\."
              r"(?P<patch>0|[1-9][0-9]*)$"
          )

          def version_tuple(value):
              if not isinstance(value, str):
                  raise SystemExit("trusted Go resolver returned a non-string version")
              match = pattern.fullmatch(value)
              if match is None:
                  raise SystemExit("trusted Go resolver returned an invalid version")
              return tuple(int(match.group(part)) for part in ("major", "minor", "patch"))

          current = data.get("current_version")
          latest = data.get("latest_version")
          update_available = data.get("update_available")
          status = data.get("status")
          if version_tuple(latest) < version_tuple(current):
              raise SystemExit("trusted Go resolver returned a downgrade")
          if not isinstance(update_available, bool) or update_available != (latest != current):
              raise SystemExit("trusted Go resolver returned inconsistent update availability")
          if status != ("update_available" if update_available else "current"):
              raise SystemExit("trusted Go resolver returned inconsistent status")
          print(f"version={latest}")
          PY

  actions:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  envoy-go:
    needs: trusted-go-version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.trusted-go-version.outputs.version }}
          check-latest: false
          cache-dependency-path: |
            connectors/envoy/ext_proc/go.mod
            connectors/envoy/ext_proc/go.sum
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual
      - name: Build Envoy Go module
        working-directory: connectors/envoy/ext_proc
        run: go build ./...
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  traefik-go:
    needs: trusted-go-version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: Read the pinned Framework identity
        id: framework-gitlink
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD:modules/ModSecurity-test-Framework)
          printf '%s\n' "$revision" | grep -Eq '^[a-f0-9]{40}$'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Bind explicit pinned Framework test context
        uses: ./modules/ModSecurity-test-Framework/.github/actions/connector-context
        with:
          framework-revision: ${{ steps.framework-gitlink.outputs.revision }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.trusted-go-version.outputs.version }}
          check-latest: false
          cache-dependency-path: connectors/traefik/native_middleware/go.mod
      - name: Set up canonical Python for active selection
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: manual
      - name: Build Traefik Go module
        working-directory: connectors/traefik/native_middleware
        run: go build ./...
      - name: Execute inventoried Traefik parser and cancellation security regressions
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/run-active-tests.py --module connectors/traefik/native_middleware
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  bounded-c-cpp:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
          persist-credentials: false
      - name: Read the pinned Framework identity
        id: framework-gitlink
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD:modules/ModSecurity-test-Framework)
          printf '%s\n' "$revision" | grep -Eq '^[a-f0-9]{40}$'
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Bind explicit pinned Framework test context
        uses: ./modules/ModSecurity-test-Framework/.github/actions/connector-context
        with:
          framework-revision: ${{ steps.framework-gitlink.outputs.revision }}
      - name: Set up canonical Python for active selection
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      # Run ASan before CodeQL installs its process-tracing LD_PRELOAD.
      - name: Execute inventoried Common parser and memory security regressions
        run: python3 -P modules/ModSecurity-test-Framework/connector_suite/modsecurity_connector_ci/tools/run-active-tests.py --group common
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build bounded C17 common helper scope
        run: make build-codeql-common-scope
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

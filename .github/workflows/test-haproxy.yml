name: test-haproxy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  haproxy-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify HAProxy libModSecurity compile-and-link compatibility
        run: |
          set -eu
          python3 tests/test_haproxy_libmodsecurity_compat.py
      - name: Check HAProxy scaffold
        run: |
          set -eu
          test -f connectors/haproxy/README.md
          test -f connectors/haproxy/TODO.md
          test -f docs/connectors/haproxy.md
          test -f tests/test_haproxy_libmodsecurity_compat.py
          grep -q 'Status:' connectors/haproxy/TODO.md

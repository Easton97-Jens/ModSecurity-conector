name: test-haproxy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  haproxy-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          check-latest: false
      - name: Verify Python interpreter contract
        env:
          EXPECTED_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: python3 ci/checks/common/check-python-interpreter-contract.py --version-file .python-version --expected-python "$EXPECTED_PYTHON"
      - name: Verify HAProxy libModSecurity compile-and-link compatibility
        run: |
          set -eu
          python3 tests/test_haproxy_libmodsecurity_compat.py
      - name: Check HAProxy scaffold
        run: |
          set -eu
          test -f connectors/haproxy/README.md
          test -f connectors/haproxy/TODO.md
          test -f docs/connectors/haproxy.md
          test -f tests/test_haproxy_libmodsecurity_compat.py
          grep -q 'Status:' connectors/haproxy/TODO.md
      - name: Collect host runtime preflight evidence
        if: always()
        env:
          CONNECTOR: haproxy
          RUNTIME_LOCK: modules/ModSecurity-test-Framework/ci/provisioning/runtime-component-lock.json
        run: |
          set -u
          python3 ci/runtime/common/collect_hostruntime_preflight_evidence.py \
            --connector "$CONNECTOR" \
            --runtime-lock "$RUNTIME_LOCK" \
            --runner-temp "$RUNNER_TEMP" \
            --binary-name haproxy \
            --profile haproxy-htx \
            --config connectors/haproxy/poc/spoe/haproxy.cfg.example \
            --fixture connectors/haproxy/harness/fixtures/modsecurity-binding-lifecycle.conf \
            --profile haproxy-spoe-spop \
            --config connectors/haproxy/poc/spoe/haproxy.cfg.example \
            --fixture connectors/haproxy/harness/fixtures/modsecurity-binding-lifecycle.conf
      - name: Upload sanitized host runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: haproxy-hostruntime-evidence
          path: ${{ runner.temp }}/hostruntime-evidence/haproxy
          if-no-files-found: error

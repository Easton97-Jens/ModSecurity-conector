name: test-haproxy

on:
  push:
  pull_request:

permissions: {}

jobs:
  haproxy-structure:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Execute pinned Framework test orchestration
        id: framework-ci
        if: ${{ always() }}
        uses: Easton97-Jens/ModSecurity-test-Framework/.github/actions/connector-ci/test-haproxy/haproxy-structure@cc8af0427c49ef32701220748caf35dad7940246
        with:
          framework-revision: cc8af0427c49ef32701220748caf35dad7940246
